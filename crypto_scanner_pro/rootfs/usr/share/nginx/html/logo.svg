<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 46" fill="none">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Grid lines (faint) -->
  <line x1="1" y1="12" x2="44" y2="12" stroke="#1a3a4a" stroke-width="0.5"/>
  <line x1="1" y1="23" x2="44" y2="23" stroke="#1a3a4a" stroke-width="0.5"/>
  <line x1="1" y1="34" x2="44" y2="34" stroke="#1a3a4a" stroke-width="0.5"/>
  <line x1="11" y1="4" x2="11" y2="44" stroke="#1a3a4a" stroke-width="0.5"/>
  <line x1="22" y1="4" x2="22" y2="44" stroke="#1a3a4a" stroke-width="0.5"/>
  <line x1="33" y1="4" x2="33" y2="44" stroke="#1a3a4a" stroke-width="0.5"/>

  <!-- Candlestick 1 -->
  <line x1="6" y1="10" x2="6" y2="42" stroke="#00C8FF" stroke-width="1" filter="url(#glow)"/>
  <rect x="4" y="20" width="4" height="14" fill="#00C8FF" filter="url(#glow)"/>

  <!-- Candlestick 2 (tallest) -->
  <line x1="17" y1="5" x2="17" y2="38" stroke="#00C8FF" stroke-width="1" filter="url(#glow)"/>
  <rect x="15" y="10" width="4" height="20" fill="#00C8FF" filter="url(#glow)"/>

  <!-- Candlestick 3 -->
  <line x1="28" y1="9" x2="28" y2="40" stroke="#00C8FF" stroke-width="1" filter="url(#glow)"/>
  <rect x="26" y="18" width="4" height="13" fill="#00C8FF" filter="url(#glow)"/>

  <!-- Candlestick 4 -->
  <line x1="39" y1="14" x2="39" y2="44" stroke="#00C8FF" stroke-width="1" filter="url(#glow)"/>
  <rect x="37" y="22" width="4" height="12" fill="#00C8FF" filter="url(#glow)"/>

  <!-- Diagonal scan line with arrow -->
  <line x1="2" y1="43" x2="42" y2="4" stroke="#00C8FF" stroke-width="1.5" filter="url(#glow2)"/>
  <!-- Arrowhead -->
  <polygon points="42,4 35,9 38,13" fill="#00C8FF" filter="url(#glow2)"/>

  <!-- CRYPTO SCANNER -->
  <text x="54" y="21" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="19" fill="white" letter-spacing="0.3">CRYPTO SCANNER</text>
  <!-- PRO -->
  <text x="54" y="33" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="11" fill="#00C8FF" letter-spacing="1.5">PRO</text>
  <!-- Subtitle -->
  <text x="54" y="43" font-family="'Segoe UI',Arial,sans-serif" font-size="7" fill="#6B7280" letter-spacing="2.8">REAL-TIME MARKET INTELLIGENCE</text>
</svg>
