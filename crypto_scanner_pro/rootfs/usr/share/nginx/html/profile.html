<script src="/i18n.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { background:#0B0E11; color:#E5E7EB; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; margin:0; }
  .card { background:#161A1E; border:1px solid #2A2E39; border-radius:8px; padding:20px 24px; margin-bottom:16px; }
  .field-label { font-size:12px; color:#9CA3AF; margin-bottom:6px; font-weight:500; letter-spacing:.3px; }
  .field-input { width:100%; background:#1E222D; border:1px solid #374151; border-radius:6px; padding:9px 12px; font-size:13px; color:#E5E7EB; outline:none; transition:border-color .15s; }
  .field-input:focus { border-color:#3b82f6; }
  .field-input[readonly] { color:#6B7280; cursor:default; background:#161A1E; }
  .field-input::placeholder { color:#4B5563; }
  .btn { background:#2563eb; color:#fff; border:none; border-radius:6px; padding:10px 24px; font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; }
  .btn:hover { background:#1d4ed8; }
  .btn:disabled { background:#374151; color:#6B7280; cursor:not-allowed; }
  .section-title { font-size:13px; font-weight:700; color:#B2B5BE; margin-bottom:16px; display:flex; align-items:center; gap:8px; }
  .sep { height:1px; background:#2A2E39; margin:16px 0; }
  .msg { font-size:12px; padding:4px 0; min-height:18px; }
</style>
</head>
<body>
<div style="max-width:520px; margin:0 auto; padding:32px 16px;">

  <!-- Header -->
  <div style="display:flex; align-items:center; gap:12px; margin-bottom:28px;">
    <a href="javascript:history.back()" style="color:#6B7280; text-decoration:none; font-size:13px; display:flex; align-items:center; gap:4px;">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      <span data-i18n="prof_back">Indietro</span>
    </a>
    <span style="color:#374151;">|</span>
    <span style="font-size:16px; font-weight:700; color:#E5E7EB;" data-i18n="prof_title">Profilo</span>
    <div style="margin-left:auto; display:flex; align-items:center; gap:3px;">
      <button data-lang-btn="it" onclick="switchLang('it')" style="font-size:11px;background:none;border:none;cursor:pointer;padding:2px 4px;color:#9CA3AF;font-family:inherit;border-radius:3px;">IT</button>
      <span style="color:#374151;font-size:10px;">|</span>
      <button data-lang-btn="en" onclick="switchLang('en')" style="font-size:11px;background:none;border:none;cursor:pointer;padding:2px 4px;color:#9CA3AF;font-family:inherit;border-radius:3px;">EN</button>
    </div>
  </div>

  <!-- Avatar + info -->
  <div class="card">
    <div style="display:flex; align-items:center; gap:16px; margin-bottom:20px;">
      <div style="width:52px; height:52px; background:#1E222D; border-radius:50%; display:flex; align-items:center; justify-content:center; border:1px solid #374151; flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="28" height="28" style="color:#9CA3AF;"><path fill="currentColor" d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"></path></svg>
      </div>
      <div>
        <div id="profile-username" style="font-size:16px; font-weight:700; color:#E5E7EB;">—</div>
        <span id="profile-role-badge" style="display:inline-block; margin-top:4px; background:#1e3a5f; color:#60a5fa; font-size:10px; font-weight:600; padding:2px 10px; border-radius:12px;">—</span>
      </div>
    </div>

    <div class="sep" style="margin-top:0;"></div>

    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span data-i18n="prof_account">Dati account</span>
    </div>

    <div style="margin-bottom:14px;">
      <div class="field-label">Username</div>
      <input id="input-username" class="field-input" type="text" readonly>
    </div>

    <div style="margin-bottom:4px;">
      <div class="field-label">Email</div>
      <input id="input-email" class="field-input" type="email" data-i18n-placeholder="prof_email_ph" placeholder="es. info@cryptoscannerpro.com">
    </div>

    <div style="display:flex; align-items:center; gap:12px; margin-top:18px;">
      <button class="btn" onclick="saveProfile()" data-i18n="prof_save">Salva</button>
      <span id="profile-msg" class="msg"></span>
    </div>
  </div>

  <!-- Password change -->
  <div class="card">
    <div class="section-title">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span data-i18n="prof_change_pw">Cambia password</span>
    </div>

    <div style="margin-bottom:14px;">
      <div class="field-label" data-i18n="prof_current_pw">Password attuale</div>
      <input id="pw-current" class="field-input" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div style="margin-bottom:14px;">
      <div class="field-label" data-i18n="prof_new_pw">Nuova password</div>
      <input id="pw-new" class="field-input" type="password" data-i18n-placeholder="prof_pw_min" placeholder="Min. 6 caratteri" autocomplete="new-password">
    </div>
    <div style="margin-bottom:18px;">
      <div class="field-label" data-i18n="prof_confirm_pw">Conferma nuova password</div>
      <input id="pw-confirm" class="field-input" type="password" data-i18n-placeholder="prof_repeat_ph" placeholder="Ripeti la nuova password" autocomplete="new-password">
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <button id="btn-pw" class="btn" onclick="changePassword()" data-i18n="prof_update_pw">Aggiorna password</button>
      <span id="pw-msg" class="msg"></span>
    </div>
  </div>

</div>

<script>
async function loadProfile() {
  try {
    const d = await fetch('/api/auth/profile').then(r => r.json());
    document.getElementById('profile-username').textContent = d.username || 'admin';
    document.getElementById('input-username').value = d.username || 'admin';
    document.getElementById('input-email').value = d.email || '';
    const badge = document.getElementById('profile-role-badge');
    badge.textContent = d.role === 'admin' ? window.t('prof_admin') : (d.role || '');
  } catch(e) { console.error(e); }
}

async function saveProfile() {
  const email = document.getElementById('input-email').value.trim();
  const msg = document.getElementById('profile-msg');
  try {
    const d = await fetch('/api/auth/profile', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email })
    }).then(r => r.json());
    if (d.success) { msg.textContent = window.t('prof_saved'); msg.style.color = '#10b981'; }
    else { msg.textContent = window.t('prof_error'); msg.style.color = '#ef4444'; }
  } catch(e) { msg.textContent = window.t('prof_net_error'); msg.style.color = '#ef4444'; }
  setTimeout(() => msg.textContent = '', 3000);
}

async function changePassword() {
  const curr = document.getElementById('pw-current').value;
  const newpw = document.getElementById('pw-new').value;
  const conf = document.getElementById('pw-confirm').value;
  const msg = document.getElementById('pw-msg');
  const btn = document.getElementById('btn-pw');
  if (!curr || !newpw || !conf) { msg.textContent = window.t('prof_fill_all'); msg.style.color = '#ef4444'; return; }
  if (newpw !== conf) { msg.textContent = window.t('prof_pw_mismatch'); msg.style.color = '#ef4444'; return; }
  if (newpw.length < 6) { msg.textContent = window.t('prof_pw_short'); msg.style.color = '#ef4444'; return; }
  btn.disabled = true; btn.textContent = window.t('prof_updating');
  try {
    const d = await fetch('/api/auth/change-password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ current: curr, new: newpw })
    }).then(r => r.json());
    if (d.success) {
      msg.textContent = window.t('prof_pw_updated'); msg.style.color = '#10b981';
      document.getElementById('pw-current').value = '';
      document.getElementById('pw-new').value = '';
      document.getElementById('pw-confirm').value = '';
    } else { msg.textContent = '⚠ ' + (d.error || window.t('prof_error')); msg.style.color = '#ef4444'; }
  } catch(e) { msg.textContent = window.t('prof_net_error'); msg.style.color = '#ef4444'; }
  finally { btn.disabled = false; btn.textContent = window.t('prof_update_pw'); }
  setTimeout(() => msg.textContent = '', 4000);
}

loadProfile();
</script>
</body>
</html>
