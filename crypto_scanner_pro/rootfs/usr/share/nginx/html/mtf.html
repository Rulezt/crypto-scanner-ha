// ── Trendline pannelli (condivisa fra pannelli TF — non unificata, vedi draw-tools.js) ──
// timeToCoordinate() di lightweight-charts torna null se il time passato non è
// esattamente quello di una candela caricata su QUELLA serie. Le trendline sono
// condivise fra pannelli con TF diversi (es. punto preso su 1h, disegnato anche su D),
// quindi il tempo quasi mai coincide con una candela esatta del pannello di destinazione:
// serve interpolare/estrapolare un indice logico frazionario dalle candele del pannello.
//
// Bug reale trovato (2026-07-29): logicalToCoordinate() della libreria funziona SOLO con
// indici interi — con un indice frazionario ritorna silenziosamente 0 invece di interpolare,
// facendo collassare i pallini sul bordo sinistro dopo un trascinamento (il tempo risultante
// da un drag quasi mai coincide con una candela esatta). Fix: si interpola manualmente in
// PIXEL fra i due indici interi che racchiudono il tempo, non l'indice frazionario stesso.
function _timeToXRobust(s, t) {
  const direct = s.chart.timeScale().timeToCoordinate(t);
  if (direct != null) return direct;
  const kl = s.klines;
  if (!kl || kl.length < 2) return null;
  let loIdx, hiIdx, frac;
  if (t <= kl[0].time) {
    loIdx = 0; hiIdx = 1;
    const dt = kl[1].time - kl[0].time;
    frac = dt ? (t - kl[0].time) / dt : 0;
  } else if (t >= kl[kl.length - 1].time) {
    const n = kl.length;
    loIdx = n - 2; hiIdx = n - 1;
    const dt = kl[n-1].time - kl[n-2].time;
    frac = dt ? 1 + (t - kl[n-1].time) / dt : 1;
  } else {
    let lo = 0, hi = kl.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (kl[mid].time <= t) lo = mid; else hi = mid; }
    loIdx = lo; hiIdx = hi;
    const dt = kl[hi].time - kl[lo].time;
    frac = dt ? (t - kl[lo].time) / dt : 0;
  }
  try {
    const xLo = s.chart.timeScale().logicalToCoordinate(loIdx);
    const xHi = s.chart.timeScale().logicalToCoordinate(hiIdx);
    if (xLo == null || xHi == null) return null;
    return xLo + (xHi - xLo) * frac;
  } catch(e) { return null; }
}

// Inversa di _timeToXRobust: da un indice logico (anche frazionario/fuori range, es.
// nello spazio vuoto oltre l'ultima candela riservato da rightOffset) stima il tempo
// corrispondente estrapolando linearmente dal passo delle candele del pannello.
function _logicalToTimeRobust(s, logicalIdx) {
  const kl = s.klines;
  if (!kl || kl.length < 2) return null;
  const n = kl.length;
  if (logicalIdx <= 0) {
    const dt = kl[1].time - kl[0].time;
    return kl[0].time + dt * logicalIdx;
  } else if (logicalIdx >= n - 1) {
    const dt = kl[n-1].time - kl[n-2].time;
    return kl[n-1].time + dt * (logicalIdx - (n - 1));
  } else {
    const lo = Math.floor(logicalIdx), hi = lo + 1, frac = logicalIdx - lo;
    const dt = kl[hi].time - kl[lo].time;
    return kl[lo].time + dt * frac;
  }
}

// La trendline è una retta infinita in spazio tempo/prezzo (pendenza = Δprezzo/Δt).
// Estenderla in PIXEL (come faceva _trendDrawExt) collassa quando un pannello è molto
// più "zoomato indietro" di quello su cui è stata tracciata: pochi minuti/ore occupano
// meno di un pixel, la retta estesa per pendenza-pixel diventa verticale e schizza fuori
// dal canvas subito, invisibile. Si valuta invece la retta ai bordi della vista TEMPORALE
// del pannello (getVisibleRange) e si convertono quei due punti tempo/prezzo in pixel:
// così la linea attraversa sempre l'intera larghezza visibile, su qualunque TF.
//
// Bug reale trovato (2026-07-29, round 2): getVisibleRange() ritorna il range delle
// CANDELE visibili, non dei pixel del canvas — con rightOffset>0 (spazio vuoto dopo
// l'ultima candela, sempre configurato in questo progetto) il bordo destro reale del
// canvas è più a destra dell'ultima candela. La linea si fermava lì, mai al vero bordo
// ("non estendono più verso destra"). Fix: usare coordinateToLogical(0)/coordinateToLogical(W)
// per ottenere l'indice logico ESATTO ai due bordi pixel del canvas (funziona anche nello
// spazio vuoto, lightweight-charts estrapola l'indice oltre i dati reali), poi convertirlo
// in tempo con _logicalToTimeRobust — così x1/x2 sono SEMPRE 0 e W per costruzione.
function _trendLineEdgePts(s, tl) {
  const W = s.trendCanvas.width;
  if (!W) return null;
  // La retta si ferma al bordo del pannello candele, prima della colonna prezzo
  // (il canvas del tool è largo quanto l'intero container, asse compreso).
  let paneW = W;
  try { const aw = s.chart.priceScale('right').width(); if (Number.isFinite(aw)) paneW = Math.max(0, W - aw); } catch(e) {}
  if (tl.t2 === tl.t1) {
    const x = _timeToXRobust(s, tl.t1);
    if (x == null) return null;
    return { x1: x, y1: 0, x2: x, y2: s.trendCanvas.height || 1 };
  }
  const ts = s.chart.timeScale();
  let logical0, logicalW;
  try { logical0 = ts.coordinateToLogical(0); logicalW = ts.coordinateToLogical(paneW); }
  catch(e) { return null; }
  if (logical0 == null || logicalW == null) return null;
  const tLeft = _logicalToTimeRobust(s, logical0), tRight = _logicalToTimeRobust(s, logicalW);
  if (tLeft == null || tRight == null) return null;
  const slope = (tl.p2 - tl.p1) / (tl.t2 - tl.t1); // prezzo per secondo
  const pA = tl.p1 + slope * (tLeft  - tl.t1);
  const pB = tl.p1 + slope * (tRight - tl.t1);
  const x1 = 0, y1 = s.candleS.priceToCoordinate(pA);
  const x2 = paneW, y2 = s.candleS.priceToCoordinate(pB);
  if (y1==null||y2==null) return null;
  return { x1, y1, x2, y2 };
}

// Interseca il segmento (x1,y1)-(x2,y2) con la fascia orizzontale visibile [0,H] e
// ritorna quanti pixel di larghezza (asse x) occupa la porzione realmente dentro al
// canvas. Una trendline disegnata su un TF molto più "stretto" di quello del pannello
// (es. tracciata su 1h, vista su Monthly) ha pendenza fortissima in questo sistema di
// coordinate: quasi tutta la retta cade fuori dal canvas e resta visibile solo una
// scheggia larga pochi pixel vicino a un bordo — inutile e brutta da vedere. La si
// nasconde su quel pannello invece di disegnarla (vedi soglia in _trendDrawAll).
function _trendVisibleXSpan(pts, H) {
  const { x1, y1, x2, y2 } = pts;
  const dy = y2 - y1;
  let t0 = 0, t1 = 1;
  if (dy !== 0) {
    const tA = (0 - y1) / dy, tB = (H - y1) / dy;
    t0 = Math.max(t0, Math.min(tA, tB));
    t1 = Math.min(t1, Math.max(tA, tB));
  } else if (y1 < 0 || y1 > H) {
    return 0;
  }
  if (t0 >= t1) return 0;
  const xa = x1 + t0 * (x2 - x1), xb = x1 + t1 * (x2 - x1);
  return Math.abs(xb - xa);
}

function _trendDrawAll(s) {
  _syncClearBtn(s);
  const canvas = s.trendCanvas; DrawTools.trendSync(canvas);
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  for (const tl of s.trendlines) {
    try {
      const pts = _trendLineEdgePts(s, tl);
      if (!pts) continue;
      // Soglia assoluta (pochi pixel), non percentuale sulla larghezza: x1/x2 sono
      // SEMPRE i bordi del canvas per costruzione (_trendLineEdgePts valuta la retta
      // ai bordi della vista temporale) — una soglia al 15% della larghezza (es. 45px
      // su un pannello griglia da 300px) nascondeva anche linee ampiamente visibili ma
      // il cui tratto entro il range di prezzo corrente non riempiva quella percentuale,
      // es. quando il pannello ha uno zoom di prezzo stretto: bug reale, linee sparivano
      // o sembravano non arrivare più al bordo destro. Nasconde solo la vera "scheggia".
      if (_trendVisibleXSpan(pts, H) < 6) continue;
      ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(pts.x1, pts.y1); ctx.lineTo(pts.x2, pts.y2); ctx.stroke();
      // marker sui due punti originali, solo se ricadono nella vista di questo pannello
      const ox1 = _timeToXRobust(s, tl.t1), oy1 = s.candleS.priceToCoordinate(tl.p1);
      const ox2 = _timeToXRobust(s, tl.t2), oy2 = s.candleS.priceToCoordinate(tl.p2);
      ctx.fillStyle = '#22c55e';
      if (ox1!=null && oy1!=null) { ctx.beginPath(); ctx.arc(ox1, oy1, 4, 0, Math.PI*2); ctx.fill(); }
      if (ox2!=null && oy2!=null) { ctx.beginPath(); ctx.arc(ox2, oy2, 4, 0, Math.PI*2); ctx.fill(); }
    } catch(ex) {}
  }
  if (s._trendP1 && s._trendPrev) {
    try {
      const x1 = s.chart.timeScale().timeToCoordinate(s._trendP1.t), y1 = s.candleS.priceToCoordinate(s._trendP1.p);
      if (x1!=null && y1!=null) {
        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1; ctx.setLineDash([5,3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(s._trendPrev.x, s._trendPrev.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();
      }
    } catch(ex) {}
  }
}

// Ridisegna a ogni frame invece che sul solo evento visibleTimeRangeChange:
// il drag della price-scale e il pan non generano quell'evento in modo
// continuo, quindi le linee restavano ferme o disallineate dalle candele.
function _trendEnsureRAF(s) {
  if (s._trendRAF) return;
  const tick = () => {
    if (!s.chart || !s.candleS || (!s.trendlines.length && !s.trendActive)) { s._trendRAF = null; return; }
    _trendDrawAll(s);
    s._trendRAF = requestAnimationFrame(tick);
  };
  s._trendRAF = requestAnimationFrame(tick);
}

function _trendNearest(s, cx, cy) {
  const rect = s.trendCanvas.getBoundingClientRect(), mx = cx-rect.left, my = cy-rect.top;
  let best = null, bestDist = DrawTools.TREND_HIT, bestPart = 'line';
  for (const tl of s.trendlines) {
    try {
      const x1 = _timeToXRobust(s, tl.t1), y1 = s.candleS.priceToCoordinate(tl.p1);
      const x2 = _timeToXRobust(s, tl.t2), y2 = s.candleS.priceToCoordinate(tl.p2);
      if (x1==null||y1==null||x2==null||y2==null) continue;
      const d1 = Math.hypot(mx-x1, my-y1), d2 = Math.hypot(mx-x2, my-y2);
      // if/else-if/else, NON tre if indipendenti: vicino a un pallino la distanza
      // perpendicolare alla retta può risultare più piccola di quella dal pallino
      // stesso (il pallino sta sulla linea) e "rubare" il match — priorità ai pallini.
      // La linea è trascinabile/cancellabile solo sul segmento REALE fra i due punti
      // disegnati, non sulla sua estensione proiettata (quella resta solo visiva).
      if (d1 <= DrawTools.TREND_HIT && d1 < bestDist) { best = tl; bestDist = d1; bestPart = 'p1'; }
      else if (d2 <= DrawTools.TREND_HIT && d2 < bestDist) { best = tl; bestDist = d2; bestPart = 'p2'; }
      else { const dl = DrawTools.ptSegDist(mx, my, x1, y1, x2, y2); if (dl < bestDist) { best = tl; bestDist = dl; bestPart = 'line'; } }
    } catch(ex) {}
  }
  return best ? { tl: best, part: bestPart } : null;
}

function toggleSlotTrend(idx) {
  const s = slots[idx]; if (!s) return;
  _toggleTrendForSurface(s, {
    onDeactivateSiblings: () => { if (s.rangeActive) toggleSlotRange(idx); if (s.hlineActive) toggleSlotHline(idx); },
  });
}

// Generica: opera su un "surface" (pannello griglia o _fsTrendSurface a schermo intero),
// entrambi condividono lo stesso array sharedTrendlines — vedi _fsTrendSurface.trendlines.
function _toggleTrendForSurface(s, opts = {}) {
  if (!s.trendActive) { if (opts.onDeactivateSiblings) opts.onDeactivateSiblings(); }
  s.trendActive = !s.trendActive;
  s.trendBtn.style.color = s.trendActive ? '#22c55e' : '#4B5563';
  if (s._trendMD) { s.trendCanvas.removeEventListener('mousedown', s._trendMD); s._trendMD = null; }
  if (s._trendMM) { document.removeEventListener('mousemove', s._trendMM); s._trendMM = null; }
  if (s._trendMU) { document.removeEventListener('mouseup', s._trendMU); s._trendMU = null; }
  if (s._trendCM) { s.trendCanvas.removeEventListener('contextmenu', s._trendCM); s._trendCM = null; }
  s._trendP1 = null; s._trendPrev = null; s._trendDrag = null; s._trendPending = null; s._trendP1DownPx = null;
  s.trendCanvas.style.pointerEvents = s.trendActive ? 'auto' : 'none';
  s.trendCanvas.style.cursor = s.trendActive ? 'crosshair' : '';
  _trendEnsureRAF(s);
  _trendDrawAll(s);
  if (!s.trendActive) return;
  const toggleOff = () => _toggleTrendForSurface(s, opts);
  s._trendMD = e => {
    if (e.button !== 0) return; e.preventDefault();
    const rect = s.trendCanvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    const hit = _trendNearest(s, e.clientX, e.clientY);
    if (hit && !s._trendP1) {
      // Non decidere subito se è drag o un click per iniziare una nuova linea:
      // serve poter piazzare due trendline dallo stesso punto esatto (vedi mousemove/mouseup).
      s._trendPending = { hit, px, py };
    } else if (!s._trendP1) {
      const r = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, px, py);
      if (r) { s._trendP1 = r; s._trendP1DownPx = { x: px, y: py }; }
    } else {
      const r2 = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, px, py, s._trendP1.t);
      if (r2) {
        s.trendlines.push({ t1: s._trendP1.t, p1: s._trendP1.p, t2: r2.t, p2: r2.p });
        _trendWakeAllSlots();
        _mtfSaveDrawings();
      }
      s._trendP1 = null; s._trendPrev = null;
      _trendDrawAll(s);
    }
  };
  s._trendMM = e => {
    const rect = s.trendCanvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    if (s._trendPending) {
      if (Math.hypot(px - s._trendPending.px, py - s._trendPending.py) <= DrawTools.TREND_CLICK_SLOP) return;
      const { hit, px: dpx0, py: dpy0 } = s._trendPending;
      if (hit.part !== 'line') { s._trendDrag = { tl: hit.tl, part: hit.part }; s.trendCanvas.style.cursor = 'grabbing'; }
      else {
        // Trascinamento dell'intera linea: si lavora in delta tempo/prezzo (non pixel),
        // così funziona anche su un pannello dove i due punti originali sono compressi
        // in pochi pixel o fuori vista (vedi _trendLineEdgePts).
        const vr = s.chart.timeScale().getVisibleRange();
        const secPerPx = vr ? (vr.to - vr.from) / (s.trendCanvas.width || 1) : 0;
        const y0 = s.candleS.priceToCoordinate(hit.tl.p1), y1 = s.candleS.priceToCoordinate(hit.tl.p1 + 1);
        const pxPerPriceUnit = (y0!=null && y1!=null) ? (y1 - y0) : null;
        s._trendDrag = {
          tl: hit.tl, part: 'line', sx: dpx0, sy: dpy0, secPerPx, pxPerPriceUnit,
          t1_0: hit.tl.t1, p1_0: hit.tl.p1, t2_0: hit.tl.t2, p2_0: hit.tl.p2,
        };
        s.trendCanvas.style.cursor = 'move';
      }
      s._trendPending = null;
    }
    if (s._trendDrag) {
      if (!(e.buttons & 1)) { s._trendDrag = null; return; }
      const { tl, part } = s._trendDrag;
      if (part === 'p1') { const r = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, px, py, tl.t2); if (r) { tl.t1=r.t; tl.p1=r.p; } }
      else if (part === 'p2') { const r = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, px, py, tl.t1); if (r) { tl.t2=r.t; tl.p2=r.p; } }
      else {
        const d = s._trendDrag;
        const dpx = px - d.sx, dpy = py - d.sy;
        const dt = dpx * d.secPerPx;
        const dp = d.pxPerPriceUnit ? (dpy / d.pxPerPriceUnit) : 0;
        tl.t1 = d.t1_0 + dt; tl.t2 = d.t2_0 + dt;
        tl.p1 = d.p1_0 + dp; tl.p2 = d.p2_0 + dp;
      }
      _trendDrawAll(s);
    } else if (s._trendP1) {
      s._trendPrev = { x: px, y: py };
      _trendDrawAll(s);
    } else {
      const hit = _trendNearest(s, e.clientX, e.clientY);
      s.trendCanvas.style.cursor = hit ? (hit.part === 'line' ? 'move' : 'grab') : 'crosshair';
    }
  };
  s._trendMU = e => {
    if (e.button !== 0) return;
    if (s._trendPending) {
      // Click senza drag su un punto/linea esistente → inizia una nuova trendline da qui.
      const { px: cpx, py: cpy } = s._trendPending;
      const r = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, cpx, cpy);
      if (r) { s._trendP1 = r; s._trendP1DownPx = { x: cpx, y: cpy }; }
      s._trendPending = null;
      return;
    }
    // Gesto naturale premi-trascina-rilascia (come gli altri strumenti di disegno):
    // se il rilascio è abbastanza lontano dal punto di partenza, completa subito la
    // linea qui, senza richiedere un terzo click separato.
    if (s._trendP1 && s._trendP1DownPx && !s._trendDrag) {
      const rect = s.trendCanvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
      const moved = Math.hypot(px - s._trendP1DownPx.x, py - s._trendP1DownPx.y);
      if (moved > DrawTools.TREND_CLICK_SLOP) {
        const r2 = DrawTools.trendPickPoint(s.chart, s.candleS, s.klines, px, py, s._trendP1.t);
        if (r2) {
          s.trendlines.push({ t1: s._trendP1.t, p1: s._trendP1.p, t2: r2.t, p2: r2.p });
          _trendWakeAllSlots();
          _mtfSaveDrawings();
        }
        s._trendP1 = null; s._trendPrev = null; s._trendP1DownPx = null;
        _trendDrawAll(s);
        return;
      }
    }
    s._trendDrag = null; s.trendCanvas.style.cursor = 'crosshair';
  };
  s._trendCM = e => {
    e.preventDefault();
    if (s._trendP1) { s._trendP1 = null; s._trendPrev = null; s._trendP1DownPx = null; _trendDrawAll(s); return; }
    const hit = _trendNearest(s, e.clientX, e.clientY);
    if (hit) {
      const hidx = s.trendlines.indexOf(hit.tl);
      if (hidx !== -1) s.trendlines.splice(hidx, 1);
      _trendRedrawAllSurfaces();
      _mtfSaveDrawings();
    }
    else toggleOff();
  };
  s.trendCanvas.addEventListener('mousedown', s._trendMD);
  document.addEventListener('mousemove', s._trendMM);
  document.addEventListener('mouseup', s._trendMU);
  s.trendCanvas.addEventListener('contextmenu', s._trendCM);
}

const _fsTrendSurface = {
  get trendActive() { return fsTrendActive; }, set trendActive(v) { fsTrendActive = v; },
  // Stesso array sharedTrendlines dei pannelli in griglia (const → mutazione in-place),
  // così una trendline disegnata in un pannello è subito visibile/editabile a schermo
  // intero e viceversa (usa la stessa logica robusta cross-TF: vedi _timeToXRobust).
  get trendlines() { return sharedTrendlines; },
  set trendlines(v) { sharedTrendlines.length = 0; sharedTrendlines.push(...v); },
  get trendCanvas() { return document.getElementById('fs-trend-canvas'); },
  get trendBtn() { return document.getElementById('fs-trend-btn'); },
  get chart() { return fsChart; },
  get candleS() { return fsCandleS; },
  get klines() { return fsKlines; },
  get _trendP1() { return _fsTrendP1; }, set _trendP1(v) { _fsTrendP1 = v; },
  get _trendPrev() { return _fsTrendPrev; }, set _trendPrev(v) { _fsTrendPrev = v; },
  get _trendPending() { return _fsTrendPending; }, set _trendPending(v) { _fsTrendPending = v; },
  get _trendMD() { return _fsTrendMD; }, set _trendMD(v) { _fsTrendMD = v; },
  get _trendMM() { return _fsTrendMM; }, set _trendMM(v) { _fsTrendMM = v; },
  get _trendMU() { return _fsTrendMU; }, set _trendMU(v) { _fsTrendMU = v; },
  get _trendCM() { return _fsTrendCM; }, set _trendCM(v) { _fsTrendCM = v; },
  get _trendDrag() { return _fsTrendDrag; }, set _trendDrag(v) { _fsTrendDrag = v; },
  get _trendRAF() { return _fsTrendRAF; }, set _trendRAF(v) { _fsTrendRAF = v; },
  syncClearBtn: () => _syncFsClearBtn(),
};
function toggleFsTrend() {
  _toggleTrendForSurface(_fsTrendSurface, {
    onDeactivateSiblings: () => { if (fsRangeActive) toggleFsRange(); if (fsHlineActive) toggleFsHline(); }
  });
}

// ── Price alert helpers ────────────────────────────────────────────────────────
function openAlertPopover(symbol, price, btn, slotIdx) {
  pendingAlert = { symbol, price, slotIdx };
  document.getElementById('alert-pop-symbol').textContent = symbol.replace('USDT','/USDT');
  document.getElementById('alert-pop-price').textContent  = fmtPrice(price);
  const pop  = document.getElementById('alert-popover');
  /* re-apply translations so popup always reflects current language */
  pop.querySelectorAll('[data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n');
    if (window.T && window.T[k] !== undefined) el.textContent = window.T[k];
  });
  const rect = btn.getBoundingClientRect();
  const left = Math.max(4, Math.min(rect.left - 230, window.innerWidth - 250));
  const top  = Math.max(52, rect.top - 130);
  pop.style.left    = left + 'px';
  pop.style.top     = top  + 'px';
  pop.style.display = 'block';
}

function closeAlertPopover() {
  document.getElementById('alert-popover').style.display = 'none';
  pendingAlert = null;
}

function setNotifyMode(mode) {
  notifyMode = mode;
  const both    = document.getElementById('notify-both');
  const browser = document.getElementById('notify-browser');
  if (mode === 'both') {
    both.style.background = '#1d4ed8'; both.style.color = '#fff';
    browser.style.background = '#1E222D'; browser.style.color = '#6B7280';
  } else {
    both.style.background = '#1E222D'; both.style.color = '#6B7280';
    browser.style.background = '#1d4ed8'; browser.style.color = '#fff';
  }
}

async function confirmAlert(condition) {
  if (!pendingAlert) return;
  const { symbol, price } = pendingAlert;
  try {
    const r = await fetch('api/price-alerts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ symbol, price, condition, notify: notifyMode }),
    });
    const j = await r.json();
    closeAlertPopover();
    if (j.success) {
      showToast(window.t('alert_set'));
      if (j.alert) {
        activeAlerts.push(j.alert);
        updateAlertsBadge();
        addAlertLineAllSlots(j.alert.id, price, condition);
      }
    } else {
      showToast('❌ ' + window.t('err_alert'));
    }
  } catch(e) { closeAlertPopover(); showToast('❌ ' + window.t('err_conn')); }
}

async function initNotifications() {
  if ('Notification' in window && Notification.permission === 'default')
    await Notification.requestPermission();
}

function fireBrowserNotification(alert) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const coin = alert.symbol.replace('USDT', '');
  const dir  = alert.condition === 'above' ? '📈' : '📉';
  new Notification(`${dir} Alert: ${coin}/USDT`, {
    body: `Prezzo ${alert.condition === 'above' ? 'sopra' : 'sotto'} ${alert.price}`,
  });
}

async function pollTriggeredAlerts() {
  try {
    const r = await fetch('api/price-alerts/recent-triggered');
    const j = await r.json();
    if (j.success && j.data && j.data.length) {
      for (const a of j.data) {
        fireBrowserNotification(a);
        for (const s of slots) {
          if (s.alertLines.has(a.id)) {
            try { s.candleS.removePriceLine(s.alertLines.get(a.id)); } catch(e) {}
            s.alertLines.delete(a.id);
          }
        }
        activeAlerts = activeAlerts.filter(x => x.id !== a.id);
      }
      updateAlertsBadge();
    }
  } catch(e) {}
  await syncAllAlertLines();
  setTimeout(pollTriggeredAlerts, 30000);
}

function addAlertLineAllSlots(alertId, price, condition) {
  for (const s of slots) {
    if (!s.candleS || s.alertLines.has(alertId)) continue;
    try {
      const pl = s.candleS.createPriceLine({
        price,
        color: condition === 'above' ? '#34d399' : '#f87171',
        lineWidth: 1,
        lineStyle: LC.LineStyle ? LC.LineStyle.Dashed : 2,
        axisLabelVisible: true,
        title: condition === 'above' ? '▲' : '▼',
      });
      s.alertLines.set(alertId, pl);
    } catch(e) {}
  }
}

async function syncAllAlertLines() {
  try {
    const r = await fetch('api/price-alerts');
    const j = await r.json();
    if (!j.success) return;
    activeAlerts = j.data;
    updateAlertsBadge();
    for (const a of j.data) {
      if (a.symbol === SYM) addAlertLineAllSlots(a.id, a.price, a.condition);
    }
  } catch(e) {}
}

function updateAlertsBadge() {
  const btn = document.getElementById('alerts-btn');
  if (!btn) return;
  const n = activeAlerts.filter(a => a.symbol === SYM).length;
  const svgBell = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="22" height="22" fill="none" style="display:block"><path fill="currentColor" d="M14 4c2.5 0 3 2.08 3 2.08 2.445 1.18 4 3.767 4 6.479v4.49a2.501 2.501 0 0 1-.244 4.938L20.5 22H17a3 3 0 1 1-6 0H7.5a2.5 2.5 0 0 1-.5-4.95v-4.491c0-2.712 1.554-5.3 4-6.479.002-.01.506-2.08 3-2.08m-2 18a2 2 0 1 0 4 0zm-4.5-4a1.5 1.5 0 0 0 0 3h13a1.5 1.5 0 0 0 0-3zM14 5c-.927 0-1.406.367-1.673.684a2 2 0 0 0-.35.617l-.008.026-.108.447-.426.206C9.35 7.986 8 10.213 8 12.56V17h12v-4.441c0-2.345-1.35-4.573-3.435-5.579l-.427-.206-.108-.448-.008-.025a2 2 0 0 0-.35-.617C15.406 5.367 14.927 5 14 5z"/></svg>`;
  btn.innerHTML = n > 0 ? `${svgBell}<span style="font-size:9px;line-height:1">${n}</span>` : svgBell;
  btn.style.cssText += ';display:flex;align-items:center;gap:2px;';
  btn.style.color = n > 0 ? '#fbbf24' : '#B2B5BE';
}

let _alertsPanelInterval = null;
function openAlertsPanel() {
  renderAlertsList();
  document.getElementById('alerts-panel').style.display = 'block';
  _alertsPanelInterval = setInterval(renderAlertsList, 2000);
}

function closeAlertsPanel() {
  document.getElementById('alerts-panel').style.display = 'none';
  clearInterval(_alertsPanelInterval);
}

function closePanelOutside(e) {
  if (e.target === document.getElementById('alerts-panel')) closeAlertsPanel();
}

function renderAlertsList() {
  const list = document.getElementById('alerts-list');
  if (!list) return;
  const mine = activeAlerts.filter(a => a.symbol === SYM);
  if (!mine.length) {
    list.innerHTML = '<div style="text-align:center;color:#6B7280;font-size:12px;padding:24px 0;">'+window.t('no_alert_active')+'</div>';
    return;
  }
  const _lp = (slots.find(s => s.lastPrice) || {}).lastPrice;
  list.innerHTML = mine.map(a => {
    const dirColor = a.condition === 'above' ? '#34d399' : '#f87171';
    const dirLabel = a.condition === 'above' ? window.t('alert_above_btn') : window.t('alert_below_btn');
    const notifyIcon = a.notify === 'browser' ? '🖥' : TGSVG;
    const dist = _lp ? ((a.price - _lp) / _lp * 100) : null;
    const distStr = dist !== null ? (dist >= 0 ? `+${dist.toFixed(2)}%` : `${dist.toFixed(2)}%`) : '';
    const distColor = dist >= 0 ? '#34d399' : '#f87171';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #1E222D;">
      <span style="font-size:11px;font-weight:700;color:#E5E7EB;min-width:70px;">${SYM.replace('USDT','/USDT')}</span>
      <span style="font-size:11px;color:${dirColor};font-weight:600;min-width:48px;">${dirLabel}</span>
      <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
        <span style="font-size:11px;font-family:monospace;color:#fbbf24;">${fmtPrice(a.price)}</span>
        ${distStr ? `<span style="font-size:10px;font-family:monospace;color:${distColor};">${distStr}</span>` : ''}
      </div>
      <span style="font-size:12px;" title="${a.notify === 'browser' ? window.t('notify_pc_only') : 'Telegram + PC'}">${notifyIcon}</span>
      <button onclick="deleteAlert('${a.id}')" style="background:#3f1515;color:#f87171;border:1px solid #7f1d1d;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;" onmouseenter="this.style.background='#7f1d1d'" onmouseleave="this.style.background='#3f1515'">✕</button>
    </div>`;
  }).join('');
}

async function deleteAlert(id) {
  try {
    await fetch(`api/price-alerts/${id}`, { method: 'DELETE' });
    for (const s of slots) {
      if (s.alertLines.has(id)) {
        try { s.candleS.removePriceLine(s.alertLines.get(id)); } catch(e) {}
        s.alertLines.delete(id);
      }
    }
    activeAlerts = activeAlerts.filter(a => a.id !== id);
    updateAlertsBadge();
    renderAlertsList();
  } catch(e) { showToast('❌ Errore eliminazione'); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E222D;color:#E5E7EB;padding:8px 18px;border-radius:6px;font-size:13px;z-index:900;border:1px solid #2A2E39;pointer-events:none;opacity:1;transition:opacity .3s;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 2500);
}

document.addEventListener('click', e => {
  const pop = document.getElementById('alert-popover');
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (!s.alertBtn || s.alertBtn.style.display === 'none') continue;
    const r = s.alertBtn.getBoundingClientRect();
    if (e.clientX >= r.left - 3 && e.clientX <= r.right  + 3 &&
        e.clientY >= r.top  - 3 && e.clientY <= r.bottom + 3) {
      const price = s.crosshairPrice || s.lastPrice;
      if (price) openAlertPopover(SYM, price, s.alertBtn, i);
      return;
    }
  }
  if (pop && pop.style.display !== 'none' && !pop.contains(e.target)) closeAlertPopover();
});

if (isMobile) {
  const mkBtn = (side, label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = fn;
    b.style.cssText = `position:fixed;${side}:0;bottom:72px;z-index:50;background:rgba(22,26,30,0.92);border:none;cursor:pointer;color:#6B7280;font-size:22px;padding:20px 16px;border-radius:${side==='left'?'0 6px 6px 0':'6px 0 0 6px'};`;
    document.body.appendChild(b);
  };
  mkBtn('left',  '‹', mobilePrevSlot);
  mkBtn('right', '›', mobileNextSlot);

  const ind = document.createElement('div');
  ind.id = 'mtf-indicator';
  ind.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(22,26,30,0.88);color:#B2B5BE;font-size:11px;padding:4px 14px;border-radius:12px;z-index:60;pointer-events:none;border:1px solid #2A2E39;';
  document.body.appendChild(ind);
  updateMTFIndicator();
}

<div id="csearch-modal"
     style="display:none;position:fixed;top:60px;left:50%;transform:translateX(-50%);z-index:2501;width:100%;max-width:480px;padding:0 16px;">
    <div style="background:#161A1E;border:1px solid #2A2E39;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.8);">
        <div style="display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #2A2E39;">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="#6B7280" stroke-width="2.5" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="csearch-input" type="text" autocomplete="off" spellcheck="false"
                placeholder="Cerca coin Bybit… (es. BTC, ETH, SOL)" data-i18n-placeholder="search_placeholder"
                style="flex:1;background:transparent;border:none;outline:none;color:#E5E7EB;font-size:13px;font-family:inherit;"
                oninput="onChartSearchInput(this.value)"
                onkeydown="onChartSearchKey(event)">
            <kbd onclick="closeChartSearch()"
                 style="font-size:10px;color:#6B7280;background:#1E222D;padding:2px 6px;border-radius:4px;border:1px solid #2A2E39;cursor:pointer;font-family:inherit;">ESC</kbd>
        </div>
        <div id="csearch-results" style="max-height:320px;overflow-y:auto;">
            <div style="padding:32px 0;text-align:center;font-size:11px;color:#4B5563;" data-i18n="csearch_init">Digita per cercare tra le crypto su Bybit</div>
        </div>
    </div>
</div>

</body>
</html>
