function getPriceFormat(price) {
  const p = Math.abs(price || 0);
  if (p >= 100)   return { type:'price', precision:2, minMove:0.01 };
  if (p >= 10)    return { type:'price', precision:3, minMove:0.001 };
  if (p >= 1)     return { type:'price', precision:4, minMove:0.0001 };
  if (p >= 0.1)   return { type:'price', precision:5, minMove:0.00001 };
  if (p >= 0.01)  return { type:'price', precision:6, minMove:0.000001 };
  if (p >= 0.001) return { type:'price', precision:7, minMove:0.0000001 };
  return            { type:'price', precision:8, minMove:0.00000001 };
}

function getEmaCfg() { try{const s=JSON.parse(localStorage.getItem('chart_ema_cfg'));if(s&&s.length===4)return s;}catch(e){}return DEFAULT_EMA_CFG.map(x=>({...x})); }
function getLvCfg() {

// ── Day separator lines ────────────────────────────────────────────────────────
function getDayTimestamps(klines) {
    if (!klines || klines.length < 2) return [];
    const result = [];
    let prevDay = Math.floor(klines[0].time / 86400);
    for (let i = 1; i < klines.length; i++) {
        const day = Math.floor(klines[i].time / 86400);
        if (day !== prevDay) { result.push(klines[i].time); prevDay = day; }
    }
    return result;
}
class DayLinesPrimitive {
    constructor(dayTs, chart) {
        const renderer = {
            draw: target => target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, horizontalPixelRatio }) => {
                const ts = chart.timeScale();
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = horizontalPixelRatio;
                for (const t of dayTs) {
                    const x = ts.timeToCoordinate(t);
                    if (x === null) continue;
                    const xPx = Math.round(x * horizontalPixelRatio) + 0.5;
                    if (xPx < 0 || xPx > bitmapSize.width) continue;
                    ctx.beginPath(); ctx.moveTo(xPx, 0); ctx.lineTo(xPx, bitmapSize.height); ctx.stroke();
                }
                ctx.restore();
            })
        };
        this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
    }
    paneViews() { return [this._view]; }
    updateAllViews() {}
    attached() {}
    detached() {}
}
function attachDayLines(series, chart, klines, tf, prev) {
    if (prev) { try { series.detachPrimitive(prev); } catch(e) {} }
    if (tf === 'D' || tf === 'W' || tf === 'M' || !klines || klines.length < 2) return null;
    const dayTs = getDayTimestamps(klines);
    if (!dayTs.length) return null;
    const prim = new DayLinesPrimitive(dayTs, chart);
    try { series.attachPrimitive(prim); return prim; } catch(e) { return null; }
}

// ── helpers ────────────────────────────────────────────────────────────────────
function calcEMA(bars, period) {
  const k = 2/(period+1); let v = bars[0].close;
  return bars.map((b,i) => { if(i>0) v=b.close*k+v*(1-k); return {time:b.time,value:v}; });
}

function calcBB(klines, period=20, mult=2) {
  const upper=[], mid=[], lower=[];
  for (let i=period-1; i<klines.length; i++) {
    const sl = klines.slice(i-period+1, i+1);
    const mean = sl.reduce((s,c)=>s+c.close,0)/period;
    const std  = Math.sqrt(sl.reduce((s,c)=>s+(c.close-mean)**2,0)/period);
    upper.push({time:klines[i].time, value:mean+mult*std});
    mid.push(  {time:klines[i].time, value:mean});
    lower.push({time:klines[i].time, value:mean-mult*std});
  }
  return {upper, mid, lower};
}

function toggleBB() {
  bbActive = !bbActive;
  const btn = document.getElementById('bb-btn');
  btn.style.color      = bbActive ? '#60a5fa' : '#B2B5BE';
  btn.style.background = bbActive ? '#1a3a5c' : '#2A2E39';
  const lb = {priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false};
  slots.forEach(s => {
    if (bbActive) {
      s.bbSeries.upper = addS(s.chart,'LineSeries',{...lb,color:'#161A1E',lineWidth:1});
      s.bbSeries.mid   = addS(s.chart,'LineSeries',{...lb,color:'#161A1E',lineWidth:1,lineStyle:2});
      s.bbSeries.lower = addS(s.chart,'LineSeries',{...lb,color:'#161A1E',lineWidth:1});
      if (s.klines.length >= 20) {
        const bb = calcBB(s.klines);
        s.bbSeries.upper.setData(bb.upper);
        s.bbSeries.mid.setData(bb.mid);
        s.bbSeries.lower.setData(bb.lower);
      }
    } else {
      for (const k of ['upper','mid','lower']) {
        if (s.bbSeries[k]) { try { s.chart.removeSeries(s.bbSeries[k]); } catch(e) {} s.bbSeries[k]=null; }
      }
    }
  });
}

function addS(chart, type, opts) {
  if (typeof chart.addSeries==='function' && LC[type]) return chart.addSeries(LC[type], opts);
  const m = {CandlestickSeries:'addCandlestickSeries',LineSeries:'addLineSeries'};
  return chart[m[type]](opts);
}

function makeChart(el, bigSlot) {
  return LC.createChart(el, {
    autoSize: true,
    layout: { background:{color:'#0B0E11'}, textColor:'#B2B5BE', fontSize: 13 },
    grid:   { vertLines:{color:'#FFFFFF0F'}, horzLines:{color:'#FFFFFF0F'} },
    crosshair: { mode: LC.CrosshairMode ? LC.CrosshairMode.Normal : 1 },
    rightPriceScale: { borderVisible:false, scaleMargins:{top:0.05,bottom:0.05} },
    timeScale: {
      borderVisible:false, visible:true, timeVisible:true, secondsVisible:false,
      barSpacing: bigSlot ? 8 : 6, rightOffset: bigSlot ? 20 : 15,
    },
  });
}

function fmtPrice(p) {
  if (p>=10000) return p.toLocaleString('en-US',{maximumFractionDigits:1});
  if (p>=1)     return p.toFixed(3);
  if (p>=0.01)  return p.toFixed(5);
  return p.toFixed(7);
}

function fmtVol(v) {
  if (v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+(v/1e3).toFixed(0)+'K';
}

function fmtCountdown(secs) {
  if (secs <= 0) return '00:00';
  if (secs >= 3600) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

function buildGrid() {

  TF_SLOTS.forEach((cfg, i) => {
    const isBig = cfg.row === '2';   // bottom row: wider slot

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.gridColumn = cfg.col;
    cell.style.gridRow    = cfg.row;

    // ── slot header ────────────────────────────────────────────────────────
    const hdr = document.createElement('div');
    hdr.className = 'cell-hdr';

    const tfLbl = document.createElement('span');
    tfLbl.textContent = cfg.label;
    tfLbl.style.cssText = 'font-size:13px;font-weight:700;color:#60a5fa;background:#1E222D;padding:1px 6px;border-radius:2px;flex-shrink:0;';

    const spacer = document.createElement('div');
    spacer.style.flex = '1';

    const timerEl = document.createElement('span');
    timerEl.style.cssText = 'font-size:13px;font-family:monospace;color:#4B5563;margin-left:5px;flex-shrink:0;letter-spacing:.5px;';
    const dur0 = TF_SECONDS[cfg.tf];
    if (dur0) {
      const now0 = Math.floor(Date.now()/1000);
      timerEl.textContent = fmtCountdown(dur0 - (now0 % dur0));
    }

    const pctEl = document.createElement('span');
    pctEl.style.cssText = 'font-size:13px;font-family:monospace;min-width:52px;text-align:right;white-space:nowrap;';

const fsBtn = document.createElement('button');
    fsBtn.textContent = '⛶'; fsBtn.title = 'Schermo intero';
    fsBtn.style.cssText = 'font-size:13px;color:#4B5563;background:none;border:none;cursor:pointer;padding:0 0 0 4px;line-height:1;flex-shrink:0;transition:color .15s;';
    fsBtn.onmouseenter = () => fsBtn.style.color = '#B2B5BE';
    fsBtn.onmouseleave = () => fsBtn.style.color = '#4B5563';
    fsBtn.onclick = () => openFSModal(i);

async function loadSlot(idx, dailyData) {
  const s = slots[idx];
  try {
    const r = await fetch(`api/klines?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
    const j = await r.json();
    if (!j.success) return;
    const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;
    s.candleS.setData(klines);
    s.klineCount = klines.length;
    s.klines = klines.slice();
    s.klinesVolMap = new Map(klines.map(k => [k.time, k.volume]));
    const _lastN = klines.slice(-20);
    s.avgVol = _lastN.length > 0 ? _lastN.reduce((acc,k) => acc+(k.volume||0), 0) / _lastN.length : 0;
    s.dayPrimitive = attachDayLines(s.candleS, s.chart, klines, s.cfg.tf, s.dayPrimitive);
    s.candleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
    for (const {p} of EMA_CFG) {
      const ema = calcEMA(klines, p);
      s.emaS[p].setData(ema);
      s.lastEMA[p] = ema[ema.length-1].value;
    }
    s.chart.timeScale().setVisibleLogicalRange({ from: klines.length - getCandlesForTF(s.cfg.tf), to: klines.length + 3 });

    // H / L / pH / pL lines
    if (dailyData) {
      const {today, prev} = dailyData;
      const _slvl = getLvCfg();
      if (_slvl.dayHigh.vis?.mtf  !== false) s.dayHighLine  = s.candleS.createPriceLine({price:today.high,color:_slvl.dayHigh.color, lineWidth:_slvl.dayHigh.width, lineStyle:_slvl.dayHigh.style, axisLabelVisible:false,title:''});
      if (_slvl.dayLow.vis?.mtf   !== false) s.dayLowLine   = s.candleS.createPriceLine({price:today.low, color:_slvl.dayLow.color,  lineWidth:_slvl.dayLow.width,  lineStyle:_slvl.dayLow.style,  axisLabelVisible:false,title:''});
      if (_slvl.prevHigh.vis?.mtf !== false) s.prevHighLine = s.candleS.createPriceLine({price:prev.high, color:_slvl.prevHigh.color,lineWidth:_slvl.prevHigh.width,lineStyle:_slvl.prevHigh.style,axisLabelVisible:false,title:''});
      if (_slvl.prevLow.vis?.mtf  !== false) s.prevLowLine  = s.candleS.createPriceLine({price:prev.low,  color:_slvl.prevLow.color, lineWidth:_slvl.prevLow.width, lineStyle:_slvl.prevLow.style, axisLabelVisible:false,title:''});
    }
  } catch(e) {
    console.error(`MTF load ${s.cfg.label} error:`, e);
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────────
let _wsPingTimer = null;

function openWS() {
  closeWS();
  setWSDot('connecting');
  ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');
  ws.onopen = () => {
    setWSDot('live');
    ws.send(JSON.stringify({
      op: 'subscribe',
      args: TF_SLOTS.map(s => `kline.${s.tf}.${SYM}`),
    }));
    // Bybit requires application-level ping every 20s to keep connection alive
    _wsPingTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('{"op":"ping"}');
    }, 20000);
  };
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (!msg.topic || !msg.topic.startsWith('kline.')) return;
    const tf    = msg.topic.split('.')[1];
    const idx   = slots.findIndex(s => s.cfg.tf === tf);
    if (idx === -1) return;
    const b = msg.data[0];
    const confirmed = b.confirm === true || b.confirm === 'true';
    const candleStart = Math.floor(parseInt(b.start)/1000);
    const candle = {
      time:  candleStart + TZ_OFFSET_S,
      open:  parseFloat(b.open),
      high:  parseFloat(b.high),
      low:   parseFloat(b.low),
      close: parseFloat(b.close),
    };
    const s = slots[idx];
    s.lastCandleStartUtc = candleStart;
    s.lastWsMs = Date.now();
    s.candleS.update(candle);
    s.lastPrice = candle.close;
    for (const {p} of EMA_CFG) {
      if (s.lastEMA[p] === null) continue;
      const k    = 2/(p+1);
      const live = candle.close * k + s.lastEMA[p] * (1-k);
      s.emaS[p].update({time: candle.time, value: live});
      if (confirmed) s.lastEMA[p] = live;
    }
    // aggiorna klines live
    if (s.klines.length > 0) {
      const last = s.klines[s.klines.length-1];
      if (last.time === candle.time) {
        s.klines[s.klines.length-1] = {time:candle.time,open:last.open,high:Math.max(last.high,candle.high),low:Math.min(last.low,candle.low),close:candle.close};
      } else {
        s.klines.push({...candle});
      }
    }
    if (bbActive && s.bbSeries.upper && s.klines.length >= 20) {
      const sl = s.klines.slice(-20);
      const mean = sl.reduce((a,c)=>a+c.close,0)/20;
      const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/20);
      s.bbSeries.upper.update({time:candle.time, value:mean+2*std});
      s.bbSeries.mid.update(  {time:candle.time, value:mean});
      s.bbSeries.lower.update( {time:candle.time, value:mean-2*std});
    }
  };
  ws.onerror = () => setWSDot('error');
  ws.onclose = () => {
    setWSDot('off');
    clearInterval(_wsPingTimer); _wsPingTimer = null;
    wsTimer = setTimeout(openWS, 5000);
  };
}

function closeWS() {
  clearTimeout(wsTimer);
  clearInterval(_wsPingTimer); _wsPingTimer = null;
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
}

function setWSDot(state) {
  const m = {
    connecting: ['#eab308', 'Conn...', '#B2B5BE'],
    live:       ['#34d399', 'Live',    '#34d399'],
    error:      ['#ef4444', 'Err',     '#ef4444'],
    off:        ['#6B7280', 'WS',      '#6B7280'],
  };
  const [bg, label, tc] = m[state] || m.off;
  const c = document.getElementById('ws-circle');
  const l = document.getElementById('ws-label');
  if (c) c.style.background = bg;
  if (l) { l.textContent = label; l.style.color = tc; }
}

function _clearOBLines() {
    for (const ref of [obBidLine, obAskLine, obDayHighLine, obDayLowLine, obPrevHighLine, obPrevLowLine])

async function loadOBData() {
    try {
        const [r, rd] = await Promise.all([
            fetch(`api/klines?symbol=${SYM}&interval=${obTF}`),
            fetch(`api/klines?symbol=${SYM}&interval=D`),
        ]);
        const j = await r.json(); const jd = await rd.json();
        if (!j.success) return;
        const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;
        obCandleS.setData(klines);
        obDayPrimitive = attachDayLines(obCandleS, obChart, klines, obTF, obDayPrimitive);
        obCandleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
        for (const {p} of EMA_CFG) {
            const ema = calcEMA(klines, p);
            obEmaS[p].setData(ema);
            obLastEMA[p] = ema[ema.length - 1].value;
        }
        obChart.timeScale().fitContent();
        if (obDayHighLine)  { try { obCandleS.removePriceLine(obDayHighLine);  } catch(e) {} obDayHighLine  = null; }
        if (obDayLowLine)   { try { obCandleS.removePriceLine(obDayLowLine);   } catch(e) {} obDayLowLine   = null; }
        if (obPrevHighLine) { try { obCandleS.removePriceLine(obPrevHighLine); } catch(e) {} obPrevHighLine = null; }
        if (obPrevLowLine)  { try { obCandleS.removePriceLine(obPrevLowLine);  } catch(e) {} obPrevLowLine  = null; }
        if (jd.success && jd.data && jd.data.length) {
            const today = jd.data[jd.data.length - 1];
            const _oblvl = getLvCfg();
            if (_oblvl.dayHigh.vis?.mtf  !== false) obDayHighLine  = obCandleS.createPriceLine({ price: today.high,  color:_oblvl.dayHigh.color,  lineWidth:_oblvl.dayHigh.width,  lineStyle:_oblvl.dayHigh.style,  axisLabelVisible:false, title:'' });
            if (_oblvl.dayLow.vis?.mtf   !== false) obDayLowLine   = obCandleS.createPriceLine({ price: today.low,   color:_oblvl.dayLow.color,   lineWidth:_oblvl.dayLow.width,   lineStyle:_oblvl.dayLow.style,   axisLabelVisible:false, title:'' });
            if (jd.data.length >= 2) {
                const prev = jd.data[jd.data.length - 2];

                if (_oblvl.prevLow.vis?.mtf  !== false) obPrevLowLine  = obCandleS.createPriceLine({ price: prev.low,  color:_oblvl.prevLow.color,  lineWidth:_oblvl.prevLow.width,  lineStyle:_oblvl.prevLow.style,  axisLabelVisible:false, title:'' });
            }
        }
    } catch(e) { console.error('OB chart load error:', e); }
}

function connectOBWS() {
    closeOBWS();
    obWS = new WebSocket('wss://stream.bybit.com/v5/public/linear');
    obWS.onopen = () => obWS.send(JSON.stringify({ op:'subscribe', args:[`kline.${obTF}.${SYM}`] }));
    obWS.onmessage = ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
        if (!msg.topic || !msg.topic.startsWith('kline.')) return;
        const b = msg.data[0];
        const confirmed = b.confirm === true || b.confirm === 'true';
        const candle = { time: Math.floor(parseInt(b.start)/1000) + TZ_OFFSET_S, open: parseFloat(b.open), high: parseFloat(b.high), low: parseFloat(b.low), close: parseFloat(b.close) };
        obCandleS.update(candle);
        for (const {p} of EMA_CFG) {
            if (obLastEMA[p] == null) continue;

            if (confirmed) obLastEMA[p] = live;

async function loadFSData() {
    try {
        const [r, rd] = await Promise.all([
            fetch(`api/klines?symbol=${SYM}&interval=${fsTF}`),
            fetch(`api/klines?symbol=${SYM}&interval=D`),
        ]);
        const j = await r.json(); const jd = await rd.json();
        if (!j.success) return;
        const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;
        fsCandleS.setData(klines); fsKlineCount = klines.length; _clearFSLines();
        fsDayPrimitive = attachDayLines(fsCandleS, fsChart, klines, fsTF, fsDayPrimitive);
        fsCandleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
        for (const {p} of EMA_CFG) {
            const ema = calcEMA(klines, p);
            fsEmaS[p].setData(ema);
            fsLastEMA[p] = ema[ema.length - 1].value;
        }
        fsChart.timeScale().setVisibleLogicalRange({ from: fsKlineCount - getCandlesForTF(fsTF), to: fsKlineCount + 3 });
        if (jd.success && jd.data && jd.data.length) {
            const today = jd.data[jd.data.length - 1];
            const _fslvl = getLvCfg();
            if (_fslvl.dayHigh.vis?.mtf  !== false) fsDayHighLine = fsCandleS.createPriceLine({ price: today.high, color:_fslvl.dayHigh.color,  lineWidth:_fslvl.dayHigh.width,  lineStyle:_fslvl.dayHigh.style,  axisLabelVisible:false, title:'' });
            if (_fslvl.dayLow.vis?.mtf   !== false) fsDayLowLine  = fsCandleS.createPriceLine({ price: today.low,  color:_fslvl.dayLow.color,   lineWidth:_fslvl.dayLow.width,   lineStyle:_fslvl.dayLow.style,   axisLabelVisible:false, title:'' });
            if (jd.data.length >= 2) {
                const prev = jd.data[jd.data.length - 2];
                if (_fslvl.prevHigh.vis?.mtf !== false) fsPrevHighLine = fsCandleS.createPriceLine({ price: prev.high, color:_fslvl.prevHigh.color, lineWidth:_fslvl.prevHigh.width, lineStyle:_fslvl.prevHigh.style, axisLabelVisible:false, title:'' });
                if (_fslvl.prevLow.vis?.mtf  !== false) fsPrevLowLine  = fsCandleS.createPriceLine({ price: prev.low,  color:_fslvl.prevLow.color,  lineWidth:_fslvl.prevLow.width,  lineStyle:_fslvl.prevLow.style,  axisLabelVisible:false, title:'' });
            }
        }
    } catch(e) { console.error('FS chart load error:', e); }
}

function connectFSWS() {
    closeFSWS();
    fsWS = new WebSocket('wss://stream.bybit.com/v5/public/linear');
    fsWS.onopen = () => fsWS.send(JSON.stringify({ op:'subscribe', args:[`kline.${fsTF}.${SYM}`] }));
    fsWS.onmessage = ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
        if (!msg.topic || !msg.topic.startsWith('kline.')) return;
        const b = msg.data[0]; const confirmed = b.confirm === true || b.confirm === 'true';
        const candle = { time: Math.floor(parseInt(b.start)/1000) + TZ_OFFSET_S, open: parseFloat(b.open), high: parseFloat(b.high), low: parseFloat(b.low), close: parseFloat(b.close) };
        fsCandleS.update(candle);
        for (const {p} of EMA_CFG) {
            if (fsLastEMA[p] == null) continue;
            const k = 2/(p+1);
            const live = candle.close * k + fsLastEMA[p] * (1-k);
            fsEmaS[p].update({ time: candle.time, value: live });
            if (confirmed) fsLastEMA[p] = live;
        }
    };
    fsWS.onerror = () => {};
    fsWS.onclose = () => { fsWsTimer = setTimeout(connectFSWS, 5000); };
}

function closeFSWS() {
    clearTimeout(fsWsTimer);
    if (fsWS) { try { fsWS.close(); } catch(e) {} fsWS = null; }
}

loadAll().then(() => {
  // Live polling via backend ws_manager — runs every 5s for 1m and 5m slots.
  // The backend WS (with ping_interval=20) stays connected reliably to Bybit;
  // the frontend polls it instead of depending on a direct browser→Bybit WS.
  async function _livePoll() {
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s.cfg.tf !== '1' && s.cfg.tf !== '5') continue;
      try {
        const r = await fetch(`api/klines/live?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
        const j = await r.json();
        if (!j.success || !j.data || !j.data.length) continue;
        // Update last 10 candles — fills any gap and keeps live candle current
        for (const c of j.data) s.candleS.update(c);
        // Show live EMA for the current open candle
        const lc = j.data[j.data.length - 1];
        for (const {p} of EMA_CFG) {
          if (s.lastEMA[p] === null) continue;
          const kk = 2/(p+1);
          s.emaS[p].update({time: lc.time, value: lc.close * kk + s.lastEMA[p] * (1-kk)});
        }
        // Sync timer with actual Bybit candle start time from backend
        const utcStart = lc.time - (TZ_OFFSET_S || j.utc_offset_s || 0);
        if (s.lastCandleStartUtc === null || utcStart >= s.lastCandleStartUtc) {
          s.lastCandleStartUtc = utcStart;
          s.lastWsMs = Date.now();
        }
      } catch(e) {}
    }
    setTimeout(_livePoll, 5000);
  }
  setTimeout(_livePoll, 3000); // first poll 3s after initial load
});

function _tickTimers() {
  const nowMs = Date.now();
  const nowS  = Math.floor(nowMs / 1000);
  slots.forEach(s => {
    if (!s.timerEl) return;
    const dur = TF_SECONDS[s.cfg.tf];
    if (!dur) return;
    let rem;
    if (s.lastCandleStartUtc !== null) {
      // Driven by actual Bybit candle open time — always in sync with chart
      rem = dur - ((nowS - s.lastCandleStartUtc) % dur);
    } else {
      // Fallback before first WS message: UTC boundary formula
      rem = dur - (nowS % dur);
    }
    s.timerEl.textContent = fmtCountdown(rem);
    s.timerEl.style.color = rem <= 30 ? '#f59e0b' : '#4B5563';
  });
  setTimeout(_tickTimers, 1010 - (nowMs % 1000));
}

// ── Range Prezzo Tool ─────────────────────────────────────────────────────────

function _drawRangeCanvas(canvas, series, p1, p2) {
  canvas.width  = canvas.clientWidth  || canvas.parentElement.clientWidth  || 100;
  canvas.height = canvas.clientHeight || canvas.parentElement.clientHeight || 100;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (p1 === null || p2 === null) return;

  let y1 = series.priceToCoordinate(p1);
  let y2 = series.priceToCoordinate(p2);
  if (y1 === null) y1 = p2 > p1 ? canvas.height : 0;
  if (y2 === null) y2 = p2 > p1 ? 0 : canvas.height;

  const top    = Math.min(y1, y2);
  const bottom = Math.max(y1, y2);
  const h      = Math.max(bottom - top, 1);
  const isUp   = p2 > p1;
  const color  = isUp ? '#089981' : '#F23645';

  ctx.fillStyle = isUp ? 'rgba(8,153,129,0.12)' : 'rgba(242,54,69,0.12)';
  ctx.fillRect(0, top, canvas.width, h);

  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(canvas.width, y1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(canvas.width, y2); ctx.stroke();
  ctx.setLineDash([]);

  const delta    = p2 - p1;
  const pct      = (delta / p1) * 100;
  const sign     = delta >= 0 ? '+' : '';
  const absDelta = Math.abs(delta);
  const dStr     = absDelta >= 100 ? delta.toFixed(1) : absDelta >= 1 ? delta.toFixed(2) : delta.toFixed(4);
  const label    = `${sign}${dStr}  (${sign}${pct.toFixed(2)}%)`;

  const fs  = Math.max(9, Math.min(12, Math.floor(h * 0.35)));
  ctx.font  = `bold ${fs}px monospace`;
  const tw  = ctx.measureText(label).width;
  const pad = 4;
  const lx  = canvas.width - tw - pad * 2 - 6;
  const ly  = top + h / 2;

  ctx.fillStyle = isUp ? 'rgba(8,153,129,0.88)' : 'rgba(242,54,69,0.88)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(lx - pad, ly - fs, tw + pad * 2, fs + 6, 3)
                : ctx.rect(lx - pad, ly - fs, tw + pad * 2, fs + 6);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, lx, ly);
}

function toggleSlotRange(idx) {
  const s = slots[idx];
  s.rangeActive = !s.rangeActive;
  s.rangeBtn.style.color = s.rangeActive ? '#f59e0b' : '#4B5563';
  if (!s.rangeActive) {
    s.rangeP1 = null; s.rangeP2 = null;
    try { const rc = s.rangeCanvas.getContext('2d'); rc.clearRect(0,0,s.rangeCanvas.width,s.rangeCanvas.height); } catch(e) {}
    if (s._rangeSub)   { try { s.chart.unsubscribeClick(s._rangeSub); }          catch(e){} s._rangeSub   = null; }
    if (s._rangeCsSub) { try { s.chart.unsubscribeCrosshairMove(s._rangeCsSub); } catch(e){} s._rangeCsSub = null; }
  } else {
    s.rangeP1 = null; s.rangeP2 = null;
    s._rangeSub = param => {
      if (!param.point) return;
      const price = s.candleS.coordinateToPrice(param.point.y);
      if (price == null) return;
      if (s.rangeP1 === null || s.rangeP2 !== null) { s.rangeP1 = price; s.rangeP2 = null; }
      else { s.rangeP2 = price; _drawRangeCanvas(s.rangeCanvas, s.candleS, s.rangeP1, s.rangeP2); }
    };
    s._rangeCsSub = param => {
      if (s.rangeP2 !== null) return;
      const p2 = param.point ? s.candleS.coordinateToPrice(param.point.y) : null;
      _drawRangeCanvas(s.rangeCanvas, s.candleS, s.rangeP1, p2);
    };
    s.chart.subscribeClick(s._rangeSub);
    s.chart.subscribeCrosshairMove(s._rangeCsSub);
  }
}

function toggleFsRange() {
  fsRangeActive = !fsRangeActive;
  const btn    = document.getElementById('fs-range-btn');

  btn.style.color      = fsRangeActive ? '#f59e0b' : '#B2B5BE';

    fsRangeP1 = null; fsRangeP2 = null;

    if (_fsRangeSub)   { try { fsChart.unsubscribeClick(_fsRangeSub); }          catch(e){} _fsRangeSub   = null; }
    if (_fsRangeCsSub) { try { fsChart.unsubscribeCrosshairMove(_fsRangeCsSub); } catch(e){} _fsRangeCsSub = null; }
  } else {
    fsRangeP1 = null; fsRangeP2 = null;
    _fsRangeSub = param => {
      if (!param.point) return;
      const price = fsCandleS.coordinateToPrice(param.point.y);
      if (price == null) return;
      if (fsRangeP1 === null || fsRangeP2 !== null) { fsRangeP1 = price; fsRangeP2 = null; }
      else { fsRangeP2 = price; _drawRangeCanvas(canvas, fsCandleS, fsRangeP1, fsRangeP2); }
    };
    _fsRangeCsSub = param => {
      if (fsRangeP2 !== null) return;
      const p2 = param.point ? fsCandleS.coordinateToPrice(param.point.y) : null;

  }
}

// ── Price alert helpers ────────────────────────────────────────────────────────
function openAlertPopover(symbol, price, btn, slotIdx) {
  pendingAlert = { symbol, price, slotIdx };
  document.getElementById('alert-pop-symbol').textContent = symbol.replace('USDT','/USDT');
  document.getElementById('alert-pop-price').textContent  = fmtPrice(price);
  const pop  = document.getElementById('alert-popover');
  const rect = btn.getBoundingClientRect();
  const left = Math.max(4, Math.min(rect.left - 230, window.innerWidth - 250));
  const top  = Math.max(52, rect.top - 130);
  pop.style.left    = left + 'px';
  pop.style.top     = top  + 'px';
  pop.style.display = 'block';
}

function closeAlertPopover() {
  document.getElementById('alert-popover').style.display = 'none';
  pendingAlert = null;
}

function setNotifyMode(mode) {
  notifyMode = mode;
  const both    = document.getElementById('notify-both');
  const browser = document.getElementById('notify-browser');
  if (mode === 'both') {
    both.style.background = '#1d4ed8'; both.style.color = '#fff';
    browser.style.background = '#1E222D'; browser.style.color = '#6B7280';
  } else {
    both.style.background = '#1E222D'; both.style.color = '#6B7280';
    browser.style.background = '#1d4ed8'; browser.style.color = '#fff';
  }
}

async function confirmAlert(condition) {
  if (!pendingAlert) return;
  const { symbol, price } = pendingAlert;
  try {
    const r = await fetch('api/price-alerts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ symbol, price, condition, notify: notifyMode }),
    });
    const j = await r.json();
    closeAlertPopover();
    if (j.success) {
      showToast('🔔 Alert impostato!');
      if (j.alert) {
        activeAlerts.push(j.alert);
        updateAlertsBadge();
        addAlertLineAllSlots(j.alert.id, price, condition);
      }
    } else {
      showToast('❌ Errore alert');
    }
  } catch(e) { closeAlertPopover(); showToast('❌ Errore connessione'); }
}

async function initNotifications() {
  if ('Notification' in window && Notification.permission === 'default')
    await Notification.requestPermission();
}

function fireBrowserNotification(alert) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const coin = alert.symbol.replace('USDT', '');
  const dir  = alert.condition === 'above' ? '📈' : '📉';
  new Notification(`${dir} Alert: ${coin}/USDT`, {
    body: `Prezzo ${alert.condition === 'above' ? 'sopra' : 'sotto'} ${alert.price}`,
  });
}

async function pollTriggeredAlerts() {
  try {
    const r = await fetch('api/price-alerts/recent-triggered');
    const j = await r.json();
    if (j.success && j.data && j.data.length) {
      for (const a of j.data) {
        fireBrowserNotification(a);
        for (const s of slots) {
          if (s.alertLines.has(a.id)) {
            try { s.candleS.removePriceLine(s.alertLines.get(a.id)); } catch(e) {}
            s.alertLines.delete(a.id);
          }
        }
        activeAlerts = activeAlerts.filter(x => x.id !== a.id);
      }
      updateAlertsBadge();
    }
  } catch(e) {}
  await syncAllAlertLines();
  setTimeout(pollTriggeredAlerts, 30000);
}

function addAlertLineAllSlots(alertId, price, condition) {
  for (const s of slots) {
    if (!s.candleS || s.alertLines.has(alertId)) continue;
    try {
      const pl = s.candleS.createPriceLine({
        price,
        color: condition === 'above' ? '#34d399' : '#f87171',
        lineWidth: 1,
        lineStyle: LC.LineStyle ? LC.LineStyle.Dashed : 2,
        axisLabelVisible: true,
        title: condition === 'above' ? '▲' : '▼',
      });
      s.alertLines.set(alertId, pl);
    } catch(e) {}
  }
}

async function syncAllAlertLines() {
  try {
    const r = await fetch('api/price-alerts');
    const j = await r.json();
    if (!j.success) return;
    activeAlerts = j.data;
    updateAlertsBadge();
    for (const a of j.data) {
      if (a.symbol === SYM) addAlertLineAllSlots(a.id, a.price, a.condition);
    }
  } catch(e) {}
}

}

function renderAlertsList() {
  const list = document.getElementById('alerts-list');
  if (!list) return;
  const mine = activeAlerts.filter(a => a.symbol === SYM);
  if (!mine.length) {
    list.innerHTML = '<div style="text-align:center;color:#6B7280;font-size:12px;padding:24px 0;">Nessun alert attivo</div>';
    return;
  }
  const _lp = (slots.find(s => s.lastPrice) || {}).lastPrice;
  list.innerHTML = mine.map(a => {
    const dirColor = a.condition === 'above' ? '#34d399' : '#f87171';
    const dirLabel = a.condition === 'above' ? '▲ Sopra' : '▼ Sotto';
    const notifyIcon = a.notify === 'browser' ? '🖥' : TGSVG;
    const dist = _lp ? ((a.price - _lp) / _lp * 100) : null;
    const distStr = dist !== null ? (dist >= 0 ? `+${dist.toFixed(2)}%` : `${dist.toFixed(2)}%`) : '';
    const distColor = dist >= 0 ? '#34d399' : '#f87171';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #1E222D;">
      <span style="font-size:11px;font-weight:700;color:#E5E7EB;min-width:70px;">${SYM.replace('USDT','/USDT')}</span>
      <span style="font-size:11px;color:${dirColor};font-weight:600;min-width:48px;">${dirLabel}</span>
      <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
        <span style="font-size:11px;font-family:monospace;color:#fbbf24;">${fmtPrice(a.price)}</span>
        ${distStr ? `<span style="font-size:10px;font-family:monospace;color:${distColor};">${distStr}</span>` : ''}
      </div>
      <span style="font-size:12px;" title="${a.notify === 'browser' ? 'Solo PC' : 'Telegram + PC'}">${notifyIcon}</span>
      <button onclick="deleteAlert('${a.id}')" style="background:#3f1515;color:#f87171;border:1px solid #7f1d1d;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;" onmouseenter="this.style.background='#7f1d1d'" onmouseleave="this.style.background='#3f1515'">✕</button>
    </div>`;
  }).join('');
}

async function deleteAlert(id) {
  try {
    await fetch(`api/price-alerts/${id}`, { method: 'DELETE' });
    for (const s of slots) {
      if (s.alertLines.has(id)) {
        try { s.candleS.removePriceLine(s.alertLines.get(id)); } catch(e) {}
        s.alertLines.delete(id);
      }
    }
    activeAlerts = activeAlerts.filter(a => a.id !== id);
    updateAlertsBadge();
    renderAlertsList();
  } catch(e) { showToast('❌ Errore eliminazione'); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E222D;color:#E5E7EB;padding:8px 18px;border-radius:6px;font-size:13px;z-index:900;border:1px solid #2A2E39;pointer-events:none;opacity:1;transition:opacity .3s;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 2500);
}

document.addEventListener('click', e => {
  const pop = document.getElementById('alert-popover');
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (!s.alertBtn || s.alertBtn.style.display === 'none') continue;
    const r = s.alertBtn.getBoundingClientRect();
    if (e.clientX >= r.left - 3 && e.clientX <= r.right  + 3 &&
        e.clientY >= r.top  - 3 && e.clientY <= r.bottom + 3) {
      const price = s.crosshairPrice || s.lastPrice;
      if (price) openAlertPopover(SYM, price, s.alertBtn, i);
      return;
    }
  }
  if (pop && pop.style.display !== 'none' && !pop.contains(e.target)) closeAlertPopover();
});

if (isMobile) {
  const mkBtn = (side, label, fn) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.onclick = fn;
    b.style.cssText = `position:fixed;${side}:0;bottom:72px;z-index:50;background:rgba(22,26,30,0.92);border:none;cursor:pointer;color:#6B7280;font-size:22px;padding:20px 16px;border-radius:${side==='left'?'0 6px 6px 0':'6px 0 0 6px'};`;
    document.body.appendChild(b);
  };
  mkBtn('left',  '‹', mobilePrevSlot);
  mkBtn('right', '›', mobileNextSlot);

  const ind = document.createElement('div');
  ind.id = 'mtf-indicator';
  ind.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(22,26,30,0.88);color:#B2B5BE;font-size:11px;padding:4px 14px;border-radius:12px;z-index:60;pointer-events:none;border:1px solid #2A2E39;';
  document.body.appendChild(ind);
  updateMTFIndicator();
}
</script>
