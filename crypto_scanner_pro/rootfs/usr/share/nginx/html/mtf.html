<script>
// ── constants ──────────────────────────────────────────────────────────────────
const LC  = LightweightCharts;
let TZ_OFFSET_S = 0;
const SYM = new URLSearchParams(location.search).get('symbol') || 'BTCUSDT';

const isMobile = window.innerWidth < 640;

// Desktop: 4 col × 2 row | Mobile: 2 col × 3 row
const TF_SLOTS = isMobile ? [
  { tf:'D',   label:'D',   col:'1', row:'1' },
  { tf:'240', label:'4h',  col:'2', row:'1' },
  { tf:'60',  label:'1h',  col:'1', row:'2' },
  { tf:'30',  label:'30m', col:'2', row:'2' },
  { tf:'5',   label:'5m',  col:'1', row:'3' },
  { tf:'1',   label:'1m',  col:'2', row:'3' },
] : [
  { tf:'M',   label:'M',   col:'1', row:'1' },
  { tf:'W',   label:'W',   col:'2', row:'1' },
  { tf:'D',   label:'D',   col:'3', row:'1' },
  { tf:'240', label:'4h',  col:'4', row:'1' },
  { tf:'60',  label:'1h',  col:'1', row:'2' },
  { tf:'30',  label:'30m', col:'2', row:'2' },
  { tf:'5',   label:'5m',  col:'3', row:'2' },
  { tf:'1',   label:'1m',  col:'4', row:'2' },
];

const DEFAULT_CANDLES = {'1':80,'5':80,'30':60,'60':60,'240':50,'D':40,'W':52,'M':24};
const TF_SECONDS = {'1':60,'5':300,'30':1800,'60':3600,'240':14400,'D':86400,'W':604800,'M':2592000};
function getCandlesForTF(tf) {
  try {
    const s = JSON.parse(localStorage.getItem('chart_candles_per_tf'));
    if (s && s[tf]) return Math.max(20, Math.min(500, parseInt(s[tf])));
  } catch(e) {}
  return DEFAULT_CANDLES[tf] || 60;
}

function getPriceFormat(price) {
  const p = Math.abs(price || 0);
  if (p >= 100)   return { type:'price', precision:2, minMove:0.01 };
  if (p >= 10)    return { type:'price', precision:3, minMove:0.001 };
  if (p >= 1)     return { type:'price', precision:4, minMove:0.0001 };
  if (p >= 0.1)   return { type:'price', precision:5, minMove:0.00001 };
  if (p >= 0.01)  return { type:'price', precision:6, minMove:0.000001 };
  if (p >= 0.001) return { type:'price', precision:7, minMove:0.0000001 };
  return            { type:'price', precision:8, minMove:0.00000001 };
}

const DEFAULT_EMA_CFG = [
  {p:5,   color:'#ef4444', style:0, width:2,   enabled:true},
  {p:10,  color:'#fbbf24', style:0, width:2,   enabled:true},
  {p:60,  color:'#3b82f6', style:0, width:3,   enabled:true},
  {p:223, color:'#a855f7', style:0, width:2.5, enabled:true},
];
const DEFAULT_LEVELS_CFG = {
  dayHigh:  {color:'#22c55e', style:0, width:2, vis:{chart:true, mtf:true, ob:true}},
  dayLow:   {color:'#ef4444', style:0, width:2, vis:{chart:true, mtf:true, ob:true}},
  prevHigh: {color:'#22c55e', style:2, width:2, vis:{chart:true, mtf:true, ob:true}},
  prevLow:  {color:'#ef4444', style:2, width:2, vis:{chart:true, mtf:true, ob:true}},
  obBid:    {color:'#3b82f6', style:1, width:1, vis:{chart:true, mtf:true, ob:true}},
  obAsk:    {color:'#3b82f6', style:1, width:1, vis:{chart:true, mtf:true, ob:true}},
  ath:      {color:'#f59e0b', style:2, width:1, vis:{chart:true, mtf:true, ob:false}},
  atl:      {color:'#a855f7', style:2, width:1, vis:{chart:true, mtf:true, ob:false}},
};
function getEmaCfg() {
  try {
    const s = JSON.parse(localStorage.getItem('chart_ema_cfg'));
    if (s && s.length === 4) return s.map((e, i) => ({ ...DEFAULT_EMA_CFG[i], ...e, enabled: e.enabled !== false }));
  } catch(e) {}
  return DEFAULT_EMA_CFG.map(x => ({...x}));
}
function toggleEmaAll(period) {
  const cfg = getEmaCfg();
  const entry = cfg.find(e => e.p === period);
  entry.enabled = !(entry.enabled !== false);
  try { localStorage.setItem('chart_ema_cfg', JSON.stringify(cfg)); } catch(e) {}
  EMA_CFG = cfg;
  slots.forEach(applyEmaToSlot);
  if (fsChart) applyFsEma();
}
function applyEmaToSlot(s) {
  if (!s.klines || !s.klines.length) return;
  for (const {p, enabled} of EMA_CFG) {
    if (enabled === false) {
      if (s.emaS[p]) s.emaS[p].setData([]);
      if (s.lastEMA) s.lastEMA[p] = null;
    } else {
      const ema = calcEMA(s.klines, p);
      if (s.emaS[p]) s.emaS[p].setData(ema);
      if (s.lastEMA) s.lastEMA[p] = ema[ema.length - 1].value;
    }
  }
}
function getLvCfg() {
  try {
    const s = JSON.parse(localStorage.getItem('chart_levels_cfg'));
    if (s) {
      if (!s._obBlueMigrated) {
        if (s.obBid) s.obBid.color = DEFAULT_LEVELS_CFG.obBid.color;
        if (s.obAsk) s.obAsk.color = DEFAULT_LEVELS_CFG.obAsk.color;
        s._obBlueMigrated = true;
        try { localStorage.setItem('chart_levels_cfg', JSON.stringify(s)); } catch(e) {}
      }
      const out = {};
      for (const k of Object.keys(DEFAULT_LEVELS_CFG)) {
        out[k] = s[k]
          ? {...DEFAULT_LEVELS_CFG[k], ...s[k], vis:{...DEFAULT_LEVELS_CFG[k].vis, ...(s[k].vis||{})}}
          : {...DEFAULT_LEVELS_CFG[k]};
      }
      return out;
    }
  } catch(e) {}
  return Object.fromEntries(Object.entries(DEFAULT_LEVELS_CFG).map(([k,v])=>[k,{...v,vis:{...v.vis}}]));
}
let EMA_CFG = getEmaCfg();

function _reapplyDayPrevLevels() {
  const lv = getLvCfg();
  for (const s of slots) {
    if (!s.candleS) continue;

function getDayTimestamps(klines) {
    if (!klines || klines.length < 2) return [];
    const result = [];
    let prevDay = Math.floor(klines[0].time / 86400);
    for (let i = 1; i < klines.length; i++) {
        const day = Math.floor(klines[i].time / 86400);
        if (day !== prevDay) { result.push(klines[i].time); prevDay = day; }
    }
    return result;
}
class DayLinesPrimitive {
    constructor(dayTs, chart) {
        const renderer = {
            draw: target => target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, horizontalPixelRatio }) => {
                const ts = chart.timeScale();
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = horizontalPixelRatio;
                for (const t of dayTs) {
                    const x = ts.timeToCoordinate(t);
                    if (x === null) continue;
                    const xPx = Math.round(x * horizontalPixelRatio) + 0.5;
                    if (xPx < 0 || xPx > bitmapSize.width) continue;
                    ctx.beginPath(); ctx.moveTo(xPx, 0); ctx.lineTo(xPx, bitmapSize.height); ctx.stroke();
                }
                ctx.restore();
            })
        };
        this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
    }
    paneViews() { return [this._view]; }
    updateAllViews() {}

    detached() {}
}

    const dayTs = getDayTimestamps(klines);
    if (!dayTs.length) return null;

}

function calcEMA(bars, period) {
  const k = 2/(period+1); let v = bars[0].close;
  return bars.map((b,i) => { if(i>0) v=b.close*k+v*(1-k); return {time:b.time,value:v}; });

function calcBB(klines, period=20, mult=2) {
  const upper=[], mid=[], lower=[];
  for (let i=period-1; i<klines.length; i++) {
    const sl = klines.slice(i-period+1, i+1);
    const mean = sl.reduce((s,c)=>s+c.close,0)/period;
    const std  = Math.sqrt(sl.reduce((s,c)=>s+(c.close-mean)**2,0)/period);
    upper.push({time:klines[i].time, value:mean+mult*std});
    mid.push(  {time:klines[i].time, value:mean});
    lower.push({time:klines[i].time, value:mean-mult*std});
  }
  return {upper, mid, lower};
}

// ── Squeeze Channel — stessa logica "volume dry-up + range compresso" dello screener
// Volume Inefficiency (detectSqueeze in vol-inefficiency.html), portata verbatim: quando
// attivo disegna 2 linee tratteggiate (hiR/loR = range delle ultime SQZ_K candele) sul
// grafico principale, invece di un pannello/oscillatore separato sotto al grafico.
const SQZ_K = 6, SQZ_VOL_DRY_RATIO = 0.55, SQZ_RANGE_DRY_RATIO = 0.55;
function _sqzCond(klines, i) {
  const widerN = SQZ_K * 4;

  let sumRecent = 0; for (let j = i - SQZ_K + 1; j <= i; j++) sumRecent += klines[j].volume;
  const pf = i - SQZ_K - widerN + 1, pt = i - SQZ_K;
  let sumPrior = 0; for (let j = pf; j <= pt; j++) sumPrior += klines[j].volume;
  const avgRecent = sumRecent / SQZ_K, avgPrior = sumPrior / (pt - pf + 1);
  if (avgPrior <= 0 || avgRecent / avgPrior > SQZ_VOL_DRY_RATIO) return null;
  let hiR = -Infinity, loR = Infinity;
  for (let j = i - SQZ_K + 1; j <= i; j++) { hiR = Math.max(hiR, klines[j].high); loR = Math.min(loR, klines[j].low); }
  let hiP = -Infinity, loP = Infinity;
  for (let j = Math.max(0, i - widerN + 1); j <= i; j++) { hiP = Math.max(hiP, klines[j].high); loP = Math.min(loP, klines[j].low); }

  if (hit) {
    if (lineRefs.hi) { try { candleS.removePriceLine(lineRefs.hi); } catch(e) {} }
    if (lineRefs.lo) { try { candleS.removePriceLine(lineRefs.lo); } catch(e) {} }
    lineRefs.hi = candleS.createPriceLine({ price: hit.hiR, color:'#22d3ee', lineWidth:1, lineStyle:2, axisLabelVisible:true, title:'Squeeze' });
    lineRefs.lo = candleS.createPriceLine({ price: hit.loR, color:'#22d3ee', lineWidth:1, lineStyle:2, axisLabelVisible:false, title:'' });

    if (lineRefs.hi) { try { candleS.removePriceLine(lineRefs.hi); } catch(e) {} lineRefs.hi = null; }

    s.grabWaveS.low   = addS(s.chart,'LineSeries',{...lb,color:cfg.emaLowColor,   lineWidth:1});
    s.grabWaveS.close = addS(s.chart,'LineSeries',{...lb,color:cfg.emaCloseColor, lineWidth:1});
  }
  if (cfg.showMidline) s.grabMurreyS.mid = addS(s.chart,'LineSeries',{...lb,color:cfg.midlineColor, lineWidth:1});
  if (cfg.showRange) {
    s.grabMurreyS.lo = addS(s.chart,'LineSeries',{...lb,color:cfg.rangeColor, lineWidth:1});
    s.grabMurreyS.hi = addS(s.chart,'LineSeries',{...lb,color:cfg.rangeColor, lineWidth:1});
  }
  if (!s.klines.length) return;
  const period = cfg.emaPeriod;
  const eh = calcEMAField(s.klines, period, 'high');
  const el = calcEMAField(s.klines, period, 'low');
  const ec = calcEMAField(s.klines, period, 'close');
  const colored = s.klines.map((k,i) => {
    const c = grabBarColor(k.close, k.open, eh[i].value, el[i].value, cfg);
    return {...k, color:c, wickColor:c, borderColor:c};
  });
  s.candleS.setData(colored);
  s.grabState = { emaHigh: eh[eh.length-1].value, emaLow: el[el.length-1].value, emaClose: ec[ec.length-1].value };
  if (cfg.showWave) {
    s.grabWaveS.high.setData(eh);
    s.grabWaveS.low.setData(el);
    s.grabWaveS.close.setData(ec);
  }
  if ((cfg.showMidline || cfg.showRange) && s.klines.length >= cfg.murreyLength) {
    const m = calcMurrey(s.klines, cfg.murreyLength);
    if (cfg.showMidline) s.grabMurreyS.mid.setData(m.mid);
    if (cfg.showRange) { s.grabMurreyS.lo.setData(m.lo); s.grabMurreyS.hi.setData(m.hi); }
  }
}
// Aggiorna colore candela + wave + murrey per un nuovo tick, SENZA confermare lo
// stato (s.grabState) — usato da WS/roll (full, con conferma su candela chiusa)
// e dal patch mid-price book (cheap, riusa solo l'ultimo stato noto, stesso
// pattern di s.lastEMA che non si muove durante il patch — vedi _mtfBookPatchSlot).
function _grabLiveColor(s, candle, cfg) {
  if (!grabActive || !s.grabState) return;
  const color = grabBarColor(candle.close, candle.open, s.grabState.emaHigh, s.grabState.emaLow, cfg);
  try { s.candleS.update({...candle, color, wickColor:color, borderColor:color}); } catch(e) {}
}
function _grabLiveUpdate(s, candle, confirmed, cfg) {
  if (!grabActive || !s.grabState) return;
  const k = 2/(cfg.emaPeriod+1);
  const liveEmaHigh  = candle.high  * k + s.grabState.emaHigh  * (1-k);
  const liveEmaLow   = candle.low   * k + s.grabState.emaLow   * (1-k);
  const liveEmaClose = candle.close * k + s.grabState.emaClose * (1-k);
  const color = grabBarColor(candle.close, candle.open, liveEmaHigh, liveEmaLow, cfg);
  try { s.candleS.update({...candle, color, wickColor:color, borderColor:color}); } catch(e) {}
  if (cfg.showWave && s.grabWaveS.high) {
    s.grabWaveS.high.update({time:candle.time, value:liveEmaHigh});
    s.grabWaveS.low.update( {time:candle.time, value:liveEmaLow});
    s.grabWaveS.close.update({time:candle.time, value:liveEmaClose});
  }
  if (confirmed) { s.grabState.emaHigh = liveEmaHigh; s.grabState.emaLow = liveEmaLow; s.grabState.emaClose = liveEmaClose; }
  if ((cfg.showMidline || cfg.showRange) && s.klines.length >= cfg.murreyLength) {
    const win = s.klines.slice(-cfg.murreyLength);
    let h = -Infinity, l = Infinity;
    for (const c of win) { h = Math.max(h,c.high); l = Math.min(l,c.low); }
    if (cfg.showMidline && s.grabMurreyS.mid) s.grabMurreyS.mid.update({time:candle.time, value:l+(h-l)/2});
    if (cfg.showRange && s.grabMurreyS.lo) { s.grabMurreyS.lo.update({time:candle.time, value:l}); s.grabMurreyS.hi.update({time:candle.time, value:h}); }
  }
}

// ── Trend Band — porting Pine "EMA Trend Band": banda tra EMA fast/slow, colorata
// bull/bear/flat (flat quando |spread EMA| < ATR(14)*flatMult). Lunghezze EMA
// fissate a 5/10 su richiesta utente (default Pine era 4/9), resto 1:1.
const _DEFAULT_TB_CFG = {
  fastLen: 5, slowLen: 10,
  // Colori saturi, ben distinti per hue (verde/rosso/giallo) invece delle tinte
  // pastello del Pine originale — troppo simili tra loro e poco leggibili sullo
  // sfondo scuro. Trasparenza abbassata per far "pop" la banda.
  bullColor: '#22c55e', bearColor: '#ef4444', flatColor: '#eab308',
  bandTransp: 22, flatMult: 0.25, hideLines: true,
  showFlatArrow: false,
};
function getTbCfg() {
  try { const s = JSON.parse(localStorage.getItem('chart_tb_cfg')); if (s) return { ..._DEFAULT_TB_CFG, ...s }; } catch(e) {}
  return { ..._DEFAULT_TB_CFG };
}
function setTbCfg(cfg) { try { localStorage.setItem('chart_tb_cfg', JSON.stringify(cfg)); } catch(e) {} }

function calcTR(klines) {
  return klines.map((k,i) => {
    if (i === 0) return k.high - k.low;
    const pc = klines[i-1].close;
    return Math.max(k.high - k.low, Math.abs(k.high - pc), Math.abs(k.low - pc));
  });
}
function calcRMA(values, length) {
  const out = new Array(values.length).fill(null);
  if (values.length < length) return out;
  let sum = 0;
  for (let i = 0; i < length; i++) sum += values[i];
  out[length-1] = sum / length;
  for (let i = length; i < values.length; i++) out[i] = (values[i] - out[i-1]) / length + out[i-1];
  return out;
}
function tbBandColor(spread, atr, cfg) {
  if (atr != null && Math.abs(spread) < atr * cfg.flatMult) return cfg.flatColor;
  return spread > 0 ? cfg.bullColor : cfg.bearColor;
}
function calcTrendBand(klines, cfg) {
  const ef = calcEMAField(klines, cfg.fastLen, 'close');
  const es = calcEMAField(klines, cfg.slowLen, 'close');
  const tr = calcTR(klines);
  const atr = calcRMA(tr, 14);
  const color = klines.map((k,i) => tbBandColor(ef[i].value - es[i].value, atr[i], cfg));
  return { fast: ef, slow: es, color, lastAtr: atr[atr.length-1] };
}
function toggleTrendBand() {
  tbActive = !tbActive;
  const btn = document.getElementById('tb-btn');
  if (btn) btn.style.color = tbActive ? '#8a9a5b' : '#B2B5BE';
  const cfgBtn = document.getElementById('tb-cfg-btn');
  if (cfgBtn) cfgBtn.style.display = tbActive ? 'flex' : 'none';
  const cfg = getTbCfg();
  slots.forEach(s => applyTbToSlot(s, cfg));
  if (fsChart) applyFsTb();
}
function applyTbToSlot(s, cfg) {
  for (const k of ['fast','slow']) {
    if (s.tbSeries[k]) { try { s.chart.removeSeries(s.tbSeries[k]); } catch(e) {} s.tbSeries[k] = null; }
  }
  s.tbData = null; s.tbState = null;
  if (!s.tbMarkersHandle && LC.createSeriesMarkers) { try { s.tbMarkersHandle = LC.createSeriesMarkers(s.candleS, []); } catch(e) {} }
  if (!tbActive || !s.klines.length) {
    s.tbMarkersData = [];
    if (s.tbMarkersHandle) s.tbMarkersHandle.setMarkers([]);
    return;
  }
  const lb = {priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, visible:!cfg.hideLines};
  s.tbSeries.fast = addS(s.chart,'LineSeries',{...lb,color:'#ffe082',lineWidth:1});
  s.tbSeries.slow = addS(s.chart,'LineSeries',{...lb,color:'#e0e0e0',lineWidth:1});
  const tb = calcTrendBand(s.klines, cfg);
  s.tbSeries.fast.setData(tb.fast);
  s.tbSeries.slow.setData(tb.slow);
  s.tbData = { fast: tb.fast, slow: tb.slow, color: tb.color };
  s.tbState = {
    emaFast: tb.fast[tb.fast.length-1].value, emaSlow: tb.slow[tb.slow.length-1].value,
    atr: tb.lastAtr, prevClose: s.klines[s.klines.length-2] ? s.klines[s.klines.length-2].close : s.klines[s.klines.length-1].close,
    prevColor: tb.color[tb.color.length-1],
  };
  s.tbMarkersData = [];
  if (cfg.showFlatArrow) {
    for (let i = 1; i < tb.color.length; i++) {
      if (tb.color[i] === cfg.flatColor && tb.color[i-1] !== cfg.flatColor) {
        s.tbMarkersData.push({ time: tb.fast[i].time, position: 'aboveBar', color: cfg.flatColor, shape: 'arrowDown', text: '' });
      }
    }
  }
  if (s.tbMarkersHandle) s.tbMarkersHandle.setMarkers(s.tbMarkersData);
}
// Aggiorna EMA fast/slow + ATR "live" (tick non ancora chiuso) e ridisegna banda/linee.
// confirmed=true (kline WS confirm) committa lo stato per il prossimo bar.
function _tbLiveUpdate(s, candle, confirmed, cfg) {
  if (!tbActive || !s.tbState) return;
  const kf = 2/(cfg.fastLen+1), ks = 2/(cfg.slowLen+1);
  const liveEmaFast = candle.close * kf + s.tbState.emaFast * (1-kf);
  const liveEmaSlow = candle.close * ks + s.tbState.emaSlow * (1-ks);
  const pc = s.tbState.prevClose;
  const tr = Math.max(candle.high - candle.low, Math.abs(candle.high - pc), Math.abs(candle.low - pc));
  const liveAtr = s.tbState.atr != null ? (tr - s.tbState.atr) / 14 + s.tbState.atr : null;
  const color = tbBandColor(liveEmaFast - liveEmaSlow, liveAtr, cfg);
  if (s.tbSeries.fast) {
    try { s.tbSeries.fast.update({time:candle.time, value:liveEmaFast}); s.tbSeries.slow.update({time:candle.time, value:liveEmaSlow}); } catch(e) {}
  }
  if (s.tbData) {
    const lastPt = s.tbData.fast[s.tbData.fast.length-1];
    if (lastPt && lastPt.time === candle.time) {
      s.tbData.fast[s.tbData.fast.length-1]  = {time:candle.time, value:liveEmaFast};
      s.tbData.slow[s.tbData.slow.length-1]  = {time:candle.time, value:liveEmaSlow};
      s.tbData.color[s.tbData.color.length-1] = color;
    } else {
      s.tbData.fast.push({time:candle.time, value:liveEmaFast});
      s.tbData.slow.push({time:candle.time, value:liveEmaSlow});
      s.tbData.color.push(color);
      const MAX_TB_POINTS = 1500;
      if (s.tbData.fast.length > MAX_TB_POINTS) {
        s.tbData.fast.shift(); s.tbData.slow.shift(); s.tbData.color.shift();
      }
    }
  }
  if (confirmed) {
    if (cfg.showFlatArrow && s.tbMarkersHandle && color === cfg.flatColor && s.tbState.prevColor !== cfg.flatColor) {
      s.tbMarkersData = s.tbMarkersData || [];
      s.tbMarkersData.push({ time: candle.time, position: 'aboveBar', color: cfg.flatColor, shape: 'arrowDown', text: '' });
      s.tbMarkersHandle.setMarkers(s.tbMarkersData);
    }
    s.tbState.emaFast = liveEmaFast; s.tbState.emaSlow = liveEmaSlow; s.tbState.atr = liveAtr; s.tbState.prevClose = candle.close;
    s.tbState.prevColor = color;
  }
}

// dove è per-simbolo; qui un solo fetch per SYM basta per tutti gli 8 pannelli TF) ──
async function _fetchOBLevels(symbol) {
  const r = await fetch(`https://api.bybit.com/v5/market/orderbook?category=linear&symbol=${symbol}&limit=200`);
  const d = await r.json();
  if (d.retCode !== 0 || !d.result) return null;
  const asks = d.result.a.map(([p,v]) => [parseFloat(p), parseFloat(v)]);
  const bids = d.result.b.map(([p,v]) => [parseFloat(p), parseFloat(v)]);
  if (!asks.length || !bids.length) return null;
  return { ask: asks.reduce((m,x) => x[1]>m[1]?x:m)[0], bid: bids.reduce((m,x) => x[1]>m[1]?x:m)[0] };
}

    if (!obLevelsActive) continue;
    if (_obLevelsBidVal != null && lv.obBid.vis?.mtf !== false) s.obLevBidLine = s.candleS.createPriceLine({price:_obLevelsBidVal, color:lv.obBid.color, lineWidth:lv.obBid.width, lineStyle:lv.obBid.style, axisLabelVisible:true, title:''});

// ── Trendline S/R automatica — porting da chart.html/trendline.html: 2 pivot su
// minimi (supporto) e massimi (resistenza), retta valida finché nessuna chiusura la rompe.
const TRENDLINE_SR_CFG = { shortPeriod: 30, longPeriod: 100, tolerancePct: 0.3 };
function pivotExtreme(candles, iEnd, offFrom, offTo) {
  let lowVal = Infinity, lowOff = null, highVal = -Infinity, highOff = null;
  for (let off = offFrom; off <= offTo; off++) {
    const idx = iEnd - off;
    if (idx < 0) return null;
    const c = candles[idx];
    if (c.low  < lowVal)  { lowVal  = c.low;  lowOff  = off; }
    if (c.high > highVal) { highVal = c.high; highOff = off; }
  }
  return { lowVal, lowOff, highVal, highOff };
}
function trendlineAt(candles, iEnd, shortPeriod, longPeriod) {
  if (iEnd - longPeriod < 0) return null;
  const rec = pivotExtreme(candles, iEnd, 1, shortPeriod);
  const old = pivotExtreme(candles, iEnd, shortPeriod + 1, longPeriod);
  if (!rec || !old) return null;
  const supX1 = iEnd - old.lowOff,  supY1 = old.lowVal,  supX2 = iEnd - rec.lowOff,  supY2 = rec.lowVal;
  const resX1 = iEnd - old.highOff, resY1 = old.highVal, resX2 = iEnd - rec.highOff, resY2 = rec.highVal;
  const supSlope = (supY2 - supY1) / (supX2 - supX1);
  const resSlope = (resY2 - resY1) / (resX2 - resX1);
  return {
    supX1, supY1, supX2, supY2, supSlope, supVal: supY2 + supSlope * (iEnd - supX2),
    resX1, resY1, resX2, resY2, resSlope, resVal: resY2 + resSlope * (iEnd - resX2),
  };
}
function isLineValid(candles, x1Idx, y1, slope, kind, tolerancePct) {
  for (let idx = x1Idx; idx < candles.length; idx++) {
    const lineVal = y1 + slope * (idx - x1Idx);
    const tol = Math.abs(lineVal) * (tolerancePct / 100);
    if (kind === 'support'    && candles[idx].close < lineVal - tol) return false;
    if (kind === 'resistance' && candles[idx].close > lineVal + tol) return false;
  }
  return true;
}
function detectActiveTrendlines(candles, cfg) {
  const n = candles.length;
  const iEnd = n - 1;
  const cur = trendlineAt(candles, iEnd, cfg.shortPeriod, cfg.longPeriod);
  if (!cur) return [];
  const toPt = (idx, price) => ({ time: candles[idx].time, price });
  const sup = { p1: toPt(cur.supX1, cur.supY1), p2: toPt(cur.supX2, cur.supY2) };
  const res = { p1: toPt(cur.resX1, cur.resY1), p2: toPt(cur.resX2, cur.resY2) };
  const hits = [];
  if (isLineValid(candles, cur.supX1, cur.supY1, cur.supSlope, 'support', cfg.tolerancePct))
    hits.push({ kind: 'support', lineVal: cur.supVal, sup, res });
  if (isLineValid(candles, cur.resX1, cur.resY1, cur.resSlope, 'resistance', cfg.tolerancePct))
    hits.push({ kind: 'resistance', lineVal: cur.resVal, sup, res });
  return hits;
}
function lineSlope(p1, p2) { return (p2.price - p1.price) / (p2.time - p1.time); }
const TRENDLINE_SR_EXTEND_BARS = 30;
function lineSeriesFromPts(p1, p2, klines) {
  const slope = lineSlope(p1, p2);
  const pts = klines.filter(k => k.time >= p1.time).map(k => ({ time: k.time, value: p1.price + slope * (k.time - p1.time) }));
  // Estende la linea oltre l'ultima candela reale invece di troncarla lì: un raggio
  // continuo, non un segmento che si interrompe di colpo sull'ultimo dato disponibile.
  if (pts.length >= 2 && klines.length >= 2) {
    const step = klines[klines.length - 1].time - klines[klines.length - 2].time;
    if (step > 0) {
      const lastT = pts[pts.length - 1].time;
      for (let i = 1; i <= TRENDLINE_SR_EXTEND_BARS; i++) {
        const t = lastT + step * i;
        pts.push({ time: t, value: p1.price + slope * (t - p1.time) });
      }
    }
  }
  return pts;
}
function applyTrendlineSRToSlot(s) {
  if (s.srSeries.sup) { try { s.chart.removeSeries(s.srSeries.sup); } catch(e) {} s.srSeries.sup = null; }
  if (s.srSeries.res) { try { s.chart.removeSeries(s.srSeries.res); } catch(e) {} s.srSeries.res = null; }
  if (!srActive || !s.klines || s.klines.length < TRENDLINE_SR_CFG.longPeriod + 2) return;
  const hits = detectActiveTrendlines(s.klines, TRENDLINE_SR_CFG);
  const lb = { priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };
  for (const hit of hits) {
    const pts = hit.kind === 'support' ? hit.sup : hit.res;
    const color = hit.kind === 'support' ? '#22c55e' : '#ef4444';
    const line = lineSeriesFromPts(pts.p1, pts.p2, s.klines);
    const series = addS(s.chart, 'LineSeries', { ...lb, color, lineWidth: 2 });
    series.setData(line);
    if (hit.kind === 'support') s.srSeries.sup = series; else s.srSeries.res = series;
  }
}

function applyFsTrendlineSR() {

// ── Channel fill primitive (riempimento canale tra upper e lower) ──────────────
class _ChannelFillPrimitive {
  constructor(slot, chart) {
    this._slot = slot;
    this._series = null;
    const renderer = {
      draw: target => target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio, verticalPixelRatio }) => {
        const s = this._slot, series = this._series;
        if (!series || !channelActive || !s.channelData) return;
        const { upper, lower } = s.channelData;
        if (!upper.length || !lower.length) return;
        const ts = chart.timeScale();
        ctx.save();
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < upper.length; i++) {
          const x = ts.timeToCoordinate(upper[i].time);
          const y = series.priceToCoordinate(upper[i].value);
          if (x == null || y == null) continue;
          const xp = x * horizontalPixelRatio, yp = y * verticalPixelRatio;
          if (!started) { ctx.moveTo(xp, yp); started = true; } else ctx.lineTo(xp, yp);
        }
        for (let i = lower.length - 1; i >= 0; i--) {
          const x = ts.timeToCoordinate(lower[i].time);
          const y = series.priceToCoordinate(lower[i].value);
          if (x == null || y == null) continue;
          ctx.lineTo(x * horizontalPixelRatio, y * verticalPixelRatio);
        }
        if (started) { const _cfg = getChannelCfg(); ctx.closePath(); ctx.fillStyle = _hexToRgba(_cfg.bgColor, (_cfg.bgOpacity ?? 10) / 100); ctx.fill(); }
        ctx.restore();
      })
    };
    this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
  }
  attached({ series }) { this._series = series; }
  detached() { this._series = null; }
  updateAllViews() {}
  paneViews() { return [this._view]; }
}

// ── Trend Band fill primitive (riempimento tra EMA fast/slow, colore per-bar) ──
class _TrendBandFillPrimitive {
  constructor(slot, chart) {
    this._slot = slot;
    this._series = null;
    const renderer = {
      draw: target => target.useBitmapCoordinateSpace(({ context: ctx, horizontalPixelRatio, verticalPixelRatio }) => {
        const s = this._slot, series = this._series;
        if (!series || !tbActive || !s.tbData) return;
        const { fast, slow, color } = s.tbData;
        if (fast.length < 2) return;
        const ts = chart.timeScale();
        ctx.save();
        const _cfg = getTbCfg();
        const alpha = (100 - (_cfg.bandTransp ?? 35)) / 100;
        for (let i = 0; i < fast.length - 1; i++) {
          const x0 = ts.timeToCoordinate(fast[i].time), x1 = ts.timeToCoordinate(fast[i+1].time);
          if (x0 == null || x1 == null) continue;
          const yf0 = series.priceToCoordinate(fast[i].value),   yf1 = series.priceToCoordinate(fast[i+1].value);
          const ys0 = series.priceToCoordinate(slow[i].value),   ys1 = series.priceToCoordinate(slow[i+1].value);
          if (yf0 == null || yf1 == null || ys0 == null || ys1 == null) continue;
          const xp0 = x0 * horizontalPixelRatio, xp1 = x1 * horizontalPixelRatio;
          ctx.beginPath();
          ctx.moveTo(xp0, yf0 * verticalPixelRatio);
          ctx.lineTo(xp1, yf1 * verticalPixelRatio);
          ctx.lineTo(xp1, ys1 * verticalPixelRatio);
          ctx.lineTo(xp0, ys0 * verticalPixelRatio);
          ctx.closePath();
          ctx.fillStyle = _hexToRgba(color[i], alpha);
          ctx.fill();
        }
        ctx.restore();
      })
    };
    this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
  }
  attached({ series }) { this._series = series; }
  detached() { this._series = null; }
  updateAllViews() {}
  paneViews() { return [this._view]; }
}

// ── OB Levels band fill (riempimento tra le linee bid/ask) ────────────────────
class _ObBandFillPrimitive {
  constructor(slot) {
    this._slot = slot;
    this._series = null;
    const renderer = {
      draw: target => target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, verticalPixelRatio }) => {
        const s = this._slot, series = this._series;
        if (!series || !s.obActive || s.obBidVal == null || s.obAskVal == null) return;
        const y1 = series.priceToCoordinate(s.obBidVal), y2 = series.priceToCoordinate(s.obAskVal);
        if (y1 == null || y2 == null) return;
        const top = Math.min(y1, y2) * verticalPixelRatio, bot = Math.max(y1, y2) * verticalPixelRatio;
        ctx.save();
        ctx.fillStyle = _hexToRgba(getLvCfg().obBid.color, 0.12);
        ctx.fillRect(0, top, bitmapSize.width, Math.max(1, bot - top));
        ctx.restore();
      })
    };
    this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
  }
  attached({ series }) { this._series = series; }
  detached() { this._series = null; }
  updateAllViews() {}
  paneViews() { return [this._view]; }
}

function addS(chart, type, opts, paneIndex) {
  // Le LineSeries qui sono sempre indicatori overlay (EMA/canale/BB), mai la serie
  // principale: escluderle dall'autoscale evita che un EMA223 lontano dal prezzo
  // schiacci le candele in una riga piatta illeggibile — la scala verticale segue
  // solo le candele.
  if (type === 'LineSeries') opts = { ...opts, autoscaleInfoProvider: () => null };
  if (typeof chart.addSeries==='function' && LC[type]) return paneIndex != null ? chart.addSeries(LC[type], opts, paneIndex) : chart.addSeries(LC[type], opts);
  const m = {CandlestickSeries:'addCandlestickSeries',LineSeries:'addLineSeries'};
  return chart[m[type]](opts);
}

// ── Candle Countdown Primitive ─────────────────────────────────────────────────
const _MTF_TF_SECS = {'1':60,'5':300,'30':1800,'60':3600,'240':14400,'D':86400,'W':604800};
function _mtfCdRemain(tf) {
    const now = Math.floor(Date.now()/1000), sec = _MTF_TF_SECS[tf];
    if (tf === 'M') { const d=new Date(now*1000); return Math.max(0, Math.ceil((Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 1) - now*1000) / 1000)); }
    if (!sec) return 0;
    if (tf === 'W') { const d=new Date(now*1000),dow=d.getUTCDay(); return 604800-(((dow===0?6:dow-1)*86400+now%86400)%604800); }
    if (tf === 'D') return 86400-(now%86400);
    return sec-(now%sec);
}
const _MTF_CD_WARN_S  = {'1':30, '5':60, '30':300, '60':600, '240':300, 'D':3600, 'W':86400, 'M':86400};
const _MTF_CD_BLINK_S = {'1':10, '5':10, '30':60,  '60':60};
function updateFSCountdown() {
    for (const {tf} of FS_TFS) {
        const el = document.getElementById('fs-tf-cd-' + tf);
        if (!el) continue;
        const rem = _mtfCdRemain(tf);
        const warn = rem <= _MTF_CD_WARN_S[tf];
        const blink = _MTF_CD_BLINK_S[tf] != null && rem <= _MTF_CD_BLINK_S[tf];
        el.textContent = _mtfCdFmt(rem);
        el.style.color = warn ? '#FF9C2E' : '#F3F4F6';
        el.classList.toggle('tf-cd-blink', blink);
    }
}
setInterval(updateFSCountdown, 1000);
function _mtfCdFmt(s) {
    if (s<=0) return '0:00';
    if (s>=3600) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
class _MtfCountdownPrimitive {
    constructor(slot) { this._slot=slot; this._series=null; }
    attached({series}) { this._series=series; }
    detached() { this._series=null; }
    updateAllViews() {}

    priceAxisViews() {
        const s=this._slot;
        if (!this._series||!s.cfg?.tf||!s.lastPrice) return [];
        const y=this._series.priceToCoordinate(s.lastPrice);
        if (y==null) return [];
        const bull=s.lastOpen==null||s.lastPrice>=s.lastOpen;
        const rem=_mtfCdRemain(s.cfg.tf);
        return [{coordinate:()=>y+17,text:()=>_mtfCdFmt(rem),textColor:()=>'#FFFFFF',backColor:()=>bull?'#20B26C':'#EF454A'}];
    }
}

function fmtPrice(p) {
  if (p>=10000) return p.toLocaleString('en-US',{maximumFractionDigits:1});
  if (p>=1)     return p.toFixed(3);
  if (p>=0.01)  return p.toFixed(5);
  return p.toFixed(7);
}

function fmtVol(v) {
  if (v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+(v/1e3).toFixed(0)+'K';
}

function fmtCountdown(secs) {
  if (secs <= 0) return '00:00';
  if (secs >= 3600) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

    slots.push({

      dayHighLine:null, dayLowLine:null,
      prevHighLine:null, prevLowLine:null,
      athLine:null, atlLine:null,
      rangeActive: false, rangeP1: null, _rangeMD: null, _rangeMM: null, _rangeMU: null, _rangeCM: null, _rangeHoverLine: null, _rangeHoverMM: null, _rangeHoverML: null,
      hlineActive: false, hlines: [], _hlineMD: null, _hlineMM: null, _hlineMU: null, _hlineCM: null, _hlineDragging: null, _hlineHoverLine: null, _hlineHoverMM: null, _hlineHoverML: null,
      trendActive: false, trendlines: sharedTrendlines, _trendP1: null, _trendPrev: null, _trendMD: null, _trendMM: null, _trendMU: null, _trendCM: null, _trendDrag: null, _trendRAF: null,
      dayPrimitive: null,
      lastCandleStartUtc: null,
      lastWsMs: 0,
      lastPrice: null,
      lastOpen: null,
      crosshairPrice: null,
      alertLines: new Map(),
      bbSeries: {upper:null, mid:null, lower:null},
      channelSeries: {upper:null, mid:null, lower:null}, channelData: null,
      sqzLines: {hi:null, lo:null},
      grabWaveS: {high:null, low:null, close:null},
      grabMurreyS: {mid:null, lo:null, hi:null},
      grabState: null,
      tbSeries: {fast:null, slow:null}, tbData: null, tbState: null,
      tbMarkersHandle: null, tbMarkersData: [],
      obLevBidLine: null, obLevAskLine: null,
      srSeries: { sup: null, res: null },

    });
    try { candleS.attachPrimitive(new _MtfCountdownPrimitive(slots[slots.length-1])); } catch(e) {}
    try { candleS.attachPrimitive(new _ChannelFillPrimitive(slots[slots.length-1], chart)); } catch(e) {}
    try { candleS.attachPrimitive(new _TrendBandFillPrimitive(slots[slots.length-1], chart)); } catch(e) {}
    DrawTools.attachToolContextMenu(body, {

  });

async function loadSlot(idx, dailyData) {
  const s = slots[idx];
  try {
    const r = await fetch(`api/klines?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
    const j = await r.json();
    if (!j.success) return;
    const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;
    s.candleS.setData(klines);
    if (klines.length) { s.lastPrice = klines[klines.length-1].close; s.lastOpen = klines[klines.length-1].open; }
    s.klineCount = klines.length;
    s.klines = klines.slice();
    s.klinesVolMap = new Map(klines.map(k => [k.time, k.volume]));
    const _lastN = klines.slice(-20);
    s.avgVol = _lastN.length > 0 ? _lastN.reduce((acc,k) => acc+(k.volume||0), 0) / _lastN.length : 0;
    s.dayPrimitive = attachDayLines(s.candleS, s.chart, klines, s.cfg.tf, s.dayPrimitive);
    s.candleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
    applyEmaToSlot(s);
    s.chart.timeScale().setVisibleLogicalRange({ from: klines.length - getCandlesForTF(s.cfg.tf), to: klines.length + 3 });

    // H / L / pH / pL lines
    if (dailyData) {
      const {today, prev} = dailyData;
      s.dayHighVal = today.high; s.dayLowVal = today.low;
      s.prevHighVal = prev.high; s.prevLowVal = prev.low;
      const _slvl = getLvCfg();
      if (_slvl.dayHigh.vis?.mtf  !== false) s.dayHighLine  = s.candleS.createPriceLine({price:today.high,color:_slvl.dayHigh.color, lineWidth:_slvl.dayHigh.width, lineStyle:_slvl.dayHigh.style, axisLabelVisible:false,title:''});
      if (_slvl.dayLow.vis?.mtf   !== false) s.dayLowLine   = s.candleS.createPriceLine({price:today.low, color:_slvl.dayLow.color,  lineWidth:_slvl.dayLow.width,  lineStyle:_slvl.dayLow.style,  axisLabelVisible:false,title:''});
      if (_slvl.prevHigh.vis?.mtf !== false) s.prevHighLine = s.candleS.createPriceLine({price:prev.high, color:_slvl.prevHigh.color,lineWidth:_slvl.prevHigh.width,lineStyle:_slvl.prevHigh.style,axisLabelVisible:false,title:''});
      if (_slvl.prevLow.vis?.mtf  !== false) s.prevLowLine  = s.candleS.createPriceLine({price:prev.low,  color:_slvl.prevLow.color, lineWidth:_slvl.prevLow.width, lineStyle:_slvl.prevLow.style, axisLabelVisible:false,title:''});
    }
  } catch(e) {
    console.error(`MTF load ${s.cfg.label} error:`, e);
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────────
let _wsPingTimer = null;

function openWS() {
  closeWS();
  setWSDot('connecting');
  // const locale per i handler: se openWS() viene richiamata di nuovo prima che questa
  // connessione finisca di aprirsi, la variabile globale `ws` punta già al socket nuovo —
  // send() sul vecchio (via `ws` condivisa) fallirebbe con "Still in CONNECTING state".
  const sock = new WebSocket('wss://stream.bybit.com/v5/public/linear');
  ws = sock;
  sock.onopen = () => {
    setWSDot('live');
    sock.send(JSON.stringify({
      op: 'subscribe',
      args: TF_SLOTS.map(s => `kline.${s.tf}.${SYM}`),
    }));
    // Bybit requires application-level ping every 20s to keep connection alive
    _wsPingTimer = setInterval(() => {
      if (sock.readyState === WebSocket.OPEN) sock.send('{"op":"ping"}');
    }, 20000);
  };
  sock.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (!msg.topic || !msg.topic.startsWith('kline.')) return;
    const tf    = msg.topic.split('.')[1];
    const idx   = slots.findIndex(s => s.cfg.tf === tf);
    if (idx === -1) return;
    const b = msg.data[0];
    const confirmed = b.confirm === true || b.confirm === 'true';
    const candleStart = Math.floor(parseInt(b.start)/1000);
    const candle = {
      time:  candleStart + TZ_OFFSET_S,
      open:  parseFloat(b.open),
      high:  parseFloat(b.high),
      low:   parseFloat(b.low),
      close: parseFloat(b.close),
      volume: parseFloat(b.volume) || 0,
    };
    const s = slots[idx];
    s.lastCandleStartUtc = candleStart;
    s.lastWsMs = Date.now();
    try { s.candleS.update(candle); } catch(e) { console.error('mtf WS update skipped ('+tf+'):', e); }
    s.lastPrice = candle.close; s.lastOpen = candle.open;
    for (const {p} of EMA_CFG) {
      if (s.lastEMA[p] === null) continue;
      const k    = 2/(p+1);
      const live = candle.close * k + s.lastEMA[p] * (1-k);
      s.emaS[p].update({time: candle.time, value: live});
      if (confirmed) s.lastEMA[p] = live;
    }
    // aggiorna klines live
    let isNewBar = false;
    if (s.klines.length > 0) {
      const last = s.klines[s.klines.length-1];
      if (last.time === candle.time) {
        s.klines[s.klines.length-1] = {time:candle.time,open:last.open,high:Math.max(last.high,candle.high),low:Math.min(last.low,candle.low),close:candle.close,volume:candle.volume};
      } else {
        s.klines.push({...candle});
        isNewBar = true;
      }
    }
    if (sqzActive) {
      _drawSqzChannel(s.candleS, s.klines, s.sqzLines);
    }
    if (bbActive && s.bbSeries.upper) {
      const _bb = getBbCfg();
      if (s.klines.length >= _bb.period) {
        const sl = s.klines.slice(-_bb.period);
        const mean = sl.reduce((a,c)=>a+c.close,0)/_bb.period;
        const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/_bb.period);
        s.bbSeries.upper.update({time:candle.time, value:mean+_bb.mult*std});
        s.bbSeries.mid.update(  {time:candle.time, value:mean});
        s.bbSeries.lower.update({time:candle.time, value:mean-_bb.mult*std});
      }
    }
    if (channelActive && s.channelSeries.upper && s.klines.length >= getChannelCfg().period) {
      const _cper = getChannelCfg().period;
      const csl = s.klines.slice(-_cper);
      let sumC=0, sumH=0, sumL=0;
      for (const c of csl) { sumC += c.close; sumH += c.high; sumL += c.low; }
      const liveC = sumC/_cper, liveH = sumH/_cper, liveL = sumL/_cper;
      s.channelSeries.mid.update(  {time:candle.time, value:liveC});
      s.channelSeries.upper.update({time:candle.time, value:liveH});
      s.channelSeries.lower.update({time:candle.time, value:liveL});
      if (s.channelData) {
        const _cdUpd = (arr, val) => { const last = arr[arr.length-1], pt = {time:candle.time, value:val}; if (last && last.time === candle.time) arr[arr.length-1] = pt; else arr.push(pt); };
        _cdUpd(s.channelData.upper, liveH);
        _cdUpd(s.channelData.lower, liveL);
      }
    }
    if (grabActive) _grabLiveUpdate(s, candle, confirmed, getGrabCfg());
    if (tbActive) _tbLiveUpdate(s, candle, confirmed, getTbCfg());
    if (srActive && (confirmed || isNewBar)) applyTrendlineSRToSlot(s);
  };
  sock.onerror = () => setWSDot('error');
  sock.onclose = () => {
    setWSDot('off');
    clearInterval(_wsPingTimer); _wsPingTimer = null;
    wsTimer = setTimeout(openWS, 5000);
  };
}

// ── Book WS (solo top-of-book, per il prezzo live) ────────────────────────────
// Il kline WS di Bybit è trade-driven e throttlato a ~1/s: se il mercato è
// fermo il prezzo della candela in formazione resta "vecchio" per secondi.
// Il book (orderbook.1, aggiornato ad ogni variazione di best bid/ask) segue
// il prezzo molto più da vicino, quindi lo usiamo per "spingere" la candela
// live tra un kline update e l'altro — stesso pattern già in uso in trade.js.
// Un'unica sottoscrizione condivisa alimenta tutti gli slot della griglia e,
// se aperto, il grafico fullscreen.
function openMtfBookWS() {
  closeMtfBookWS();
  const sock = new WebSocket('wss://stream.bybit.com/v5/public/linear');
  mtfBookWS = sock;
  sock.onopen = () => sock.send(JSON.stringify({ op: 'subscribe', args: [`orderbook.1.${SYM}`] }));
  sock.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (!msg.topic || !msg.topic.startsWith('orderbook.') || !msg.data) return;
    const bidRow = msg.data.b && msg.data.b[0], askRow = msg.data.a && msg.data.a[0];
    if (!bidRow || !askRow) return;
    const bid = parseFloat(bidRow[0]), ask = parseFloat(askRow[0]);
    if (!isFinite(bid) || !isFinite(ask)) return;
    const midPrice = (bid + ask) / 2;
    for (const s of slots) _mtfBookPatchSlot(s, midPrice);
    if (fsCandleS) _mtfBookPatchFS(midPrice);
  };
  sock.onerror = () => {};
  sock.onclose = () => { mtfBookWsTimer = setTimeout(openMtfBookWS, 5000); };
}

function closeMtfBookWS() {
  clearTimeout(mtfBookWsTimer);
  if (mtfBookWS) { try { mtfBookWS.close(); } catch(e) {} mtfBookWS = null; }
}

// Calcola l'inizio del bar "corrente" secondo il wall-clock, nello stesso sistema
// di riferimento (UTC boundary + TZ_OFFSET_S per il display) usato da REST/WS.
// Bybit allinea i bar boundary all'epoch UTC: bisogna arrotondare PRIMA in UTC e
// solo dopo applicare TZ_OFFSET_S. Arrotondare il tempo già shiftato (nowUtc +
// offset) è sbagliato quando l'offset non è multiplo esatto di barSecs (es.
// offset +2h su barSecs=4h/D/W): produce un boundary sfasato di
// "TZ_OFFSET_S % barSecs" secondi rispetto a quello reale, e la candela WS
// autentica (correttamente allineata) arriva poi con un time "più vecchio" del
// boundary sintetico già scritto sulla serie → lightweight-charts throws
// "Cannot update oldest data" e salta il resto dell'update di quel tick.
// Il mensile (M) è un caso speciale: TF_SECONDS.M=2592000 è un'approssimazione
// fissa a 30 giorni, che NON corrisponde ai bar mensili reali di Bybit (allineati
// al calendario, 28-31 giorni) — va calcolato con l'inizio del mese di calendario
// corrente, non con una divisione a intervallo fisso.
function _expectedBarOpen(tf, barSecs) {
  const nowUtc = Math.floor(Date.now() / 1000);
  if (tf === 'M') {
    const d = new Date(nowUtc * 1000);
    return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1) / 1000) + TZ_OFFSET_S;
  }
  return Math.floor(nowUtc / barSecs) * barSecs + TZ_OFFSET_S;
}

// Se il boundary del TF è stato superato, apre subito una nuova candela lato
// client (invece di aspettare il prossimo kline confermato) usando il
// mid-price del book. WS kline continua ad arrivare e corregge i valori
// sintetici con quelli ufficiali non appena disponibili.
function _mtfRollSlotIfNeeded(s, midPrice) {
  const klines = s.klines;
  if (!s.candleS || !klines.length) return false;
  const barSecs = TF_SECONDS[s.cfg.tf];
  if (!barSecs) return false;
  const last = klines[klines.length - 1];
  const expectedOpen = _expectedBarOpen(s.cfg.tf, barSecs);
  if (expectedOpen <= last.time) return false;

  const prevClose = last.close;
  for (const { p } of EMA_CFG) {
    if (s.lastEMA[p] == null) continue;
    const k = 2 / (p + 1);
    s.lastEMA[p] = prevClose * k + s.lastEMA[p] * (1 - k);
  }
  if (grabActive && s.grabState) {
    // A differenza di lastEMA (EMA di close), qui usiamo gli high/low REALI dell'ultima
    // candela chiusa (non prevClose) — s.grabState traccia EMA(high)/EMA(low) separate.
    const _gk = 2 / (getGrabCfg().emaPeriod + 1);
    s.grabState.emaHigh  = last.high  * _gk + s.grabState.emaHigh  * (1 - _gk);
    s.grabState.emaLow   = last.low   * _gk + s.grabState.emaLow   * (1 - _gk);
    s.grabState.emaClose = prevClose * _gk + s.grabState.emaClose * (1 - _gk);
  }
  if (tbActive && s.tbState) {
    // Stesso principio del blocco grabState sopra: finalizza EMA fast/slow + ATR
    // sull'ultima candela REALMENTE chiusa (TR usa s.tbState.prevClose, il close
    // precedente ancora quello) prima di creare la nuova candela sintetica.
    const _tbc = getTbCfg();
    const kf = 2 / (_tbc.fastLen + 1), ks = 2 / (_tbc.slowLen + 1);
    const tr = Math.max(last.high - last.low, Math.abs(last.high - s.tbState.prevClose), Math.abs(last.low - s.tbState.prevClose));
    s.tbState.atr      = s.tbState.atr != null ? (tr - s.tbState.atr) / 14 + s.tbState.atr : null;
    s.tbState.emaFast  = prevClose * kf + s.tbState.emaFast * (1 - kf);
    s.tbState.emaSlow  = prevClose * ks + s.tbState.emaSlow * (1 - ks);
    s.tbState.prevClose = prevClose;
  }

  const newCandle = {
    time: expectedOpen, open: prevClose,
    high: Math.max(prevClose, midPrice), low: Math.min(prevClose, midPrice),
    close: midPrice, volume: 0,
  };
  klines.push({ ...newCandle });
  s.lastPrice = newCandle.close; s.lastOpen = newCandle.open;
  if (!grabActive) { try { s.candleS.update(newCandle); } catch(e) {} }

  for (const { p } of EMA_CFG) {
    if (s.lastEMA[p] == null) continue;
    const k    = 2 / (p + 1);
    const live = newCandle.close * k + s.lastEMA[p] * (1 - k);
    try { s.emaS[p].update({ time: newCandle.time, value: live }); } catch(e) {}
  }
  if (bbActive && s.bbSeries.upper && klines.length >= getBbCfg().period) {
    const _bb = getBbCfg();
    const sl = klines.slice(-_bb.period);
    const mean = sl.reduce((a,c)=>a+c.close,0)/_bb.period;
    const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/_bb.period);
    s.bbSeries.upper.update({time:newCandle.time, value:mean+_bb.mult*std});
    s.bbSeries.mid.update(  {time:newCandle.time, value:mean});
    s.bbSeries.lower.update({time:newCandle.time, value:mean-_bb.mult*std});
  }
  if (channelActive && s.channelSeries.upper && klines.length >= getChannelCfg().period) {
    const _cper = getChannelCfg().period;
    const csl = klines.slice(-_cper);
    let sumC=0, sumH=0, sumL=0;
    for (const c of csl) { sumC += c.close; sumH += c.high; sumL += c.low; }
    const liveC = sumC/_cper, liveH = sumH/_cper, liveL = sumL/_cper;
    s.channelSeries.mid.update(  {time:newCandle.time, value:liveC});
    s.channelSeries.upper.update({time:newCandle.time, value:liveH});
    s.channelSeries.lower.update({time:newCandle.time, value:liveL});
    if (s.channelData) {
      const _cdUpd = (arr, val) => { const last = arr[arr.length-1], pt = {time:newCandle.time, value:val}; if (last && last.time === newCandle.time) arr[arr.length-1] = pt; else arr.push(pt); };
      _cdUpd(s.channelData.upper, liveH);
      _cdUpd(s.channelData.lower, liveL);
    }
  }
  if (sqzActive) { try { _drawSqzChannel(s.candleS, klines, s.sqzLines); } catch(e) {} }
  if (grabActive) _grabLiveUpdate(s, newCandle, false, getGrabCfg());
  if (tbActive) _tbLiveUpdate(s, newCandle, false, getTbCfg());
  return true;
}

function _mtfBookPatchSlot(s, midPrice) {
  const klines = s.klines;
  if (!s.candleS || !klines.length) return;
  if (_mtfRollSlotIfNeeded(s, midPrice)) return;
  const last = klines[klines.length - 1];
  last.close = midPrice;
  if (midPrice > last.high) last.high = midPrice;
  if (midPrice < last.low)  last.low  = midPrice;
  s.lastPrice = last.close;
  if (grabActive) _grabLiveColor(s, last, getGrabCfg());
  else try { s.candleS.update({ ...last }); } catch(e) {}
  if (tbActive) _tbLiveUpdate(s, last, false, getTbCfg());
}

function _mtfRollFSIfNeeded(midPrice) {
  if (!fsCandleS || !fsKlines.length) return false;
  const barSecs = TF_SECONDS[fsTF];
  if (!barSecs) return false;
  const last = fsKlines[fsKlines.length - 1];
  const expectedOpen = _expectedBarOpen(fsTF, barSecs);
  if (expectedOpen <= last.time) return false;

  const prevClose = last.close;
  for (const { p } of EMA_CFG) {
    if (fsLastEMA[p] == null) continue;
    const k = 2 / (p + 1);
    fsLastEMA[p] = prevClose * k + fsLastEMA[p] * (1 - k);
  }
  if (grabActive && fsGrabState) {
    const _gk = 2 / (getGrabCfg().emaPeriod + 1);
    fsGrabState.emaHigh  = last.high  * _gk + fsGrabState.emaHigh  * (1 - _gk);
    fsGrabState.emaLow   = last.low   * _gk + fsGrabState.emaLow   * (1 - _gk);
    fsGrabState.emaClose = prevClose * _gk + fsGrabState.emaClose * (1 - _gk);
  }
  if (tbActive && fsTbState) {
    const _tbc = getTbCfg();
    const kf = 2 / (_tbc.fastLen + 1), ks = 2 / (_tbc.slowLen + 1);
    const tr = Math.max(last.high - last.low, Math.abs(last.high - fsTbState.prevClose), Math.abs(last.low - fsTbState.prevClose));
    fsTbState.atr       = fsTbState.atr != null ? (tr - fsTbState.atr) / 14 + fsTbState.atr : null;
    fsTbState.emaFast    = prevClose * kf + fsTbState.emaFast * (1 - kf);
    fsTbState.emaSlow    = prevClose * ks + fsTbState.emaSlow * (1 - ks);
    fsTbState.prevClose  = prevClose;
  }

  const newCandle = {
    time: expectedOpen, open: prevClose,
    high: Math.max(prevClose, midPrice), low: Math.min(prevClose, midPrice),
    close: midPrice, volume: 0,
  };
  fsKlines.push({ ...newCandle });
  fsLastPrice = newCandle.close; fsLastOpen = newCandle.open;
  if (!grabActive) { try { fsCandleS.update(newCandle); } catch(e) {} }

  for (const { p } of EMA_CFG) {
    if (fsLastEMA[p] == null) continue;
    const k    = 2 / (p + 1);
    const live = newCandle.close * k + fsLastEMA[p] * (1 - k);
    try { fsEmaS[p].update({ time: newCandle.time, value: live }); } catch(e) {}
  }
  if (bbActive && fsBbSeries.upper && fsKlines.length >= getBbCfg().period) {
    const _bb = getBbCfg();
    const sl = fsKlines.slice(-_bb.period);
    const mean = sl.reduce((a,c)=>a+c.close,0)/_bb.period;
    const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/_bb.period);
    fsBbSeries.upper.update({time:newCandle.time, value:mean+_bb.mult*std});
    fsBbSeries.mid.update(  {time:newCandle.time, value:mean});
    fsBbSeries.lower.update({time:newCandle.time, value:mean-_bb.mult*std});
  }
  if (channelActive && fsChannelSeries.upper && fsKlines.length >= getChannelCfg().period) {
    const _cper = getChannelCfg().period;
    const csl = fsKlines.slice(-_cper);
    let sumC=0, sumH=0, sumL=0;
    for (const c of csl) { sumC += c.close; sumH += c.high; sumL += c.low; }
    const liveC = sumC/_cper, liveH = sumH/_cper, liveL = sumL/_cper;
    fsChannelSeries.mid.update(  {time:newCandle.time, value:liveC});
    fsChannelSeries.upper.update({time:newCandle.time, value:liveH});
    fsChannelSeries.lower.update({time:newCandle.time, value:liveL});
    if (fsChannelData) {
      const _cdUpd = (arr, val) => { const last = arr[arr.length-1], pt = {time:newCandle.time, value:val}; if (last && last.time === newCandle.time) arr[arr.length-1] = pt; else arr.push(pt); };
      _cdUpd(fsChannelData.upper, liveH);
      _cdUpd(fsChannelData.lower, liveL);
    }
  }
  if (sqzActive) { try { _drawSqzChannel(fsCandleS, fsKlines, fsSqzLines); } catch(e) {} }
  if (grabActive) _grabLiveUpdate(fsGrabSlot, newCandle, false, getGrabCfg());
  if (tbActive) _tbLiveUpdate(fsTbSlot, newCandle, false, getTbCfg());
  return true;
}

function _mtfBookPatchFS(midPrice) {
  if (!fsCandleS || !fsKlines.length) return;
  if (_mtfRollFSIfNeeded(midPrice)) return;
  const last = fsKlines[fsKlines.length - 1];
  last.close = midPrice;
  if (midPrice > last.high) last.high = midPrice;
  if (midPrice < last.low)  last.low  = midPrice;
  fsLastPrice = last.close;
  if (tbActive) _tbLiveUpdate(fsTbSlot, last, false, getTbCfg());
  if (grabActive) { _grabLiveColor(fsGrabSlot, last, getGrabCfg()); return; }
  try { fsCandleS.update({ ...last }); } catch(e) {}
}

async function loadOBData() {
    try {
        const [r, rd] = await Promise.all([
            fetch(`api/klines?symbol=${SYM}&interval=${obTF}`),
            fetch(`api/klines?symbol=${SYM}&interval=D`),
        ]);
        const j = await r.json(); const jd = await rd.json();
        if (!j.success) return;
        const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;

            obEmaS[p].setData(ema);
            obLastEMA[p] = ema[ema.length - 1].value;
        }
        obChart.timeScale().fitContent();
        if (obDayHighLine)  { try { obCandleS.removePriceLine(obDayHighLine);  } catch(e) {} obDayHighLine  = null; }
        if (obDayLowLine)   { try { obCandleS.removePriceLine(obDayLowLine);   } catch(e) {} obDayLowLine   = null; }

        if (obPrevLowLine)  { try { obCandleS.removePriceLine(obPrevLowLine);  } catch(e) {} obPrevLowLine  = null; }
        if (jd.success && jd.data && jd.data.length) {

            if (jd.data.length >= 2) {

            }
        }
    } catch(e) { console.error('OB chart load error:', e); }
}

function connectOBWS() {
    closeOBWS();
    const sock = new WebSocket('wss://stream.bybit.com/v5/public/linear');
    obWS = sock;
    sock.onopen = () => sock.send(JSON.stringify({ op:'subscribe', args:[`kline.${obTF}.${SYM}`] }));
    sock.onmessage = ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
        if (!msg.topic || !msg.topic.startsWith('kline.')) return;
        const b = msg.data[0];
        const confirmed = b.confirm === true || b.confirm === 'true';
        const candle = { time: Math.floor(parseInt(b.start)/1000) + TZ_OFFSET_S, open: parseFloat(b.open), high: parseFloat(b.high), low: parseFloat(b.low), close: parseFloat(b.close) };
        try { obCandleS.update(candle); } catch(e) { console.error('mtf OB WS update skipped:', e); }
        for (const {p} of EMA_CFG) {
            if (obLastEMA[p] == null) continue;
            const k = 2/(p+1);
            const live = candle.close * k + obLastEMA[p] * (1-k);
            obEmaS[p].update({ time: candle.time, value: live });
            if (confirmed) obLastEMA[p] = live;
        }
    };
    sock.onerror = () => {};
    sock.onclose = () => { obWsTimer = setTimeout(connectOBWS, 5000); };
}

function closeOBWS() {
    clearTimeout(obWsTimer);
    if (obWS) { try { obWS.close(); } catch(e) {} obWS = null; }
}

function connectFSWS() {
    closeFSWS();
    const sock = new WebSocket('wss://stream.bybit.com/v5/public/linear');
    fsWS = sock;
    sock.onopen = () => sock.send(JSON.stringify({ op:'subscribe', args:[`kline.${fsTF}.${SYM}`] }));
    sock.onmessage = ev => {
        let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
        if (!msg.topic || !msg.topic.startsWith('kline.')) return;
        const b = msg.data[0]; const confirmed = b.confirm === true || b.confirm === 'true';
        const candle = { time: Math.floor(parseInt(b.start)/1000) + TZ_OFFSET_S, open: parseFloat(b.open), high: parseFloat(b.high), low: parseFloat(b.low), close: parseFloat(b.close), volume: parseFloat(b.volume) || 0 };
        try { fsCandleS.update(candle); } catch(e) { console.error('mtf FS WS update skipped:', e); }
        fsLastPrice = candle.close; fsLastOpen = candle.open;
        for (const {p} of EMA_CFG) {
            if (fsLastEMA[p] == null) continue;
            const k = 2/(p+1);
            const live = candle.close * k + fsLastEMA[p] * (1-k);
            fsEmaS[p].update({ time: candle.time, value: live });
            if (confirmed) fsLastEMA[p] = live;
        }
        if (fsKlines.length > 0) {
            const last = fsKlines[fsKlines.length-1];
            if (last.time === candle.time) {
                fsKlines[fsKlines.length-1] = {time:candle.time, open:last.open, high:Math.max(last.high,candle.high), low:Math.min(last.low,candle.low), close:candle.close, volume:candle.volume};
            } else {
                fsKlines.push({...candle});
            }
            if (sqzActive) {
                _drawSqzChannel(fsCandleS, fsKlines, fsSqzLines);
            }
            if (bbActive && fsBbSeries.upper) {
                const _bb = getBbCfg();
                if (fsKlines.length >= _bb.period) {
                    const sl = fsKlines.slice(-_bb.period);
                    const mean = sl.reduce((a,c)=>a+c.close,0)/_bb.period;
                    const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/_bb.period);
                    fsBbSeries.upper.update({time:candle.time, value:mean+_bb.mult*std});
                    fsBbSeries.mid.update(  {time:candle.time, value:mean});
                    fsBbSeries.lower.update({time:candle.time, value:mean-_bb.mult*std});
                }
            }
            if (channelActive && fsChannelSeries.upper && fsKlines.length >= getChannelCfg().period) {
                const _cper = getChannelCfg().period;
                const csl = fsKlines.slice(-_cper);
                let sumC=0, sumH=0, sumL=0;
                for (const c of csl) { sumC += c.close; sumH += c.high; sumL += c.low; }
                const liveC = sumC/_cper, liveH = sumH/_cper, liveL = sumL/_cper;
                fsChannelSeries.mid.update(  {time:candle.time, value:liveC});
                fsChannelSeries.upper.update({time:candle.time, value:liveH});
                fsChannelSeries.lower.update({time:candle.time, value:liveL});
                if (fsChannelData) {
                    const _cdUpd = (arr, val) => { const last2 = arr[arr.length-1], pt = {time:candle.time, value:val}; if (last2 && last2.time === candle.time) arr[arr.length-1] = pt; else arr.push(pt); };
                    _cdUpd(fsChannelData.upper, liveH);
                    _cdUpd(fsChannelData.lower, liveL);
                }
            }
            if (grabActive) _grabLiveUpdate(fsGrabSlot, candle, confirmed, getGrabCfg());
            if (tbActive) _tbLiveUpdate(fsTbSlot, candle, confirmed, getTbCfg());
        }
    };
    sock.onerror = () => {};
    sock.onclose = () => { fsWsTimer = setTimeout(connectFSWS, 5000); };
}

function closeFSWS() {
    clearTimeout(fsWsTimer);
    if (fsWS) { try { fsWS.close(); } catch(e) {} fsWS = null; }
}

loadAll().then(() => {
  // Live polling via backend ws_manager — runs every 5s for 1m and 5m slots.
  // The backend WS (with ping_interval=20) stays connected reliably to Bybit;
  // the frontend polls it instead of depending on a direct browser→Bybit WS.
  async function _livePoll() {
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s.cfg.tf !== '1' && s.cfg.tf !== '5') continue;
      try {
        const r = await fetch(`api/klines/live?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
        const j = await r.json();
        if (!j.success || !j.data || !j.data.length) continue;
        // Update last 10 candles — fills any gap and keeps live candle current
        for (const c of j.data) s.candleS.update(c);
        // Show live EMA for the current open candle
        const lc = j.data[j.data.length - 1];
        for (const {p} of EMA_CFG) {
          if (s.lastEMA[p] === null) continue;
          const kk = 2/(p+1);
          s.emaS[p].update({time: lc.time, value: lc.close * kk + s.lastEMA[p] * (1-kk)});
        }
        // Sync timer with actual Bybit candle start time from backend
        const utcStart = lc.time - (TZ_OFFSET_S || j.utc_offset_s || 0);
        if (s.lastCandleStartUtc === null || utcStart >= s.lastCandleStartUtc) {
          s.lastCandleStartUtc = utcStart;
          s.lastWsMs = Date.now();
        }
      } catch(e) {}
    }
    setTimeout(_livePoll, 5000);
  }
  setTimeout(_livePoll, 3000); // first poll 3s after initial load
});

    'AVGOUSDT':'Broadcom','BABAUSDT':'Alibaba',    'BMNRUSDT':'BMNR',
    'BZUSDT':'Brent Oil', 'COINUSDT':'Coinbase',   'CRCLUSDT':'Circle',
    'CRWVUSDT':'CoreWeave','EWJUSDT':'Japan ETF',  'EWYUSDT':'Korea ETF',
    'GOOGLUSDT':'Alphabet','HOODUSDT':'Robinhood', 'INTCUSDT':'Intel',
    'IWMUSDT':'Russell 2k','LITEUSDT':'LITE',      'LLYUSDT':'Eli Lilly',
    'METAUSDT':'Meta',    'MRVLUSDT':'Marvell',    'MSFTUSDT':'Microsoft',
    'MSTRUSDT':'MicroStrategy','MUUSDT':'Micron',  'NVDAUSDT':'Nvidia',
    'ORCLUSDT':'Oracle',  'PLTRUSDT':'Palantir',   'QQQUSDT':'Nasdaq ETF',
    'SNDKUSDT':'SanDisk', 'SPYUSDT':'S&P 500',     'TSLAUSDT':'Tesla',
    'TSMUSDT':'TSMC',
    'XAUUSDT':'Gold',     'XAGUSDT':'Silver',      'CLUSDT':'Crude Oil',
};
// Alias: permette di trovare azioni/indici/materie prime cercando il nome reale
// (es. "nasdaq" -> QQQUSDT, "tesla" -> TSLAUSDT) invece del solo ticker.
function _csNameMatch(symbol, q) {
    const name = INSTRUMENT_NAMES[symbol];
    return !!name && name.toUpperCase().includes(q);
}

function openChartSearch() {
    document.getElementById('csearch-overlay').style.display = 'block';
    document.getElementById('csearch-modal').style.display   = 'block';
    const inp = document.getElementById('csearch-input');
    inp.value = '';
    document.getElementById('csearch-results').innerHTML =
        `<div style="padding:32px 0;text-align:center;font-size:11px;color:#4B5563;">${window.t('search_init')}</div>`;
    requestAnimationFrame(() => inp.focus());
}

function closeChartSearch() {
    document.getElementById('csearch-overlay').style.display = 'none';
    document.getElementById('csearch-modal').style.display   = 'none';
}

async function _csLoadCache() {
    if (_csCache) return _csCache;
    try {
        const r = await fetch('https://api.bybit.com/v5/market/tickers?category=linear');
        const d = await r.json();
        if (d.retCode !== 0) return [];
        _csCache = d.result.list
            .filter(t => t.symbol.endsWith('USDT') && !t.symbol.includes('-') && parseFloat(t.lastPrice) > 0)
            .map(t => ({
                symbol: t.symbol,
                coin:   t.symbol.replace('USDT', ''),
                price:  parseFloat(t.lastPrice),
                change: parseFloat(t.price24hPcnt) * 100,
                volume: parseFloat(t.turnover24h),
            }))
            .sort((a, b) => b.volume - a.volume);
    } catch(e) { _csCache = []; }
    return _csCache;
}

function onChartSearchInput(raw) {
    clearTimeout(_csTimer);
    _csTimer = setTimeout(() => _csRun(raw.trim().toUpperCase()), 120);
}

async function _csRun(q) {
    const el = document.getElementById('csearch-results');
    if (!q) {
        el.innerHTML = `<div style="padding:32px 0;text-align:center;font-size:11px;color:#4B5563;">${window.t('search_hint')}</div>`;
        return;
    }
    el.innerHTML = '<div style="padding:24px 0;text-align:center;font-size:11px;color:#6B7280;">⏳</div>';
    const coins = await _csLoadCache();
    const matches = coins.filter(c => c.coin.startsWith(q) || c.coin.includes(q) || _csNameMatch(c.symbol, q)).slice(0, 25);
    if (!matches.length) {
        el.innerHTML = `<div style="padding:32px 0;text-align:center;font-size:11px;color:#6B7280;">${window.t('search_no_results')} "<b style="color:#D1D5DB">${q}</b>"</div>`;
        return;
    }
    el.innerHTML = matches.map((c, i) => {
        const sgn  = c.change >= 0 ? '+' : '';
        const clr  = c.change >= 0 ? '#34d399' : '#f87171';
        const p    = c.price >= 1000 ? c.price.toLocaleString('en-US',{maximumFractionDigits:1})
                   : c.price >= 1    ? c.price.toFixed(3)
                   : c.price >= 0.01 ? c.price.toFixed(5)
                   :                   c.price.toFixed(7);
        const v    = c.volume >= 1e9 ? '$'+(c.volume/1e9).toFixed(1)+'B'
                   : c.volume >= 1e6 ? '$'+(c.volume/1e6).toFixed(0)+'M'
                   :                   '$'+(c.volume/1e3).toFixed(0)+'K';
        const navBtns = isMobile ? '' : `
            <button onclick="event.stopPropagation();window.open('trade?symbol=${c.symbol}','_blank')" style="font-size:11px;font-weight:600;color:#60a5fa;background:#1e3a5f;border:none;border-radius:3px;padding:1px 6px;cursor:pointer;flex-shrink:0;transition:background .15s;" onmouseover="this.style.background='#1e4a7a'" onmouseout="this.style.background='#1e3a5f'">Trade</button>`;
        return `<div data-idx="${i}" onclick="csSelectCoin('${c.symbol}')"
            style="display:flex;align-items:center;gap:10px;padding:9px 14px;cursor:pointer;border-bottom:1px solid #1E222D;transition:background .1s;"
            onmouseover="this.style.background='#1E222D'" onmouseout="this.style.background='transparent'">
            <span style="font-weight:700;font-size:13px;color:#E5E7EB;width:80px;flex-shrink:0;">${c.coin}<span style="color:#4B5563;font-weight:400;font-size:10px;">/USDT</span></span>
            ${navBtns}
            <span style="font-family:monospace;font-size:11px;color:#9CA3AF;">${p}</span>
            <span style="font-size:11px;font-weight:600;flex-shrink:0;color:${clr};">${sgn}${c.change.toFixed(2)}%</span>
            <span style="margin-left:auto;font-size:10px;color:#4B5563;flex-shrink:0;">${v}</span>
        </div>`;
    }).join('');
}

function onChartSearchKey(e) {
    if (e.key === 'Escape') { closeChartSearch(); return; }
    if (e.key === 'Enter') {
        const first = document.querySelector('#csearch-results [data-idx="0"]');
        if (first) first.click();
    }
}

function csSelectCoin(symbol) {
    closeChartSearch();
    window.location.href = `mtf?symbol=${symbol}`;
}

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeChartSearch();
    if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openChartSearch(); }
});
