// ── Day separator lines ────────────────────────────────────────────────────────
function getDayTimestamps(klines) {
    if (!klines || klines.length < 2) return [];
    const result = [];
    let prevDay = Math.floor(klines[0].time / 86400);
    for (let i = 1; i < klines.length; i++) {
        const day = Math.floor(klines[i].time / 86400);
        if (day !== prevDay) { result.push(klines[i].time); prevDay = day; }
    }
    return result;
}
class DayLinesPrimitive {
    constructor(dayTs, chart) {
        const renderer = {
            draw: target => target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, horizontalPixelRatio }) => {
                const ts = chart.timeScale();
                ctx.save();
                ctx.strokeStyle = 'rgba(255,255,255,0.08)';
                ctx.lineWidth = horizontalPixelRatio;
                for (const t of dayTs) {
                    const x = ts.timeToCoordinate(t);
                    if (x === null) continue;
                    const xPx = Math.round(x * horizontalPixelRatio) + 0.5;
                    if (xPx < 0 || xPx > bitmapSize.width) continue;
                    ctx.beginPath(); ctx.moveTo(xPx, 0); ctx.lineTo(xPx, bitmapSize.height); ctx.stroke();
                }
                ctx.restore();
            })
        };
        this._view = { renderer: () => renderer, zOrder: () => 'bottom' };
    }
    paneViews() { return [this._view]; }
    updateAllViews() {}
    attached() {}
    detached() {}
}
function attachDayLines(series, chart, klines, tf, prev) {
    if (prev) { try { series.detachPrimitive(prev); } catch(e) {} }
    if (tf === 'D' || tf === 'W' || tf === 'M' || !klines || klines.length < 2) return null;
    const dayTs = getDayTimestamps(klines);
    if (!dayTs.length) return null;
    const prim = new DayLinesPrimitive(dayTs, chart);
    try { series.attachPrimitive(prim); return prim; } catch(e) { return null; }
}

// ── helpers ────────────────────────────────────────────────────────────────────
function calcEMA(bars, period) {
  const k = 2/(period+1); let v = bars[0].close;
  return bars.map((b,i) => { if(i>0) v=b.close*k+v*(1-k); return {time:b.time,value:v}; });
}

const _DEFAULT_BB_CFG = { enabled: false, period: 20, mult: 2, color: '#60a5fa', width: 1, style: 0 };
function getBbCfg() {
  try { const s = JSON.parse(localStorage.getItem('chart_bb_cfg')); if (s) return { ..._DEFAULT_BB_CFG, ...s }; } catch(e) {}
  return { ..._DEFAULT_BB_CFG };
}

function calcBB(klines, period=20, mult=2) {
  const upper=[], mid=[], lower=[];
  for (let i=period-1; i<klines.length; i++) {
    const sl = klines.slice(i-period+1, i+1);
    const mean = sl.reduce((s,c)=>s+c.close,0)/period;
    const std  = Math.sqrt(sl.reduce((s,c)=>s+(c.close-mean)**2,0)/period);
    upper.push({time:klines[i].time, value:mean+mult*std});
    mid.push(  {time:klines[i].time, value:mean});
    lower.push({time:klines[i].time, value:mean-mult*std});
  }
  return {upper, mid, lower};
}

function toggleBB() {
  bbActive = !bbActive;
  const btn = document.getElementById('bb-btn');
  btn.style.color      = bbActive ? '#60a5fa' : '#B2B5BE';
  btn.style.background = bbActive ? '#1a3a5c' : '#2A2E39';
  const _bbCfg = getBbCfg();
  const lb = {priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false};
  slots.forEach(s => {
    if (bbActive) {
      s.bbSeries.upper = addS(s.chart,'LineSeries',{...lb,color:_bbCfg.color,lineWidth:_bbCfg.width,lineStyle:_bbCfg.style});
      s.bbSeries.mid   = addS(s.chart,'LineSeries',{...lb,color:_bbCfg.color,lineWidth:_bbCfg.width,lineStyle:2});
      s.bbSeries.lower = addS(s.chart,'LineSeries',{...lb,color:_bbCfg.color,lineWidth:_bbCfg.width,lineStyle:_bbCfg.style});
      if (s.klines.length >= _bbCfg.period) {
        const bb = calcBB(s.klines, _bbCfg.period, _bbCfg.mult);
        s.bbSeries.upper.setData(bb.upper);
        s.bbSeries.mid.setData(bb.mid);
        s.bbSeries.lower.setData(bb.lower);
      }
    } else {
      for (const k of ['upper','mid','lower']) {
        if (s.bbSeries[k]) { try { s.chart.removeSeries(s.bbSeries[k]); } catch(e) {} s.bbSeries[k]=null; }
      }
    }
  });
}

function addS(chart, type, opts) {
  if (typeof chart.addSeries==='function' && LC[type]) return chart.addSeries(LC[type], opts);
  const m = {CandlestickSeries:'addCandlestickSeries',LineSeries:'addLineSeries'};
  return chart[m[type]](opts);
}

// ── Candle Countdown Primitive ─────────────────────────────────────────────────
const _MTF_TF_SECS = {'1':60,'5':300,'30':1800,'60':3600,'240':14400,'D':86400,'W':604800};
function _mtfCdRemain(tf) {
    const now = Math.floor(Date.now()/1000), sec = _MTF_TF_SECS[tf];
    if (!sec) return 0;
    if (tf === 'W') { const d=new Date(now*1000),dow=d.getUTCDay(); return 604800-(((dow===0?6:dow-1)*86400+now%86400)%604800); }
    if (tf === 'D') return 86400-(now%86400);
    return sec-(now%sec);
}
function _mtfCdFmt(s) {
    if (s<=0) return '0:00';
    if (s>=3600) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),ss=s%60; return `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
    return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
}
class _MtfCountdownPrimitive {
    constructor(slot) { this._slot=slot; this._series=null; }
    attached({series}) { this._series=series; }
    detached() { this._series=null; }
    updateAllViews() {}
    paneViews() { return []; }
    priceAxisViews() {
        const s=this._slot;
        if (!this._series||!s.cfg?.tf||!s.lastPrice) return [];
        const y=this._series.priceToCoordinate(s.lastPrice);
        if (y==null) return [];
        const bull=s.lastOpen==null||s.lastPrice>=s.lastOpen;
        const rem=_mtfCdRemain(s.cfg.tf);
        return [{coordinate:()=>y+17,text:()=>_mtfCdFmt(rem),textColor:()=>'#FFFFFF',backColor:()=>bull?'#20B26C':'#EF454A'}];
    }
}

function makeChart(el, bigSlot) {
  const chart = LC.createChart(el, {
    autoSize: true,
    layout: {background:{color:'#101014'}, textColor:'#B2B5BE', fontSize: 13 },
    grid:   { vertLines:{color:'#FFFFFF0F'}, horzLines:{color:'#FFFFFF0F'} },
    crosshair: { mode: LC.CrosshairMode ? LC.CrosshairMode.Normal : 1 },
    rightPriceScale: { borderVisible:false, scaleMargins:{top:0.05,bottom:0.05}, autoScale:true },
    timeScale: {
      borderVisible:false, visible:true, timeVisible:true, secondsVisible:false,
      barSpacing: bigSlot ? 8 : 6, rightOffset: bigSlot ? 20 : 15,
    },
  });
  el.addEventListener('wheel', () => {
    requestAnimationFrame(() => { chart.priceScale('right').applyOptions({ autoScale: true }); });
  }, { passive: true });
  return chart;
}

function fmtPrice(p) {
  if (p>=10000) return p.toLocaleString('en-US',{maximumFractionDigits:1});
  if (p>=1)     return p.toFixed(3);
  if (p>=0.01)  return p.toFixed(5);
  return p.toFixed(7);
}

function fmtVol(v) {
  if (v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+(v/1e3).toFixed(0)+'K';
}

function fmtCountdown(secs) {
  if (secs <= 0) return '00:00';
  if (secs >= 3600) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }
  return `${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;
}

async function fetchMTFATHATL() {
  try {
    const r = await fetch(`api/ath-atl?symbol=${SYM}`);
    const j = await r.json();
    if (j.status === 'pending') { setTimeout(fetchMTFATHATL, 3000); return; }
    if (j.status !== 'ok') return;
    _mtfAthVal = j.ath; _mtfAtlVal = j.atl;
    const lv = getLvCfg();
    for (const s of slots) {
      if (!s.candleS) continue;
      if (s.athLine) { try { s.candleS.removePriceLine(s.athLine); } catch(e) {} s.athLine = null; }
      if (s.atlLine) { try { s.candleS.removePriceLine(s.atlLine); } catch(e) {} s.atlLine = null; }
      if (_mtfAthVal != null && lv.ath.vis?.mtf !== false) s.athLine = s.candleS.createPriceLine({price:_mtfAthVal, color:lv.ath.color, lineWidth:lv.ath.width, lineStyle:lv.ath.style, axisLabelVisible:false, title:''});
      if (_mtfAtlVal != null && lv.atl.vis?.mtf !== false) s.atlLine = s.candleS.createPriceLine({price:_mtfAtlVal, color:lv.atl.color, lineWidth:lv.atl.width, lineStyle:lv.atl.style, axisLabelVisible:false, title:''});
    }
  } catch(e) {}
}

async function loadSlot(idx, dailyData) {
  const s = slots[idx];
  try {
    const r = await fetch(`api/klines?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
    const j = await r.json();
    if (!j.success) return;
    const klines = j.data; if (!TZ_OFFSET_S && j.utc_offset_s) TZ_OFFSET_S = j.utc_offset_s;
    s.candleS.setData(klines);
    if (klines.length) { s.lastPrice = klines[klines.length-1].close; s.lastOpen = klines[klines.length-1].open; }
    s.klineCount = klines.length;
    s.klines = klines.slice();
    s.klinesVolMap = new Map(klines.map(k => [k.time, k.volume]));
    const _lastN = klines.slice(-20);
    s.avgVol = _lastN.length > 0 ? _lastN.reduce((acc,k) => acc+(k.volume||0), 0) / _lastN.length : 0;
    s.dayPrimitive = attachDayLines(s.candleS, s.chart, klines, s.cfg.tf, s.dayPrimitive);
    s.candleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
    for (const {p} of EMA_CFG) {
      const ema = calcEMA(klines, p);
      s.emaS[p].setData(ema);
      s.lastEMA[p] = ema[ema.length-1].value;
    }
    s.chart.timeScale().setVisibleLogicalRange({ from: klines.length - getCandlesForTF(s.cfg.tf), to: klines.length + 3 });

    // H / L / pH / pL lines
    if (dailyData) {
      const {today, prev} = dailyData;
      const _slvl = getLvCfg();
      if (_slvl.dayHigh.vis?.mtf  !== false) s.dayHighLine  = s.candleS.createPriceLine({price:today.high,color:_slvl.dayHigh.color, lineWidth:_slvl.dayHigh.width, lineStyle:_slvl.dayHigh.style, axisLabelVisible:false,title:''});
      if (_slvl.dayLow.vis?.mtf   !== false) s.dayLowLine   = s.candleS.createPriceLine({price:today.low, color:_slvl.dayLow.color,  lineWidth:_slvl.dayLow.width,  lineStyle:_slvl.dayLow.style,  axisLabelVisible:false,title:''});
      if (_slvl.prevHigh.vis?.mtf !== false) s.prevHighLine = s.candleS.createPriceLine({price:prev.high, color:_slvl.prevHigh.color,lineWidth:_slvl.prevHigh.width,lineStyle:_slvl.prevHigh.style,axisLabelVisible:false,title:''});
      if (_slvl.prevLow.vis?.mtf  !== false) s.prevLowLine  = s.candleS.createPriceLine({price:prev.low,  color:_slvl.prevLow.color, lineWidth:_slvl.prevLow.width, lineStyle:_slvl.prevLow.style, axisLabelVisible:false,title:''});
    }
  } catch(e) {
    console.error(`MTF load ${s.cfg.label} error:`, e);
  }
}

// ── WebSocket ──────────────────────────────────────────────────────────────────
let _wsPingTimer = null;

function openWS() {
  closeWS();
  setWSDot('connecting');
  ws = new WebSocket('wss://stream.bybit.com/v5/public/linear');
  ws.onopen = () => {
    setWSDot('live');
    ws.send(JSON.stringify({
      op: 'subscribe',
      args: TF_SLOTS.map(s => `kline.${s.tf}.${SYM}`),
    }));
    // Bybit requires application-level ping every 20s to keep connection alive
    _wsPingTimer = setInterval(() => {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send('{"op":"ping"}');
    }, 20000);
  };
  ws.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (!msg.topic || !msg.topic.startsWith('kline.')) return;
    const tf    = msg.topic.split('.')[1];
    const idx   = slots.findIndex(s => s.cfg.tf === tf);
    if (idx === -1) return;
    const b = msg.data[0];
    const confirmed = b.confirm === true || b.confirm === 'true';
    const candleStart = Math.floor(parseInt(b.start)/1000);
    const candle = {
      time:  candleStart + TZ_OFFSET_S,
      open:  parseFloat(b.open),
      high:  parseFloat(b.high),
      low:   parseFloat(b.low),
      close: parseFloat(b.close),
    };
    const s = slots[idx];
    s.lastCandleStartUtc = candleStart;
    s.lastWsMs = Date.now();
    s.candleS.update(candle);
    s.lastPrice = candle.close; s.lastOpen = candle.open;
    for (const {p} of EMA_CFG) {
      if (s.lastEMA[p] === null) continue;
      const k    = 2/(p+1);
      const live = candle.close * k + s.lastEMA[p] * (1-k);
      s.emaS[p].update({time: candle.time, value: live});
      if (confirmed) s.lastEMA[p] = live;
    }
    // aggiorna klines live
    if (s.klines.length > 0) {
      const last = s.klines[s.klines.length-1];
      if (last.time === candle.time) {
        s.klines[s.klines.length-1] = {time:candle.time,open:last.open,high:Math.max(last.high,candle.high),low:Math.min(last.low,candle.low),close:candle.close};
      } else {
        s.klines.push({...candle});
      }
    }
    if (bbActive && s.bbSeries.upper) {
      const _bb = getBbCfg();
      if (s.klines.length >= _bb.period) {
        const sl = s.klines.slice(-_bb.period);
        const mean = sl.reduce((a,c)=>a+c.close,0)/_bb.period;
        const std  = Math.sqrt(sl.reduce((a,c)=>a+(c.close-mean)**2,0)/_bb.period);
        s.bbSeries.upper.update({time:candle.time, value:mean+_bb.mult*std});
        s.bbSeries.mid.update(  {time:candle.time, value:mean});
        s.bbSeries.lower.update({time:candle.time, value:mean-_bb.mult*std});
      }
    }
  };
  ws.onerror = () => setWSDot('error');
  ws.onclose = () => {
    setWSDot('off');
    clearInterval(_wsPingTimer); _wsPingTimer = null;
    wsTimer = setTimeout(openWS, 5000);
  };
}

  // The backend WS (with ping_interval=20) stays connected reliably to Bybit;
  // the frontend polls it instead of depending on a direct browser→Bybit WS.
  async function _livePoll() {
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s.cfg.tf !== '1' && s.cfg.tf !== '5') continue;
      try {
        const r = await fetch(`api/klines/live?symbol=${SYM}&interval=${s.cfg.tf}&_t=${Date.now()}`);
        const j = await r.json();
        if (!j.success || !j.data || !j.data.length) continue;
        // Update last 10 candles — fills any gap and keeps live candle current
        for (const c of j.data) s.candleS.update(c);
        // Show live EMA for the current open candle
        const lc = j.data[j.data.length - 1];
        for (const {p} of EMA_CFG) {
          if (s.lastEMA[p] === null) continue;
          const kk = 2/(p+1);
          s.emaS[p].update({time: lc.time, value: lc.close * kk + s.lastEMA[p] * (1-kk)});
        }
        // Sync timer with actual Bybit candle start time from backend
        const utcStart = lc.time - (TZ_OFFSET_S || j.utc_offset_s || 0);
        if (s.lastCandleStartUtc === null || utcStart >= s.lastCandleStartUtc) {
          s.lastCandleStartUtc = utcStart;
          s.lastWsMs = Date.now();
        }
      } catch(e) {}
    }
    setTimeout(_livePoll, 5000);
  }
  setTimeout(_livePoll, 3000); // first poll 3s after initial load
});

// ── Range Prezzo Tool ─────────────────────────────────────────────────────────

function _drawRangeCanvas(canvas, series, p1, p2) {
  canvas.width  = canvas.clientWidth  || canvas.parentElement.clientWidth  || 100;
  canvas.height = canvas.clientHeight || canvas.parentElement.clientHeight || 100;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (p1 === null || p2 === null) return;

  let y1 = series.priceToCoordinate(p1);
  let y2 = series.priceToCoordinate(p2);
  if (y1 === null) y1 = p2 > p1 ? canvas.height : 0;
  if (y2 === null) y2 = p2 > p1 ? 0 : canvas.height;

  const top    = Math.min(y1, y2);
  const bottom = Math.max(y1, y2);
  const h      = Math.max(bottom - top, 1);
  const isUp   = p2 > p1;
  const color  = isUp ? '#20B26C' : '#EF454A';

  ctx.fillStyle = isUp ? 'rgba(8,153,129,0.12)' : 'rgba(242,54,69,0.12)';
  ctx.fillRect(0, top, canvas.width, h);

  ctx.strokeStyle = color;
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 3]);
  ctx.beginPath(); ctx.moveTo(0, y1); ctx.lineTo(canvas.width, y1); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, y2); ctx.lineTo(canvas.width, y2); ctx.stroke();
  ctx.setLineDash([]);

  const delta    = p2 - p1;
  const pct      = (delta / p1) * 100;
  const sign     = delta >= 0 ? '+' : '';
  const absDelta = Math.abs(delta);
  const dStr     = absDelta >= 100 ? delta.toFixed(1) : absDelta >= 1 ? delta.toFixed(2) : delta.toFixed(4);
  const label    = `${sign}${dStr}  (${sign}${pct.toFixed(2)}%)`;

  const fs  = Math.max(9, Math.min(12, Math.floor(h * 0.35)));
  ctx.font  = `bold ${fs}px monospace`;
  const tw  = ctx.measureText(label).width;
  const pad = 4;
  const lx  = canvas.width - tw - pad * 2 - 6;
  const ly  = top + h / 2;

  ctx.fillStyle = isUp ? 'rgba(8,153,129,0.88)' : 'rgba(242,54,69,0.88)';
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(lx - pad, ly - fs, tw + pad * 2, fs + 6, 3)
                : ctx.rect(lx - pad, ly - fs, tw + pad * 2, fs + 6);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.fillText(label, lx, ly);
}

// ── Trendline tool ────────────────────────────────────────────────────────────
const _TREND_HIT = 8;

function _trendSync(canvas) { const w = canvas.clientWidth, h = canvas.clientHeight; if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; } }

function _trendDrawExt(ctx, x1, y1, x2, y2, W, H, color, lw) {
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.beginPath();
  if (Math.abs(x2 - x1) < 0.5) { ctx.moveTo(x1, 0); ctx.lineTo(x1, H); }
  else { const m = (y2 - y1) / (x2 - x1); ctx.moveTo(0, y1 + m * -x1); ctx.lineTo(W, y1 + m * (W - x1)); }
  ctx.stroke();
}

function _trendDrawAll(s) {
  const canvas = s.trendCanvas; _trendSync(canvas);
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  for (const tl of s.trendlines) {
    try {
      const x1 = s.chart.timeScale().timeToCoordinate(tl.t1), y1 = s.candleS.priceToCoordinate(tl.p1);
      const x2 = s.chart.timeScale().timeToCoordinate(tl.t2), y2 = s.candleS.priceToCoordinate(tl.p2);
      if (x1==null||y1==null||x2==null||y2==null) continue;
      _trendDrawExt(ctx, x1, y1, x2, y2, W, H, '#22c55e', 1.5);
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI*2); ctx.fill();
    } catch(ex) {}
  }
  if (s._trendP1 && s._trendPrev) {
    try {
      const x1 = s.chart.timeScale().timeToCoordinate(s._trendP1.t), y1 = s.candleS.priceToCoordinate(s._trendP1.p);
      if (x1!=null && y1!=null) {
        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1; ctx.setLineDash([5,3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(s._trendPrev.x, s._trendPrev.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();
      }
    } catch(ex) {}
  }
}

function _ptSegDist(px, py, x1, y1, x2, y2) {
  const dx = x2-x1, dy = y2-y1, L2 = dx*dx+dy*dy;
  if (!L2) return Math.hypot(px-x1, py-y1);
  const t = Math.max(0, Math.min(1, ((px-x1)*dx+(py-y1)*dy)/L2));
  return Math.hypot(px-x1-t*dx, py-y1-t*dy);
}

function _trendNearest(s, cx, cy) {
  const rect = s.trendCanvas.getBoundingClientRect(), mx = cx-rect.left, my = cy-rect.top;
  let best = null, bestDist = _TREND_HIT, bestPart = 'line';
  for (const tl of s.trendlines) {
    try {
      const x1 = s.chart.timeScale().timeToCoordinate(tl.t1), y1 = s.candleS.priceToCoordinate(tl.p1);
      const x2 = s.chart.timeScale().timeToCoordinate(tl.t2), y2 = s.candleS.priceToCoordinate(tl.p2);
      if (x1==null||y1==null||x2==null||y2==null) continue;
      const d1 = Math.hypot(mx-x1, my-y1), d2 = Math.hypot(mx-x2, my-y2);
      if (d1 <= _TREND_HIT && d1 < bestDist) { best = tl; bestDist = d1; bestPart = 'p1'; }
      else if (d2 <= _TREND_HIT && d2 < bestDist) { best = tl; bestDist = d2; bestPart = 'p2'; }
      else { const dl = _ptSegDist(mx, my, x1, y1, x2, y2); if (dl < bestDist) { best = tl; bestDist = dl; bestPart = 'line'; } }
    } catch(ex) {}
  }
  return best ? { tl: best, part: bestPart } : null;
}

function toggleSlotTrend(idx) {
  const s = slots[idx]; if (!s) return;
  if (!s.trendActive) { if (s.rangeActive) toggleSlotRange(idx); if (s.hlineActive) toggleSlotHline(idx); }
  s.trendActive = !s.trendActive;
  s.trendBtn.style.color = s.trendActive ? '#22c55e' : '#4B5563';
  if (s._trendMD) { s.trendCanvas.removeEventListener('mousedown', s._trendMD); s._trendMD = null; }
  if (s._trendMM) { document.removeEventListener('mousemove', s._trendMM); s._trendMM = null; }
  if (s._trendMU) { document.removeEventListener('mouseup', s._trendMU); s._trendMU = null; }
  if (s._trendCM) { s.trendCanvas.removeEventListener('contextmenu', s._trendCM); s._trendCM = null; }
  s._trendP1 = null; s._trendPrev = null; s._trendDrag = null;
  s.trendCanvas.style.pointerEvents = s.trendActive ? 'auto' : 'none';
  s.trendCanvas.style.cursor = s.trendActive ? 'crosshair' : '';
  if (!s._trendSub) { s._trendSub = () => _trendDrawAll(s); try { s.chart.timeScale().subscribeVisibleTimeRangeChange(s._trendSub); } catch(ex) {} }
  _trendDrawAll(s);
  if (!s.trendActive) return;
  s._trendMD = e => {
    if (e.button !== 0) return; e.preventDefault();
    const rect = s.trendCanvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    const hit = _trendNearest(s, e.clientX, e.clientY);
    if (hit && !s._trendP1) {
      if (hit.part !== 'line') { s._trendDrag = { tl: hit.tl, part: hit.part }; s.trendCanvas.style.cursor = 'crosshair'; }
      else {
        const ox1 = s.chart.timeScale().timeToCoordinate(hit.tl.t1), oy1 = s.candleS.priceToCoordinate(hit.tl.p1);
        const ox2 = s.chart.timeScale().timeToCoordinate(hit.tl.t2), oy2 = s.candleS.priceToCoordinate(hit.tl.p2);
        s._trendDrag = { tl: hit.tl, part: 'line', sx: px, sy: py, ox1, oy1, ox2, oy2 };
        s.trendCanvas.style.cursor = 'move';
      }
    } else if (!s._trendP1) {
      const t = s.chart.timeScale().coordinateToTime(px), p = s.candleS.coordinateToPrice(py);
      if (t != null && p != null) s._trendP1 = { t, p };
    } else {
      const t2 = s.chart.timeScale().coordinateToTime(px), p2 = s.candleS.coordinateToPrice(py);
      if (t2 != null && p2 != null) {
        let pl1, pl2;
        try { pl1 = s.candleS.createPriceLine({ price: s._trendP1.p, color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {}
        try { pl2 = s.candleS.createPriceLine({ price: p2,           color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {}
        s.trendlines.push({ t1: s._trendP1.t, p1: s._trendP1.p, t2, p2, pl1, pl2 });
      }
      s._trendP1 = null; s._trendPrev = null;
      if (s._trendHoverLine) { try { s.candleS?.removePriceLine(s._trendHoverLine); } catch(e) {} s._trendHoverLine = null; }
      _trendDrawAll(s);
    }
  };
  s._trendMM = e => {
    const rect = s.trendCanvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    if (s._trendDrag) {
      if (!(e.buttons & 1)) { s._trendDrag = null; return; }
      const { tl, part } = s._trendDrag;
      if (part === 'p1') { const t=s.chart.timeScale().coordinateToTime(px),p=s.candleS.coordinateToPrice(py); if(t&&p){tl.t1=t;tl.p1=p; if(tl.pl1) try{tl.pl1.applyOptions({price:p});}catch(ex){}} }
      else if (part === 'p2') { const t=s.chart.timeScale().coordinateToTime(px),p=s.candleS.coordinateToPrice(py); if(t&&p){tl.t2=t;tl.p2=p; if(tl.pl2) try{tl.pl2.applyOptions({price:p});}catch(ex){}} }
      else { const dpx=px-s._trendDrag.sx,dpy=py-s._trendDrag.sy; const nt1=s.chart.timeScale().coordinateToTime(s._trendDrag.ox1+dpx),np1=s.candleS.coordinateToPrice(s._trendDrag.oy1+dpy); const nt2=s.chart.timeScale().coordinateToTime(s._trendDrag.ox2+dpx),np2=s.candleS.coordinateToPrice(s._trendDrag.oy2+dpy); if(nt1&&np1&&nt2&&np2){tl.t1=nt1;tl.p1=np1;tl.t2=nt2;tl.p2=np2; if(tl.pl1) try{tl.pl1.applyOptions({price:np1});}catch(ex){} if(tl.pl2) try{tl.pl2.applyOptions({price:np2});}catch(ex){}} }
      _trendDrawAll(s);
    } else if (s._trendP1) {
      s._trendPrev = { x: px, y: py };
      const hp = s.candleS?.coordinateToPrice(py);
      if (hp != null) {
        if (s._trendHoverLine) { try { s._trendHoverLine.applyOptions({ price: hp }); } catch(ex) {} }
        else { try { s._trendHoverLine = s.candleS.createPriceLine({ price: hp, color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {} }
      }
      _trendDrawAll(s);
    } else {
      if (s._trendHoverLine) { try { s.candleS?.removePriceLine(s._trendHoverLine); } catch(e) {} s._trendHoverLine = null; }
      const hit = _trendNearest(s, e.clientX, e.clientY);
      s.trendCanvas.style.cursor = hit ? (hit.part === 'line' ? 'move' : 'crosshair') : 'crosshair';
    }
  };
  s._trendMU = e => { if (e.button !== 0) return; s._trendDrag = null; s.trendCanvas.style.cursor = 'crosshair'; };
  s._trendCM = e => {
    e.preventDefault();
    if (s._trendP1) { s._trendP1 = null; s._trendPrev = null; if (s._trendHoverLine) { try { s.candleS?.removePriceLine(s._trendHoverLine); } catch(e) {} s._trendHoverLine = null; } _trendDrawAll(s); return; }
    const hit = _trendNearest(s, e.clientX, e.clientY);
    if (hit) { if(hit.tl.pl1) try{s.candleS.removePriceLine(hit.tl.pl1);}catch(e){} if(hit.tl.pl2) try{s.candleS.removePriceLine(hit.tl.pl2);}catch(e){} s.trendlines = s.trendlines.filter(tl => tl !== hit.tl); _trendDrawAll(s); }
    else toggleSlotTrend(idx);
  };
  s.trendCanvas.addEventListener('mousedown', s._trendMD);
  document.addEventListener('mousemove', s._trendMM);

}

function _fsTrendDrawAll() {
  const canvas = document.getElementById('fs-trend-canvas'); if (!canvas || !fsCandleS || !fsChart) return;
  _trendSync(canvas);
  const ctx = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  for (const tl of fsTrendlines) {
    try {
      const x1 = fsChart.timeScale().timeToCoordinate(tl.t1), y1 = fsCandleS.priceToCoordinate(tl.p1);
      const x2 = fsChart.timeScale().timeToCoordinate(tl.t2), y2 = fsCandleS.priceToCoordinate(tl.p2);
      if (x1==null||y1==null||x2==null||y2==null) continue;
      _trendDrawExt(ctx, x1, y1, x2, y2, W, H, '#22c55e', 1.5);
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y2, 4, 0, Math.PI*2); ctx.fill();
    } catch(ex) {}
  }
  if (_fsTrendP1 && _fsTrendPrev) {
    try {
      const x1 = fsChart.timeScale().timeToCoordinate(_fsTrendP1.t), y1 = fsCandleS.priceToCoordinate(_fsTrendP1.p);
      if (x1!=null && y1!=null) {
        ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 1; ctx.setLineDash([5,3]);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(_fsTrendPrev.x, _fsTrendPrev.y); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#22c55e'; ctx.beginPath(); ctx.arc(x1, y1, 4, 0, Math.PI*2); ctx.fill();
      }
    } catch(ex) {}
  }
}

function _fsTrendNearest(cx, cy) {
  const canvas = document.getElementById('fs-trend-canvas'); if (!canvas) return null;
  const rect = canvas.getBoundingClientRect(), mx = cx-rect.left, my = cy-rect.top;
  let best = null, bestDist = _TREND_HIT, bestPart = 'line';
  for (const tl of fsTrendlines) {
    try {
      const x1 = fsChart.timeScale().timeToCoordinate(tl.t1), y1 = fsCandleS.priceToCoordinate(tl.p1);
      const x2 = fsChart.timeScale().timeToCoordinate(tl.t2), y2 = fsCandleS.priceToCoordinate(tl.p2);
      if (x1==null||y1==null||x2==null||y2==null) continue;
      const d1 = Math.hypot(mx-x1, my-y1), d2 = Math.hypot(mx-x2, my-y2);
      if (d1 <= _TREND_HIT && d1 < bestDist) { best = tl; bestDist = d1; bestPart = 'p1'; }
      else if (d2 <= _TREND_HIT && d2 < bestDist) { best = tl; bestDist = d2; bestPart = 'p2'; }
      else { const dl = _ptSegDist(mx, my, x1, y1, x2, y2); if (dl < bestDist) { best = tl; bestDist = dl; bestPart = 'line'; } }
    } catch(ex) {}
  }
  return best ? { tl: best, part: bestPart } : null;
}

function toggleFsTrend() {
  if (!fsTrendActive) { if (fsRangeActive) toggleFsRange(); if (fsHlineActive) toggleFsHline(); }
  fsTrendActive = !fsTrendActive;
  const btn = document.getElementById('fs-trend-btn');
  const canvas = document.getElementById('fs-trend-canvas');
  btn.style.color = fsTrendActive ? '#22c55e' : '#B2B5BE';
  if (_fsTrendMD) { canvas.removeEventListener('mousedown', _fsTrendMD); _fsTrendMD = null; }
  if (_fsTrendMM) { document.removeEventListener('mousemove', _fsTrendMM); _fsTrendMM = null; }
  if (_fsTrendMU) { document.removeEventListener('mouseup', _fsTrendMU); _fsTrendMU = null; }
  if (_fsTrendCM) { canvas.removeEventListener('contextmenu', _fsTrendCM); _fsTrendCM = null; }
  _fsTrendP1 = null; _fsTrendPrev = null; _fsTrendDrag = null;
  canvas.style.pointerEvents = fsTrendActive ? 'auto' : 'none';
  canvas.style.cursor = fsTrendActive ? 'crosshair' : '';
  if (!_fsTrendSub) { _fsTrendSub = () => _fsTrendDrawAll(); try { fsChart.timeScale().subscribeVisibleTimeRangeChange(_fsTrendSub); } catch(ex) {} }
  _fsTrendDrawAll();
  if (!fsTrendActive) return;
  _fsTrendMD = e => {
    if (e.button !== 0) return; e.preventDefault();
    const rect = canvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    const hit = _fsTrendNearest(e.clientX, e.clientY);
    if (hit && !_fsTrendP1) {
      if (hit.part !== 'line') { _fsTrendDrag = { tl: hit.tl, part: hit.part }; canvas.style.cursor = 'crosshair'; }
      else {
        const ox1 = fsChart.timeScale().timeToCoordinate(hit.tl.t1), oy1 = fsCandleS.priceToCoordinate(hit.tl.p1);
        const ox2 = fsChart.timeScale().timeToCoordinate(hit.tl.t2), oy2 = fsCandleS.priceToCoordinate(hit.tl.p2);
        _fsTrendDrag = { tl: hit.tl, part: 'line', sx: px, sy: py, ox1, oy1, ox2, oy2 };
        canvas.style.cursor = 'move';
      }
    } else if (!_fsTrendP1) {
      const t = fsChart.timeScale().coordinateToTime(px), p = fsCandleS.coordinateToPrice(py);
      if (t != null && p != null) _fsTrendP1 = { t, p };
    } else {
      const t2 = fsChart.timeScale().coordinateToTime(px), p2 = fsCandleS.coordinateToPrice(py);
      if (t2 != null && p2 != null) {
        let pl1, pl2;
        try { pl1 = fsCandleS.createPriceLine({ price: _fsTrendP1.p, color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {}
        try { pl2 = fsCandleS.createPriceLine({ price: p2,           color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {}
        fsTrendlines.push({ t1: _fsTrendP1.t, p1: _fsTrendP1.p, t2, p2, pl1, pl2 });
      }
      _fsTrendP1 = null; _fsTrendPrev = null;
      if (_fsTrendHoverLine) { try { fsCandleS?.removePriceLine(_fsTrendHoverLine); } catch(e) {} _fsTrendHoverLine = null; }
      _fsTrendDrawAll();
    }
  };
  _fsTrendMM = e => {
    const rect = canvas.getBoundingClientRect(), px = e.clientX-rect.left, py = e.clientY-rect.top;
    if (_fsTrendDrag) {
      if (!(e.buttons & 1)) { _fsTrendDrag = null; return; }
      const { tl, part } = _fsTrendDrag;
      if (part === 'p1') { const t=fsChart.timeScale().coordinateToTime(px),p=fsCandleS.coordinateToPrice(py); if(t&&p){tl.t1=t;tl.p1=p; if(tl.pl1) try{tl.pl1.applyOptions({price:p});}catch(ex){}} }
      else if (part === 'p2') { const t=fsChart.timeScale().coordinateToTime(px),p=fsCandleS.coordinateToPrice(py); if(t&&p){tl.t2=t;tl.p2=p; if(tl.pl2) try{tl.pl2.applyOptions({price:p});}catch(ex){}} }
      else { const dpx=px-_fsTrendDrag.sx,dpy=py-_fsTrendDrag.sy; const nt1=fsChart.timeScale().coordinateToTime(_fsTrendDrag.ox1+dpx),np1=fsCandleS.coordinateToPrice(_fsTrendDrag.oy1+dpy); const nt2=fsChart.timeScale().coordinateToTime(_fsTrendDrag.ox2+dpx),np2=fsCandleS.coordinateToPrice(_fsTrendDrag.oy2+dpy); if(nt1&&np1&&nt2&&np2){tl.t1=nt1;tl.p1=np1;tl.t2=nt2;tl.p2=np2; if(tl.pl1) try{tl.pl1.applyOptions({price:np1});}catch(ex){} if(tl.pl2) try{tl.pl2.applyOptions({price:np2});}catch(ex){}} }
      _fsTrendDrawAll();
    } else if (_fsTrendP1) {
      _fsTrendPrev = { x: px, y: py };
      const hp = fsCandleS?.coordinateToPrice(py);
      if (hp != null) {
        if (_fsTrendHoverLine) { try { _fsTrendHoverLine.applyOptions({ price: hp }); } catch(ex) {} }
        else { try { _fsTrendHoverLine = fsCandleS.createPriceLine({ price: hp, color: '#22c55e', lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: '' }); } catch(ex) {} }
      }
      _fsTrendDrawAll();
    } else {
      if (_fsTrendHoverLine) { try { fsCandleS?.removePriceLine(_fsTrendHoverLine); } catch(e) {} _fsTrendHoverLine = null; }
      const hit = _fsTrendNearest(e.clientX, e.clientY);
      canvas.style.cursor = hit ? (hit.part === 'line' ? 'move' : 'crosshair') : 'crosshair';
    }
  };
  _fsTrendMU = e => { if (e.button !== 0) return; _fsTrendDrag = null; canvas.style.cursor = 'crosshair'; };
  _fsTrendCM = e => {
    e.preventDefault();
    if (_fsTrendP1) { _fsTrendP1 = null; _fsTrendPrev = null; if (_fsTrendHoverLine) { try { fsCandleS?.removePriceLine(_fsTrendHoverLine); } catch(e) {} _fsTrendHoverLine = null; } _fsTrendDrawAll(); return; }
    const hit = _fsTrendNearest(e.clientX, e.clientY);
    if (hit) { if(hit.tl.pl1) try{fsCandleS.removePriceLine(hit.tl.pl1);}catch(e){} if(hit.tl.pl2) try{fsCandleS.removePriceLine(hit.tl.pl2);}catch(e){} fsTrendlines = fsTrendlines.filter(tl => tl !== hit.tl); _fsTrendDrawAll(); }
    else toggleFsTrend();
  };
  canvas.addEventListener('mousedown', _fsTrendMD);
  document.addEventListener('mousemove', _fsTrendMM);
  document.addEventListener('mouseup', _fsTrendMU);
  canvas.addEventListener('contextmenu', _fsTrendCM);
}

// ── Price alert helpers ────────────────────────────────────────────────────────
function openAlertPopover(symbol, price, btn, slotIdx) {
  pendingAlert = { symbol, price, slotIdx };
  document.getElementById('alert-pop-symbol').textContent = symbol.replace('USDT','/USDT');
  document.getElementById('alert-pop-price').textContent  = fmtPrice(price);
  const pop  = document.getElementById('alert-popover');
  /* re-apply translations so popup always reflects current language */
  pop.querySelectorAll('[data-i18n]').forEach(function(el) {
    var k = el.getAttribute('data-i18n');
    if (window.T && window.T[k] !== undefined) el.textContent = window.T[k];
  });
  const rect = btn.getBoundingClientRect();
  const left = Math.max(4, Math.min(rect.left - 230, window.innerWidth - 250));
  const top  = Math.max(52, rect.top - 130);
  pop.style.left    = left + 'px';
  pop.style.top     = top  + 'px';
  pop.style.display = 'block';
}

function closeAlertPopover() {
  document.getElementById('alert-popover').style.display = 'none';
  pendingAlert = null;
}

function setNotifyMode(mode) {
  notifyMode = mode;
  const both    = document.getElementById('notify-both');
  const browser = document.getElementById('notify-browser');
  if (mode === 'both') {
    both.style.background = '#1d4ed8'; both.style.color = '#fff';
    browser.style.background = '#1E222D'; browser.style.color = '#6B7280';
  } else {
    both.style.background = '#1E222D'; both.style.color = '#6B7280';
    browser.style.background = '#1d4ed8'; browser.style.color = '#fff';
  }
}

async function confirmAlert(condition) {
  if (!pendingAlert) return;
  const { symbol, price } = pendingAlert;
  try {
    const r = await fetch('api/price-alerts', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ symbol, price, condition, notify: notifyMode }),
    });
    const j = await r.json();
    closeAlertPopover();
    if (j.success) {
      showToast(window.t('alert_set'));
      if (j.alert) {
        activeAlerts.push(j.alert);
        updateAlertsBadge();
        addAlertLineAllSlots(j.alert.id, price, condition);
      }
    } else {
      showToast('❌ ' + window.t('err_alert'));
    }
  } catch(e) { closeAlertPopover(); showToast('❌ ' + window.t('err_conn')); }
}

async function initNotifications() {
  if ('Notification' in window && Notification.permission === 'default')
    await Notification.requestPermission();
}

function fireBrowserNotification(alert) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const coin = alert.symbol.replace('USDT', '');
  const dir  = alert.condition === 'above' ? '📈' : '📉';
  new Notification(`${dir} Alert: ${coin}/USDT`, {
    body: `Prezzo ${alert.condition === 'above' ? 'sopra' : 'sotto'} ${alert.price}`,
  });
}

async function pollTriggeredAlerts() {
  try {
    const r = await fetch('api/price-alerts/recent-triggered');
    const j = await r.json();
    if (j.success && j.data && j.data.length) {
      for (const a of j.data) {
        fireBrowserNotification(a);
        for (const s of slots) {
          if (s.alertLines.has(a.id)) {
            try { s.candleS.removePriceLine(s.alertLines.get(a.id)); } catch(e) {}
            s.alertLines.delete(a.id);
          }
        }
        activeAlerts = activeAlerts.filter(x => x.id !== a.id);
      }
      updateAlertsBadge();
    }
  } catch(e) {}
  await syncAllAlertLines();
  setTimeout(pollTriggeredAlerts, 30000);
}

function addAlertLineAllSlots(alertId, price, condition) {
  for (const s of slots) {
    if (!s.candleS || s.alertLines.has(alertId)) continue;
    try {
      const pl = s.candleS.createPriceLine({
        price,
        color: condition === 'above' ? '#34d399' : '#f87171',
        lineWidth: 1,
        lineStyle: LC.LineStyle ? LC.LineStyle.Dashed : 2,
        axisLabelVisible: true,
        title: condition === 'above' ? '▲' : '▼',
      });
      s.alertLines.set(alertId, pl);
    } catch(e) {}
  }
}

async function syncAllAlertLines() {
  try {
    const r = await fetch('api/price-alerts');
    const j = await r.json();
    if (!j.success) return;
    activeAlerts = j.data;
    updateAlertsBadge();
    for (const a of j.data) {
      if (a.symbol === SYM) addAlertLineAllSlots(a.id, a.price, a.condition);
    }
  } catch(e) {}
}

function updateAlertsBadge() {
  const btn = document.getElementById('alerts-btn');
  if (!btn) return;
  const n = activeAlerts.filter(a => a.symbol === SYM).length;
  const svgBell = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 28" width="22" height="22" fill="none" style="display:block"><path fill="currentColor" d="M14 4c2.5 0 3 2.08 3 2.08 2.445 1.18 4 3.767 4 6.479v4.49a2.501 2.501 0 0 1-.244 4.938L20.5 22H17a3 3 0 1 1-6 0H7.5a2.5 2.5 0 0 1-.5-4.95v-4.491c0-2.712 1.554-5.3 4-6.479.002-.01.506-2.08 3-2.08m-2 18a2 2 0 1 0 4 0zm-4.5-4a1.5 1.5 0 0 0 0 3h13a1.5 1.5 0 0 0 0-3zM14 5c-.927 0-1.406.367-1.673.684a2 2 0 0 0-.35.617l-.008.026-.108.447-.426.206C9.35 7.986 8 10.213 8 12.56V17h12v-4.441c0-2.345-1.35-4.573-3.435-5.579l-.427-.206-.108-.448-.008-.025a2 2 0 0 0-.35-.617C15.406 5.367 14.927 5 14 5z"/></svg>`;
  btn.innerHTML = n > 0 ? `${svgBell}<span style="font-size:9px;line-height:1">${n}</span>` : svgBell;
  btn.style.cssText += ';display:flex;align-items:center;gap:2px;';
  btn.style.color = n > 0 ? '#fbbf24' : '#B2B5BE';

let _alertsPanelInterval = null;
function openAlertsPanel() {
  renderAlertsList();
  document.getElementById('alerts-panel').style.display = 'block';
  _alertsPanelInterval = setInterval(renderAlertsList, 2000);
}

function closeAlertsPanel() {
  document.getElementById('alerts-panel').style.display = 'none';
  clearInterval(_alertsPanelInterval);
}

function closePanelOutside(e) {
  if (e.target === document.getElementById('alerts-panel')) closeAlertsPanel();
}

function renderAlertsList() {
  const list = document.getElementById('alerts-list');
  if (!list) return;
  const mine = activeAlerts.filter(a => a.symbol === SYM);
  if (!mine.length) {
    list.innerHTML = '<div style="text-align:center;color:#6B7280;font-size:12px;padding:24px 0;">'+window.t('no_alert_active')+'</div>';
    return;
  }
  const _lp = (slots.find(s => s.lastPrice) || {}).lastPrice;
  list.innerHTML = mine.map(a => {
    const dirColor = a.condition === 'above' ? '#34d399' : '#f87171';
    const dirLabel = a.condition === 'above' ? window.t('alert_above_btn') : window.t('alert_below_btn');
    const notifyIcon = a.notify === 'browser' ? '🖥' : TGSVG;
    const dist = _lp ? ((a.price - _lp) / _lp * 100) : null;
    const distStr = dist !== null ? (dist >= 0 ? `+${dist.toFixed(2)}%` : `${dist.toFixed(2)}%`) : '';
    const distColor = dist >= 0 ? '#34d399' : '#f87171';
    return `<div style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid #1E222D;">
      <span style="font-size:11px;font-weight:700;color:#E5E7EB;min-width:70px;">${SYM.replace('USDT','/USDT')}</span>
      <span style="font-size:11px;color:${dirColor};font-weight:600;min-width:48px;">${dirLabel}</span>
      <div style="display:flex;flex-direction:column;flex:1;min-width:0;">
        <span style="font-size:11px;font-family:monospace;color:#fbbf24;">${fmtPrice(a.price)}</span>
        ${distStr ? `<span style="font-size:10px;font-family:monospace;color:${distColor};">${distStr}</span>` : ''}
      </div>
      <span style="font-size:12px;" title="${a.notify === 'browser' ? window.t('notify_pc_only') : 'Telegram + PC'}">${notifyIcon}</span>
      <button onclick="deleteAlert('${a.id}')" style="background:#3f1515;color:#f87171;border:1px solid #7f1d1d;border-radius:4px;padding:2px 8px;font-size:11px;cursor:pointer;flex-shrink:0;" onmouseenter="this.style.background='#7f1d1d'" onmouseleave="this.style.background='#3f1515'">✕</button>
    </div>`;
  }).join('');
}

async function deleteAlert(id) {
  try {
    await fetch(`api/price-alerts/${id}`, { method: 'DELETE' });
    for (const s of slots) {
      if (s.alertLines.has(id)) {
        try { s.candleS.removePriceLine(s.alertLines.get(id)); } catch(e) {}
        s.alertLines.delete(id);
      }
    }
    activeAlerts = activeAlerts.filter(a => a.id !== id);
    updateAlertsBadge();
    renderAlertsList();
  } catch(e) { showToast('❌ Errore eliminazione'); }
}

function showToast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1E222D;color:#E5E7EB;padding:8px 18px;border-radius:6px;font-size:13px;z-index:900;border:1px solid #2A2E39;pointer-events:none;opacity:1;transition:opacity .3s;';
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, 2500);
}

document.addEventListener('click', e => {
  const pop = document.getElementById('alert-popover');
  for (let i = 0; i < slots.length; i++) {
    const s = slots[i];
    if (!s.alertBtn || s.alertBtn.style.display === 'none') continue;
    const r = s.alertBtn.getBoundingClientRect();
    if (e.clientX >= r.left - 3 && e.clientX <= r.right  + 3 &&
        e.clientY >= r.top  - 3 && e.clientY <= r.bottom + 3) {
      const price = s.crosshairPrice || s.lastPrice;
      if (price) openAlertPopover(SYM, price, s.alertBtn, i);
      return;
    }
  }
  if (pop && pop.style.display !== 'none' && !pop.contains(e.target)) closeAlertPopover();
});

    document.body.appendChild(b);
  };
  mkBtn('left',  '‹', mobilePrevSlot);
  mkBtn('right', '›', mobileNextSlot);

  const ind = document.createElement('div');
  ind.id = 'mtf-indicator';
  ind.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(22,26,30,0.88);color:#B2B5BE;font-size:11px;padding:4px 14px;border-radius:12px;z-index:60;pointer-events:none;border:1px solid #2A2E39;';
  document.body.appendChild(ind);
  updateMTFIndicator();
}
</script>
