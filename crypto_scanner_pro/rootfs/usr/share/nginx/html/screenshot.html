<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Screenshot - Crypto Scanner Pro v4.2.4</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0F0F0F; color:#B2B5BE;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    width:1280px; height:760px; overflow:hidden;
  }
  #hdr {
    height:40px;
    background:#161A1E; border-bottom:1px solid #2A2E39;
    display:flex; align-items:center; gap:10px; padding:0 16px;
  }
  #chart { width:1280px; height:720px; }
</style>
<script src="https://unpkg.com/lightweight-charts@5/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

<div id="hdr">
  <span id="h-coin"   style="font-size:15px;font-weight:700;color:#E5E7EB;"></span>
  <span id="h-change" style="font-size:13px;font-weight:600;"></span>
  <span style="color:#374151;font-size:12px;">|</span>
  <span id="h-vol"    style="font-size:11px;color:#60a5fa;"></span>
  <span style="color:#374151;font-size:12px;">|</span>
  <span id="h-tf"     style="font-size:11px;color:#B2B5BE;background:#1E222D;padding:2px 7px;border-radius:3px;"></span>
  <div style="flex:1;"></div>
  <span id="h-price"  style="font-size:12px;color:#E5E7EB;font-family:monospace;"></span>
  <span style="color:#374151;font-size:12px;margin:0 6px;">|</span>
  <span id="h-time"   style="font-size:10px;color:#6B7280;"></span>
</div>

<div id="chart"></div>

<script>
const LC  = LightweightCharts;
let TZ_OFFSET_S = 0;
const qp  = new URLSearchParams(location.search);
const SYM = qp.get('symbol') || 'BTCUSDT';
const TF  = qp.get('interval') || '30';
const SIG       = qp.get('signal_type') || '';
const SIG_PRICE = parseFloat(qp.get('signal_price') || '0');
const SIG_COND  = qp.get('signal_condition') || 'above';
const SIG_TIME  = parseInt(qp.get('signal_time') || '0');

const TF_LABEL = {'1':'1m','5':'5m','15':'15m','30':'30m','60':'1h','240':'4h','D':'1D'};

function getPriceFormat(price) {
  const p = Math.abs(price || 0);
  if (p >= 100)   return { type:'price', precision:2, minMove:0.01 };
  if (p >= 10)    return { type:'price', precision:3, minMove:0.001 };
  if (p >= 1)     return { type:'price', precision:4, minMove:0.0001 };
  if (p >= 0.1)   return { type:'price', precision:5, minMove:0.00001 };
  if (p >= 0.01)  return { type:'price', precision:6, minMove:0.000001 };
  if (p >= 0.001) return { type:'price', precision:7, minMove:0.0000001 };
  return            { type:'price', precision:8, minMove:0.00000001 };
}

const EMA_CFG  = [
  {p:5,   color:'#ef4444', width:2},
  {p:10,  color:'#fbbf24', width:2},
  {p:60,  color:'#3b82f6', width:3},
  {p:223, color:'#a855f7', width:2.5},
];

function calcEMA(bars, period) {
  const k = 2/(period+1); let v = bars[0].close;
  return bars.map((b,i) => { if(i>0) v = b.close*k+v*(1-k); return {time:b.time,value:v}; });
}

function addS(chart, type, opts) {
  if (typeof chart.addSeries==='function' && LC[type]) return chart.addSeries(LC[type], opts);
  const m = {CandlestickSeries:'addCandlestickSeries',LineSeries:'addLineSeries'};
  return chart[m[type]](opts);
}

function fmtVol(v) {
  if (v>=1e9) return '$'+(v/1e9).toFixed(1)+'B';
  if (v>=1e6) return '$'+(v/1e6).toFixed(0)+'M';
  return '$'+(v/1e3).toFixed(0)+'K';
}

function fmtPrice(p) {
  if (p>=10000) return p.toLocaleString('en-US',{maximumFractionDigits:1});
  if (p>=1)     return p.toFixed(3);
  if (p>=0.01)  return p.toFixed(5);
  return p.toFixed(7);
}

async function init() {
  const coin = SYM.replace('USDT','');
  document.getElementById('h-coin').textContent = coin+'/USDT';
  document.getElementById('h-tf').textContent   = TF_LABEL[TF] || TF;

  const chart = LC.createChart(document.getElementById('chart'), {
    width: 1280,
    height: 720,
    layout: { background:{color:'#0F0F0F'}, textColor:'#B2B5BE', fontSize:11 },
    grid:   { vertLines:{color:'#FFFFFF0F'}, horzLines:{color:'#FFFFFF0F'} },
    crosshair: { mode: LC.CrosshairMode ? LC.CrosshairMode.Normal : 1 },
    rightPriceScale: { borderColor:'#2A2E39', scaleMargins:{top:0.05,bottom:0.05} },
    timeScale: {
      borderColor:'#2A2E39', visible:true, timeVisible:true,
      secondsVisible:false, barSpacing:6, rightOffset:30,
    },
  });

  const candleS = addS(chart, 'CandlestickSeries', {
    upColor:'#089981', downColor:'#F23645',
    borderVisible:false, wickUpColor:'#089981', wickDownColor:'#F23645',
  });
  const lineBase = {priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:false, autoscaleInfoProvider: () => null};
  const emaS = {};
  for (const {p,color,width} of EMA_CFG)
    emaS[p] = addS(chart, 'LineSeries', {...lineBase, color, lineWidth:width});

  class DayOpenLine {
    constructor(time) { this._time = time; this._chart = null; }
    attached({ chart }) { this._chart = chart; }
    detached() { this._chart = null; }
    updateAllViews() {}
    paneViews() {
      const self = this;
      return [{ renderer() { return { draw(target) {
        if (!self._chart) return;
        const x = self._chart.timeScale().timeToCoordinate(self._time);
        if (x === null) return;
        target.useBitmapCoordinateSpace(({ context: ctx, bitmapSize, horizontalPixelRatio: dpr }) => {
          const xb = Math.round(x * dpr);
          ctx.save();
          ctx.strokeStyle = 'rgba(255,255,255,0.35)';
          ctx.lineWidth = dpr;
          ctx.setLineDash([6 * dpr, 4 * dpr]);
          ctx.beginPath(); ctx.moveTo(xb, 0); ctx.lineTo(xb, bitmapSize.height); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = 'rgba(255,255,255,0.4)';
          ctx.font = `${10 * dpr}px monospace`;
          ctx.fillText('00:00', xb + 4 * dpr, bitmapSize.height - 6 * dpr);
          ctx.restore();
        });
      }}; } }];
    }
  }

  try {
    const [rk, rd, rt] = await Promise.all([
      fetch(`api/klines?symbol=${SYM}&interval=${TF}`),
      fetch(`api/klines?symbol=${SYM}&interval=D`),
      fetch(`api/ticker?symbol=${SYM}`),
    ]);

    const jk = await rk.json();
    const jd = await rd.json();
    const jt = await rt.json().catch(()=>null);

    if (jt && jt.success) {
      const pct = jt.change_24h;
      const el  = document.getElementById('h-change');
      el.textContent = (pct>=0?'+':'')+pct.toFixed(2)+'%';
      el.style.color = pct>=0 ? '#34d399' : '#f87171';
      document.getElementById('h-vol').textContent   = fmtVol(jt.volume_24h);
      document.getElementById('h-price').textContent = fmtPrice(jt.price);
    }

    if (jk.success) {
      TZ_OFFSET_S = jk.utc_offset_s ?? 0;
      const now = new Date();
      const localH = Math.floor((now.getTime()/1000 + TZ_OFFSET_S) % 86400 / 3600);
      const localM = Math.floor((now.getTime()/1000 + TZ_OFFSET_S) % 3600 / 60);
      const tzSign = TZ_OFFSET_S >= 0 ? '+' : '-';
      document.getElementById('h-time').textContent =
        String(localH).padStart(2,'0') + ':' + String(localM).padStart(2,'0') +
        ' UTC' + tzSign + Math.abs(Math.round(TZ_OFFSET_S / 3600));
      const klines = jk.data;
      candleS.setData(klines);
      candleS.applyOptions({ priceFormat: getPriceFormat(klines[klines.length-1]?.close) });
      for (const {p} of EMA_CFG) emaS[p].setData(calcEMA(klines, p));

      const nowUtcS = Math.floor(Date.now() / 1000);
      const dayStartUtcS = Math.floor(nowUtcS / 86400) * 86400;
      candleS.attachPrimitive(new DayOpenLine(dayStartUtcS));

      // Daily H/L lines: solo per alert EMA, non per livelli Terzo Tocco
      if (SIG !== 'price' && jd.success && jd.data && jd.data.length >= 2) {
        const today = jd.data[jd.data.length-1];
        const prev  = jd.data[jd.data.length-2];
        candleS.createPriceLine({price:today.high,color:'#22c55e',lineWidth:2,lineStyle:0,axisLabelVisible:false,title:''});
        candleS.createPriceLine({price:today.low, color:'#ef4444',lineWidth:2,lineStyle:0,axisLabelVisible:false,title:''});
        candleS.createPriceLine({price:prev.high, color:'#22c55e',lineWidth:2,lineStyle:2,axisLabelVisible:false,title:''});
        candleS.createPriceLine({price:prev.low,  color:'#ef4444',lineWidth:2,lineStyle:2,axisLabelVisible:false,title:''});
      }

      if (SIG === 'price' && SIG_PRICE > 0) {
        const clr      = SIG_COND === 'above' ? '#34d399' : '#f87171';
        const lastTime = klines[klines.length - 1].time;
        const timeStep = klines.length > 1 ? klines[klines.length-1].time - klines[klines.length-2].time : 60;
        const startTime = (SIG_TIME > 0 && SIG_TIME >= klines[0].time)
                          ? SIG_TIME : klines[0].time;
        const futureTime = lastTime + timeStep * 30;
        const lvlS = addS(chart, 'LineSeries', {
          color: clr, lineWidth: 2,
          lineStyle: LC.LineStyle ? LC.LineStyle.Dashed : 2,
          priceLineVisible: false, lastValueVisible: false,
          crosshairMarkerVisible: false, title: '',
        });
        lvlS.setData([
          { time: startTime,  value: SIG_PRICE },
          { time: futureTime, value: SIG_PRICE },
        ]);
      }

      const len = klines.length;
      const visibleBars = TF === 'D' ? 50 : TF === '240' ? 65 : 80;
      chart.timeScale().setVisibleLogicalRange({ from: len - visibleBars, to: len + 8 });
    }
  } catch(e) {
    console.error('Chart init error:', e);
  }

  document.body.dataset.ready = '1';
}

init();
</script>
</body>
</html>
